# Configuração do actions/dependency-review-action (SCA em Pull Requests).
# Política documentada em docs/security-baseline-ghe.md, seção 13.
#
# - fail-on-severity: severidade mínima que bloqueia o merge (high => bloqueia
#   high e critical). Rebaixar exige Exception Record aprovado
#   (.github/security-exceptions.json).
# - fail-on-scopes: escopos de dependência avaliados.
# - allow-licenses: política de licenças já vigente neste repositório
#   (mantida de .github/workflows/dependency-review.yml).
# - deny-packages / deny-groups: dependências proibidas (formato purl, ex.:
#   "pkg:npm/pacote-proibido"). Inclusões só via PR revisado por CODEOWNERS.
fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
vulnerability-check: true
license-check: true
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MPL-2.0
  - LGPL-2.1
  - LGPL-3.0
  - CC0-1.0
  - Unlicense
