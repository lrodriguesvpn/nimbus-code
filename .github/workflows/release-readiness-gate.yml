name: Release readiness gate

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate release readiness
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            const labels = (pr.labels || []).map((l) => l.name);
            const releaseLabels = labels.filter((l) =>
              ["release:major", "release:minor", "release:patch", "release:skip"].includes(l),
            );

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = files.map((f) => f.filename);

            const releaseSurfacePrefixes = ["presets/", "extensions/", "workflows/", "bundles/"];
            const releaseSurfaceFiles = [
              "scripts/validate-versions.sh",
              "scripts/setup-github-labels.sh",
              "README.md",
              "docs/developer-guide.md",
              "docs/FAQ.md",
            ];

            const touchesReleaseSurface = changed.some(
              (file) =>
                releaseSurfacePrefixes.some((p) => file.startsWith(p)) || releaseSurfaceFiles.includes(file),
            );

            if (!touchesReleaseSurface) {
              core.info("No release surface changes detected.");
              return;
            }

            const versionFiles = [
              "bundles/nimbus-code-project-bundle/bundle.yml",
              "bundles/nimbus-code-platform-bundle/bundle.yml",
              "presets/nimbus-code-standards/preset.yml",
              "presets/nimbus-code-platform-standards/preset.yml",
              "extensions/nimbus-code-backlog-sync/extension.yml",
              "workflows/nimbus-code-full-cycle/workflow.yml",
            ];
            const catalogFiles = [
              "bundles/catalog.json",
              "presets/catalog.json",
              "extensions/catalog.json",
              "workflows/catalog.json",
            ];

            const touchedVersionFile = changed.some((f) => versionFiles.includes(f));
            const touchedCatalogFile = changed.some((f) => catalogFiles.includes(f));

            if (releaseLabels.length !== 1) {
              if (!touchedVersionFile && !touchedCatalogFile) {
                core.info("Docs-only release surface change detected. Auto-labeling with release:skip.");
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: ["release:skip"],
                });
                return;
              }
              if (releaseLabels.length === 0 && touchedVersionFile && touchedCatalogFile) {
                core.info("Versioned release surface change detected. Auto-labeling with release:patch.");
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: ["release:patch"],
                });
                return;
              }
              core.setFailed(
                `PR toca superfície de release e deve ter exatamente 1 label release:* (major|minor|patch|skip). Labels encontrados: ${releaseLabels.join(", ") || "nenhum"}`,
              );
              return;
            }

            if (releaseLabels[0] !== "release:skip") {
              if (!touchedVersionFile) {
                core.setFailed(
                  `PR classificada como ${releaseLabels[0]} deve alterar ao menos um arquivo de versão (bundle/preset/workflow/extension).`,
                );
                return;
              }
              if (!touchedCatalogFile) {
                core.setFailed(
                  `PR classificada como ${releaseLabels[0]} deve atualizar ao menos um catalog.json (bundles/presets/extensions/workflows).`,
                );
                return;
              }
            }

            core.info(`Release readiness ok with ${releaseLabels[0]}.`);
