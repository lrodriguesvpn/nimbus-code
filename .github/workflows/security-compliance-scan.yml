name: Varredura semanal de conformidade de segurança

# Varre periodicamente os repositórios da organização (escopo piloto ou
# org-wide, conforme o flag de rollout) em busca de não conformidades com o
# baseline de segurança documentado em docs/security-baseline-ghe.md. NUNCA
# corrige nada automaticamente —
# apenas detecta e reporta, criando/atualizando Issues idempotentes por
# repositório (ver specs/007-controle-seguranca-ghe-projetos-plataforma/
# contracts/finding-schema.md e contracts/weekly-scan-workflow-contract.md).
#
# Controles de repositório avaliados (issue #450 — ver seção 5 do baseline):
#   branch-protection-default, branch-protection-required-patterns,
#   rulesets-configured, required-review, required-pr-checks,
#   required-test-checks, required-coverage-check, codeql-enabled,
#   codeql-recent, codeql-alerts, dependabot-alerts-enabled,
#   dependabot-security-updates-enabled, dependency-review-enabled,
#   secret-scanning-enabled, secret-scanning-push-protection-enabled,
#   secret-alerts, actions-permissions, secrets-configured
# + governança do Projeto Plataforma (platform-project-access) e relatório
# mensal consolidado. Branches, padrões protegidos e checks esperados vêm de
# .github/security-governance.json de cada repositório (fallback: o arquivo
# deste repositório, SECURITY_SCAN_GOVERNANCE_CONFIG).
#
# Permissões do GitHub App (todas READ-ONLY — ver ADR-0008): Metadata,
# Administration, Contents, Secrets, Code scanning alerts, Dependabot alerts,
# Secret scanning alerts; na organização, Projects. Nenhuma permissão de
# escrita em configurações de segurança. Issues: write é exigido apenas no
# repositório que hospeda os relatórios (issues de não conformidade).
#
# Pré-requisitos (3 secrets — GitHub App dedicado, ver ADR-0008):
#   - SECURITY_SCAN_APP_ID
#   - SECURITY_SCAN_APP_PRIVATE_KEY
#   - SECURITY_SCAN_APP_INSTALLATION_ID
# O GitHub App "Nimbus Code Security Auditor" precisa ser criado manualmente
# na organização e instalado ANTES de configurar os secrets acima (task T004,
# manual — ver docs/adr/0008-github-app-para-varredura-de-seguranca-org-wide.md
# e specs/007-controle-seguranca-ghe-projetos-plataforma/quickstart.md).
# Sem esses secrets, este workflow falha explicitamente (não silenciosamente).
#
# Rollout: por padrão roda em --scope=pilot (bounded context
# spec-kit-workflow, ver docs/bounded-contexts.yaml). A expansão para
# --scope=org-wide (100% dos repositórios da organização) é um gate S4 que
# exige aprovação humana obrigatória (task T038 do tasks.md desta feature) —
# não alterar o default deste workflow sem essa aprovação registrada.

on:
  schedule:
    - cron: "0 13 * * 1" # toda segunda-feira, 10h BRT
  workflow_dispatch:
    inputs:
      scope:
        description: "Escopo da varredura"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - pilot
          - org-wide
      dry_run:
        description: "Rodar em modo dry-run (não cria/atualiza issues)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # O GitHub App da varredura é somente leitura. A escrita de issues de não
    # conformidade/relatório mensal acontece APENAS no repositório que hospeda
    # este workflow, com o GITHUB_TOKEN efêmero do job (issues: write).
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verificar secrets obrigatórios
        run: |
          if [ -z "${{ secrets.SECURITY_SCAN_APP_ID }}" ]; then
            echo "::error::Secret SECURITY_SCAN_APP_ID não configurado. Crie o GitHub App \"Nimbus Code Security Auditor\" (ver docs/adr/0008-github-app-para-varredura-de-seguranca-org-wide.md, task T004) e configure o secret em Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.SECURITY_SCAN_APP_PRIVATE_KEY }}" ]; then
            echo "::error::Secret SECURITY_SCAN_APP_PRIVATE_KEY não configurado. Gere a chave privada (.pem) do GitHub App e configure-a como secret (nunca em texto plano no repositório)."
            exit 1
          fi
          if [ -z "${{ secrets.SECURITY_SCAN_APP_INSTALLATION_ID }}" ]; then
            echo "::error::Secret SECURITY_SCAN_APP_INSTALLATION_ID não configurado. Instale o GitHub App na organização e configure o Installation ID exibido na página do App."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Rodar varredura de conformidade de segurança
        env:
          GH_HOST: venha-pra-nuvem.ghe.com
          SECURITY_SCAN_APP_ID: ${{ secrets.SECURITY_SCAN_APP_ID }}
          SECURITY_SCAN_APP_PRIVATE_KEY: ${{ secrets.SECURITY_SCAN_APP_PRIVATE_KEY }}
          SECURITY_SCAN_APP_INSTALLATION_ID: ${{ secrets.SECURITY_SCAN_APP_INSTALLATION_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SECURITY_SCAN_GOVERNANCE_CONFIG: .github/security-governance.json
          SECURITY_SCAN_ISSUES_TOKEN: ${{ github.token }}
          SECURITY_SCAN_ISSUE_TARGET: report-repository
          SCOPE_INPUT: ${{ github.event.inputs.scope }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "${SCOPE_INPUT}" ] && [ "${SCOPE_INPUT}" != "auto" ]; then
            ARGS+=("--scope=${SCOPE_INPUT}")
          fi
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          bash scripts/security-compliance-scan.sh "${ARGS[@]}"
