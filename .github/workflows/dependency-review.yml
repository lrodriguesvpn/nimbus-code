name: Dependency Review — Segurança de Supply Chain

# Bloqueia PRs que introduzem dependências com vulnerabilidades CVE High/Critical.
# Complementa o DevSecOps Gate: PRs com dependências vulneráveis não passam
# pelo gate mesmo que o código em si não tenha problemas.
#
# Instalar nos repositórios de projeto junto com graph-guard.yml:
#   cp .github/workflows/dependency-review.yml <repo>/.github/workflows/
#
# Requer: repositório com Dependency Graph habilitado (Settings → Security).

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-dependency-review-support:
    name: Detectar suporte a Dependency Review
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.support.outputs.supported }}

    steps:
      - name: Verificar suporte a Dependency Review
        id: support
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_GRAPH_SBOM_URL: ${{ github.api_url }}/repos/${{ github.repository }}/dependency-graph/sbom
        run: |
          set -euo pipefail

          HTTP_CODE="$(
            curl -sS \
              -u "x-access-token:${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o /tmp/dependency-graph-sbom.json \
              -w "%{http_code}" \
              "${DEPENDENCY_GRAPH_SBOM_URL}"
          )"

          if [[ "${HTTP_CODE}" =~ ^20[02]$ ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MESSAGE="$(
            if [[ ! -f /tmp/dependency-graph-sbom.json ]]; then
              echo "Dependency Graph/SBOM endpoint indisponível."
            elif ! jq -e . /tmp/dependency-graph-sbom.json >/dev/null 2>&1; then
              echo "Dependency Graph/SBOM endpoint retornou uma resposta não-JSON."
            else
              jq -r '.message // "Dependency Graph/SBOM endpoint indisponível."' /tmp/dependency-graph-sbom.json
            fi
          )"

          echo "supported=false" >> "$GITHUB_OUTPUT"
          {
            echo "### ⚠️ Dependency Review ignorado"
            echo
            echo "O endpoint de Dependency Graph/SBOM não está disponível para este repositório."
            echo "Status HTTP: ${HTTP_CODE}"
            echo
            echo "> ${MESSAGE}"
            echo
            echo "Habilite **Dependency Graph** e **GitHub Advanced Security** para ativar este gate."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Dependency Review ignorado: ${MESSAGE} (HTTP ${HTTP_CODE})."

  dependency-review:
    name: Dependency Review — CVE High/Critical
    runs-on: ubuntu-latest
    needs: detect-dependency-review-support
    if: needs.detect-dependency-review-support.outputs.supported == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Bloqueia dependências com severidade High ou Critical
          fail-on-severity: high

          # Permite licenças open-source comuns (ajustar conforme política de IP)
          allow-licenses: >-
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            MPL-2.0,
            LGPL-2.1,
            LGPL-3.0,
            CC0-1.0,
            Unlicense

          # Comentar na PR com resumo de vulnerabilidades encontradas
          comment-summary-in-pr: always
