name: Validate Versions

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'bundles/**/bundle.yml'
      - 'presets/**/preset.yml'
      - 'bundles/catalog.json'
      - 'presets/catalog.json'
      - '.github/workflows/validate-versions.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'bundles/**/bundle.yml'
      - 'presets/**/preset.yml'
      - 'bundles/catalog.json'
      - 'presets/catalog.json'

jobs:
  validate-versions:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yq jq
      
      - name: Run version validator
        run: |
          ./scripts/validate-versions.sh
        continue-on-error: false
      
      - name: Check git tag alignment
        run: |
          BUNDLE_VERSION=$(yq '.bundle.version' bundles/nimbus-code-project-bundle/bundle.yml)
          CURRENT_TAG=$(git describe --tags 2>/dev/null || echo "NOTAG")
          EXPECTED_TAG="v$BUNDLE_VERSION"
          
          echo "Bundle version: $BUNDLE_VERSION"
          echo "Current git tag: $CURRENT_TAG"
          echo "Expected git tag: $EXPECTED_TAG"
          
          if [ "$CURRENT_TAG" != "NOTAG" ] && [ "$CURRENT_TAG" != "$EXPECTED_TAG" ]; then
            echo "::warning::Git tag ($CURRENT_TAG) doesn't match bundle version ($EXPECTED_TAG)"
          fi
      
      - name: Report success
        if: success()
        run: |
          echo "✅ All version checks passed!"
