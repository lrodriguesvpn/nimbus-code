name: Auto-Sync Satellite Preset Version

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Satellite repo to sync (owner/repo format)'
        required: true
      target_version:
        description: 'Target version (default: 1.18.0)'
        required: false
        default: '1.18.0'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-sync-drifted-repos:
    name: Create auto-sync PRs for drifted repos
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && 
       contains(github.event.issue.title, 'out of sync') &&
       github.event.action == 'opened') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse drifted repos from issue
        id: parse
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "repos=${{ github.event.inputs.repo }}" >> $GITHUB_OUTPUT
            echo "target_version=${{ github.event.inputs.target_version }}" >> $GITHUB_OUTPUT
          else
            # Extract repo names from artifact URL in issue (if available)
            echo "repos=pending-from-issue" >> $GITHUB_OUTPUT
            echo "target_version=1.18.0" >> $GITHUB_OUTPUT
          fi

      - name: Check for active development in satellite repo
        id: check_active
        run: |
          REPO="${{ steps.parse.outputs.repos }}"
          if [[ "$REPO" != "pending-from-issue" ]]; then
            # Check if there are open PRs in the satellite repo
            open_prs=$(gh pr list --repo "$REPO" --state open | wc -l)
            if [ $open_prs -gt 0 ]; then
              echo "active=true" >> $GITHUB_OUTPUT
              echo "⚠️  Repo $REPO has $open_prs active PRs, skipping auto-sync"
            else
              echo "active=false" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create sync PR if not in active development
        if: steps.check_active.outputs.active == 'false'
        run: |
          REPO="${{ steps.parse.outputs.repos }}"
          TARGET_VERSION="${{ steps.parse.outputs.target_version }}"
          
          if [[ "$REPO" == "pending-from-issue" ]]; then
            echo "Skipping: repos to sync must be provided via workflow_dispatch"
            exit 0
          fi
          
          BRANCH="fix/preset-sync-to-v${TARGET_VERSION}"
          PR_TITLE="fix(preset): sync to v${TARGET_VERSION}"
          
          # Checkout satellite repo
          gh repo clone "$REPO" /tmp/satellite-repo
          cd /tmp/satellite-repo
          
          # Create sync branch
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          
          # Run preset refresh (assuming bootstrap.sh exists)
          if [ -f "bootstrap.sh" ]; then
            chmod +x bootstrap.sh
            ./bootstrap.sh --refresh-preset || true
          fi
          
          # If there are changes, create PR
          if ! git diff --quiet; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "chore(preset): refresh to v${TARGET_VERSION}

Automated sync by satellite preset audit.
Closes: ${{ github.server_url }}/${{ github.repository }}/issues/${{ github.event.issue.number }}"
            
            git push origin "$BRANCH" --force
            
            gh pr create \
              --title "$PR_TITLE" \
              --body "Automated preset version sync to v${TARGET_VERSION}

Generated by: Satellite Preset Audit
Audit Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${{ github.event.issue.number }}

Please review and merge to keep preset in sync." \
              --label "sync:preset-version" \
              --label "type:automation" \
              || echo "PR may already exist"
          else
            echo "✓ No changes needed, preset already at v${TARGET_VERSION}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
