name: Propose Satellite Preset Sync (Manual)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Approved pilot satellite (owner/repo); same organization only'
        required: true
        type: string
      target_version:
        description: 'Version X.Y.Z matching the selected central bundle checkout'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: satellite-preset-sync-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  disabled:
    if: vars.NIMBUS_SATELLITE_SYNC_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Sync disabled by default. Human pilot approval (#433/#445) and explicit repository-variable opt-in are required."
  sync:
    if: vars.NIMBUS_SATELLITE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      NIMBUS_SATELLITE_SYNC_ENABLED: ${{ vars.NIMBUS_SATELLITE_SYNC_ENABLED }}
      NIMBUS_APP_CONFIGURED: ${{ secrets.NIMBUS_APP_ID != '' && secrets.NIMBUS_APP_PRIVATE_KEY != '' }}
      TARGET_REPO: ${{ inputs.repo }}
      TARGET_VERSION: ${{ inputs.target_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate manual inputs before authentication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || exit 2
          [[ "${TARGET_REPO%%/*}" == "$GITHUB_REPOSITORY_OWNER" ]] || exit 2
          [[ "$TARGET_REPO" != "$GITHUB_REPOSITORY" ]] || exit 2
          [[ "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          version="$(python3 scripts/preset-audit-report.py version presets/nimbus-code-standards/preset.yml)"
          [[ "$TARGET_VERSION" == "$version" ]] || { echo "::error::Requested version differs from bundle checkout"; exit 2; }
          echo "repository_name=${TARGET_REPO#*/}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bundle-pinned Spec Kit CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open(".specify/integration.json"))["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid bundle CLI version"; exit 2; }
          python3 -m pip install --no-cache-dir "git+https://github.com/github/spec-kit.git@v${version}"
          specify preset --help >/dev/null
      - name: Generate GitHub App installation token
        id: app-token
        if: env.NIMBUS_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NIMBUS_APP_ID }}
          private-key: ${{ secrets.NIMBUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.repository_name }}
          github-api-url: ${{ github.api_url }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Propose managed refresh via reviewed PR
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.VPNDEV_PROJECT_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$APP_TOKEN" ]]; then
            export GH_TOKEN="$APP_TOKEN"
          elif [[ -n "$PAT_TOKEN" ]]; then
            export GH_TOKEN="$PAT_TOKEN"
            echo "::warning::Using existing VPNDEV_PROJECT_TOKEN fallback; human write-permission validation required."
          else
            echo "::error::No cross-repo App/PAT credential. Pilot blocked (#433/#445); GITHUB_TOKEN cannot replace it."
            exit 2
          fi
          export GH_HOST="${SERVER_URL#https://}"
          bash scripts/sync-satellite-preset.sh "$TARGET_REPO" "$TARGET_VERSION" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/satellite-checkout"
