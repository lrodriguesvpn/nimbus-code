name: Context Graph Refresh — Grafo de Repos por Bounded Context

# Quando docs/bounded-contexts.yaml é alterado numa PR, roda
# scripts/generate-context-graph.sh para cada bounded context afetado e
# publica os arquivos graph.yaml/graph.md atualizados como artefato da run —
# NUNCA commita automaticamente (a revisão do grafo gerado acontece via
# download do artefato + PR manual, mantendo o "git diff como gate de
# revisão" já usado pelo bundle, ver ADL-003 de
# specs/014-brownfield-multirepo-context-awareness/plan.md).
#
# Este workflow NUNCA invoca scripts/harvest-patterns.sh — harvest é
# exclusivamente on-demand e humano-iniciado (FR-011).

on:
  pull_request:
    branches: ["**"]
    paths:
      - "docs/bounded-contexts.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  context-graph-refresh:
    name: Gerar Grafo dos Bounded Contexts Alterados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências Python (pyyaml)
        run: python3 -m pip install --user --quiet pyyaml

      - name: Listar bounded contexts declarados
        id: contexts
        run: |
          slugs=$(python3 -c "
          import yaml
          d = yaml.safe_load(open('docs/bounded-contexts.yaml'))
          for c in (d.get('contexts') or []):
              print(c.get('slug', ''))
          ")
          echo "slugs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$slugs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Gerar grafo para cada bounded context
        run: |
          mkdir -p /tmp/context-graphs
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            echo "==> Gerando grafo para bounded context '$slug'..."
            ./scripts/generate-context-graph.sh "$slug" --out-dir "/tmp/context-graphs/$slug" || \
              echo "::warning::generate-context-graph.sh falhou para '$slug' — ver log acima"
          done <<< "${{ steps.contexts.outputs.slugs }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar grafos gerados como artefato
        uses: actions/upload-artifact@v4
        with:
          name: context-graphs
          path: /tmp/context-graphs/
          retention-days: 14
