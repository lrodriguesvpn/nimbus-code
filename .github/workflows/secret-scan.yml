name: Secret Scan — Verificação complementar de secrets

# Verificação de secrets expostos no código (docs/security-baseline-ghe.md,
# seção 14). COMPLEMENTA — não substitui — o GitHub Secret Scanning e a Push
# Protection nativos do GHE (esses são habilitados em Settings → Code
# security e verificados pela varredura semanal: controles
# secret-scanning-enabled, secret-scanning-push-protection-enabled e
# secret-alerts). Também não tem relação com o controle secrets-configured,
# que só verifica a EXISTÊNCIA de GitHub Actions secrets.
#
# - PR: varre somente os commits introduzidos pelo PR (base..head) e publica o
#   check estável `secret-scan` — falha se houver tentativa de introdução de
#   secret.
# - push na branch padrão / merge queue: varre o intervalo de commits enviado.
# - semanal / manual: varre a árvore atual inteira.
# - Ferramenta: gitleaks CLI (licença MIT; o binário não exige licença),
#   versão e checksum SHA-256 pinados. Relatório SARIF sempre REDIGIDO
#   (--redact) — nenhum valor de secret vai para log ou artefato.
# - Nenhum secret/PAT é usado por este workflow.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  merge_group: {}
  schedule:
    - cron: "0 7 * * 1" # toda segunda-feira, 04:00 BRT
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (versão e checksum pinados)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/${archive}" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Varrer secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          common=(--config .gitleaks.toml --redact --no-banner --exit-code 1
                  --report-format sarif --report-path gitleaks.sarif)
          zero="0000000000000000000000000000000000000000"
          case "$EVENT_NAME" in
            pull_request)
              echo "Escopo: commits do PR ${PR_BASE_SHA}..${PR_HEAD_SHA}"
              gitleaks git "${common[@]}" --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}" .
              ;;
            merge_group)
              echo "Escopo: merge queue ${MG_BASE_SHA}..${MG_HEAD_SHA}"
              gitleaks git "${common[@]}" --log-opts="${MG_BASE_SHA}..${MG_HEAD_SHA}" .
              ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$zero" ]; then
                echo "Escopo: último commit enviado ${PUSH_AFTER}"
                gitleaks git "${common[@]}" --log-opts="-1 ${PUSH_AFTER}" .
              else
                echo "Escopo: push ${PUSH_BEFORE}..${PUSH_AFTER}"
                gitleaks git "${common[@]}" --log-opts="${PUSH_BEFORE}..${PUSH_AFTER}" .
              fi
              ;;
            *)
              echo "Escopo: árvore atual completa"
              gitleaks dir "${common[@]}" .
              ;;
          esac

      - name: Publicar relatório (redigido)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: secret-scan-report
          path: gitleaks.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Orientação em caso de detecção
        if: failure()
        run: |
          {
            echo "### ✗ Possível secret detectado"
            echo
            echo "1. NÃO faça merge. Considere a credencial comprometida mesmo que o commit seja removido."
            echo "2. Revogue e rotacione a credencial no sistema de origem (SLA: 24h — docs/security-baseline-ghe.md, seção 16)."
            echo "3. Remova o valor do código e use GitHub Secrets/Environment Secrets ou OIDC."
            echo "4. Falso positivo: registre Exception Record (controle secret-scan) e allowlist específica em .gitleaks.toml via PR revisado."
          } >> "$GITHUB_STEP_SUMMARY"
