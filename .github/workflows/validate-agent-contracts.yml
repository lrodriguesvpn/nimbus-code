name: Validate Agent Contracts

on:
  pull_request:
    paths:
      - '.nimbus/**'
      - 'presets/**/.nimbus/**'
      - '.github/workflows/validate-agent-contracts.yml'
  push:
    branches: ['main']
    paths:
      - '.nimbus/**'
      - 'presets/**/.nimbus/**'
      - '.github/workflows/validate-agent-contracts.yml'

permissions:
  contents: read

jobs:
  validate-agent-contracts:
    name: Validar manifests do plano de controle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de validação
        run: pip install pyyaml jsonschema

      - name: Validar YAMLs e JSON Schema do plano de controle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, yaml
          from jsonschema.validators import Draft202012Validator

          errors = []
          root = Path('.')
          manifest_files = [
              root / '.nimbus/agent-manifest.yaml',
              root / 'presets/nimbus-code-standards/templates/project-root/.nimbus/agent-manifest.yaml',
              root / 'presets/nimbus-code-platform-standards/templates/project-root/.nimbus/agent-manifest.yaml',
          ]
          orchestration_files = [
              root / '.nimbus/orchestration.yaml',
              root / 'presets/nimbus-code-standards/templates/project-root/.nimbus/orchestration.yaml',
              root / 'presets/nimbus-code-platform-standards/templates/project-root/.nimbus/orchestration.yaml',
          ]
          schema_files = [
              root / '.nimbus/execution-log.schema.json',
              root / 'presets/nimbus-code-standards/templates/project-root/.nimbus/execution-log.schema.json',
              root / 'presets/nimbus-code-platform-standards/templates/project-root/.nimbus/execution-log.schema.json',
          ]
          expected_roles = {'NC-Intake', 'NC-Spec', 'NC-Critic', 'NC-Governor', 'NC-Arch', 'NC-Shield', 'NC-QA', 'NC-Builder', 'NC-Telemetry'}

          def require(path):
              if not path.exists():
                  errors.append('[MISSING] ' + str(path))
                  return False
              return True

          for path in manifest_files:
              if not require(path):
                  continue
              data = yaml.safe_load(path.read_text())
              manifest = data.get('manifest', {})
              roles = manifest.get('roles', [])
              role_ids = {role.get('id') for role in roles if isinstance(role, dict)}
              for key in ('schema_version', 'manifest'):
                  if key not in data:
                      errors.append('[FIELD] ' + str(path) + ': ' + key)
              for key in ('profile', 'approval_matrix_by_complexity', 'roles'):
                  if key not in manifest:
                      errors.append('[FIELD] ' + str(path) + ': manifest.' + key)
              if role_ids != expected_roles:
                  errors.append('[ROLES] ' + str(path) + ': roles divergentes')
              for complexity in ('S0', 'S1', 'S2', 'S3', 'S4'):
                  if complexity not in manifest.get('approval_matrix_by_complexity', {}):
                      errors.append('[APPROVAL] ' + str(path) + ': ' + complexity)

          for path in orchestration_files:
              if not require(path):
                  continue
              data = yaml.safe_load(path.read_text())
              orch = data.get('orchestration', {})
              for key in ('schema_version', 'orchestration'):
                  if key not in data:
                      errors.append('[FIELD] ' + str(path) + ': ' + key)
              for key in ('states', 'phase_dependencies', 'retry_policy', 'stop_conditions', 'human_gates', 'handoff_policy'):
                  if key not in orch:
                      errors.append('[FIELD] ' + str(path) + ': orchestration.' + key)
              if len(orch.get('phase_dependencies', [])) != 9:
                  errors.append('[PHASES] ' + str(path) + ': eram esperadas 9 fases NC-*')

          for path in schema_files:
              if not require(path):
                  continue
              loaded = json.loads(path.read_text())
              Draft202012Validator.check_schema(loaded)
              required = set(loaded.get('required', []))
              missing = {'actor', 'run_id', 'action', 'scope', 'artifacts_produced', 'decision', 'retry_count', 'approval', 'final_result'} - required
              if missing:
                  errors.append('[REQUIRED] ' + str(path) + ': ' + ','.join(sorted(missing)))

          if errors:
              print('Falhas na validação do plano de controle:')
              for error in errors:
                  print(' - ' + error)
              raise SystemExit(1)
          print('Manifests agenticos válidos.')
          PY
