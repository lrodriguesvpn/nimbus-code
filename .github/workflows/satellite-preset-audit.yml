name: Satellite Preset Version Audit

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: satellite-preset-audit
  cancel-in-progress: false

jobs:
  audit-satellite-presets:
    runs-on: ubuntu-latest
    env:
      NIMBUS_APP_CONFIGURED: ${{ secrets.NIMBUS_APP_ID != '' && secrets.NIMBUS_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate GitHub App installation token
        id: app-token
        if: env.NIMBUS_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NIMBUS_APP_ID }}
          private-key: ${{ secrets.NIMBUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          github-api-url: ${{ github.api_url }}
          permission-contents: read
      - name: Run preset audit
        id: audit
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.VPNDEV_STANDARDS_READ_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$APP_TOKEN" ]]; then
            export GH_TOKEN="$APP_TOKEN"
          elif [[ -n "$PAT_TOKEN" ]]; then
            export GH_TOKEN="$PAT_TOKEN"
            echo "::warning::Using existing read-only PAT fallback."
          else
            echo "::error::No cross-repository read credential; GITHUB_TOKEN is repository-scoped."
            exit 2
          fi
          export GH_HOST="${SERVER_URL#https://}"
          bash scripts/scan-org-rename-references.sh --mode satellite-preset-audit \
            --org "$GITHUB_REPOSITORY_OWNER" --output preset-audit-report.csv
      - name: Parse audit results
        id: parse
        if: always() && steps.audit.outcome != 'skipped'
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 scripts/preset-audit-report.py summary preset-audit-report.csv \
            --manifest presets/nimbus-code-standards/preset.yml \
            --summary audit-summary.md --outputs "$GITHUB_OUTPUT" || status=$?
          if [[ "$AUDIT_OUTCOME" != success ]]; then
            echo "Audit incomplete: scanner/authentication failed; counts may be partial." >> audit-summary.md
            exit 2
          fi
          exit "$status"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preset-audit-report
          path: |
            preset-audit-report.csv
            audit-summary.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f audit-summary.md ]]; then
            cat audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Audit incomplete; inspect authentication or parsing errors." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create or update central drift issue
        if: success() && steps.parse.outputs.drifted != '0'
        uses: actions/github-script@v7
        env:
          CENTRAL_VERSION: ${{ steps.parse.outputs.central_version }}
          DRIFTED: ${{ steps.parse.outputs.drifted }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const marker = '<!-- nimbus-satellite-preset-audit -->';
            const title = `Satellite repos out of sync with v${process.env.CENTRAL_VERSION}: ${process.env.DRIFTED} repos`;
            const body = [
              marker,
              fs.readFileSync('audit-summary.md', 'utf8'),
              `Report: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              'After human pilot approval (#433/#445), opt in with NIMBUS_SATELLITE_SYNC_ENABLED=true.',
              'Dispatch auto-sync-preset.yml manually with validated repo and target_version matching the selected bundle.',
              'Sync proposes a PR for review. This audit does not dispatch sync, merge PRs or change satellites.'
            ].join('\n\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && (i.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, title, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
