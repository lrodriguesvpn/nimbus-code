name: Tag release on main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag from bundle version (if needed)
        id: tag_step
        run: |
          set -euo pipefail

          VERSION=$(grep -m1 -E '^[[:space:]]*version:' bundles/nimbus-code-project-bundle/bundle.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          TAG="v${VERSION}"

          if [ -z "${VERSION:-}" ]; then
            echo "Could not determine bundle version."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git fetch --tags origin

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Current SHA is not on main. Refusing to tag."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created and pushed tag $TAG"

      - name: Disparar workflow de release (empacotamento + GitHub Release)
        if: steps.tag_step.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Necessário porque tags/commits empurrados pelo GITHUB_TOKEN a partir
          # de dentro de um workflow NÃO disparam outros workflows escutando
          # `push` (proteção anti-loop do próprio GitHub Actions) — o passo
          # anterior empurra a tag, mas isso sozinho nunca aciona o workflow
          # "Release componentes Nimbus-Code" (on: push: tags: v*). Chamadas
          # explícitas de workflow_dispatch via API, como esta, não sofrem essa
          # restrição — por isso release.yml também precisa do trigger
          # workflow_dispatch (adicionado junto com esta correção). Bug real
          # encontrado em 2026-08-31: nenhuma release formal foi publicada
          # entre v1.11.0 e v1.16.0 por causa disso — corrigido manualmente
          # para v1.16.0, esta mudança previne a recorrência.
          gh workflow run release.yml --ref "${{ steps.tag_step.outputs.tag }}"
          echo "Disparado release.yml para a tag ${{ steps.tag_step.outputs.tag }}"
