name: Release componentes Nimbus-Code

# Empacota preset/extensão/workflow/bundle em .zip e publica como assets de uma
# GitHub Release, na tag pushada. Os catalog.json (presets/, extensions/,
# workflows/, bundles/) devem ser atualizados no MESMO PR que muda a versão,
# antes de criar a tag — este workflow só empacota e publica, não decide versão.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar que a tag aponta para commit promovido em main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "ERRO: a tag ${GITHUB_REF_NAME} não está em um commit da main."
            echo "Publique versão apenas após PR develop -> main aprovado e mergeado."
            exit 1
          fi

      - name: Empacotar preset nimbus-code-standards
        run: |
          cd presets/nimbus-code-standards
          VERSION=$(grep -m1 -E '^[[:space:]]*version:' preset.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          zip -r "../../nimbus-code-standards-${VERSION}.zip" . -x ".*"

      - name: Empacotar preset nimbus-code-platform-standards
        run: |
          cd presets/nimbus-code-platform-standards
          VERSION=$(grep -m1 -E '^[[:space:]]*version:' preset.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          zip -r "../../nimbus-code-platform-standards-${VERSION}.zip" . -x ".*"

      - name: Empacotar extensão nimbus-code-backlog-sync
        run: |
          cd extensions/nimbus-code-backlog-sync
          VERSION=$(grep -m1 -E '^[[:space:]]*version:' extension.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          zip -r "../../nimbus-code-backlog-sync-${VERSION}.zip" . -x ".*"

      - name: Empacotar workflow nimbus-code-full-cycle
        run: |
          cd workflows/nimbus-code-full-cycle
          VERSION=$(grep -m1 -E '^[[:space:]]*version:' workflow.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          zip -r "../../nimbus-code-full-cycle-${VERSION}.zip" . -x ".*"

      - name: Empacotar bundle nimbus-code-project-bundle
        run: |
          cd bundles/nimbus-code-project-bundle
          VERSION=$(grep -m1 -E '^[[:space:]]*version:' bundle.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          zip -r "../../nimbus-code-project-bundle-${VERSION}.zip" . -x ".*"

      - name: Empacotar bundle nimbus-code-platform-bundle
        run: |
          cd bundles/nimbus-code-platform-bundle
          VERSION=$(grep -m1 -E '^[[:space:]]*version:' bundle.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          zip -r "../../nimbus-code-platform-bundle-${VERSION}.zip" . -x ".*"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nimbus-code-standards-*.zip
            nimbus-code-platform-standards-*.zip
            nimbus-code-backlog-sync-*.zip
            nimbus-code-full-cycle-*.zip
            nimbus-code-project-bundle-*.zip
            nimbus-code-platform-bundle-*.zip
          generate_release_notes: true
