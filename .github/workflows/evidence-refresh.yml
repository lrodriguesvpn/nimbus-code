name: Evidence Refresh (read-only)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
  pull_request:
    paths:
      - ".nimbus/**"
      - "platform/**"
      - "scripts/validate-no-direct-write-commands.sh"
      - ".github/workflows/evidence-refresh.yml"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read

jobs:
  refresh-evidence:
    name: Atualizar evidências sem escrita em cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar guardrail de somente-leitura
        run: |
          bash scripts/validate-no-direct-write-commands.sh \
            .github/workflows/evidence-refresh.yml \
            .github/workflows/terraform-plan.yml \
            scripts/validate-no-direct-write-commands.sh

      - name: Setup Terraform (opcional)
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Preparar diretório de artifacts
        run: mkdir -p artifacts/evidence-refresh

      - name: Discovery Terraform em modo refresh-only (opcional)
        shell: bash
        env:
          NIMBUS_TERRAFORM_DIRS: ""
        run: |
          set -euo pipefail
          if [ -z "${NIMBUS_TERRAFORM_DIRS}" ]; then
            echo "Nenhum diretório Terraform configurado. Defina NIMBUS_TERRAFORM_DIRS quando o repositório tiver código IaC versionado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          IFS=',' read -r -a dirs <<< "${NIMBUS_TERRAFORM_DIRS}"
          for dir in "${dirs[@]}"; do
            echo "## Discovery read-only em ${dir}" >> "$GITHUB_STEP_SUMMARY"
            pushd "$dir" >/dev/null
            terraform init -backend=false -input=false
            plan_exit=0
            terraform plan -refresh-only -lock=false -input=false -no-color -out=nimbus-refresh.tfplan || plan_exit=$?
            if [ "$plan_exit" -ne 0 ] && [ "$plan_exit" -ne 2 ]; then
              echo "terraform plan -refresh-only falhou em ${dir}" >&2
              exit "$plan_exit"
            fi
            terraform show -json nimbus-refresh.tfplan > "$GITHUB_WORKSPACE/artifacts/evidence-refresh/$(basename "$dir")-refresh.json"
            popd >/dev/null
          done

      - name: Exemplos aprovados de discovery somente-leitura
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Exemplos aprovados
          - Azure: `az resource list`
          - AWS: `aws resourcegroupstaggingapi get-resources`
          - GCP: `gcloud asset search-all-resources`
          - Kubernetes: `kubectl get all --all-namespaces`

          > Proibido substituir este workflow por comandos de escrita direta em cloud.
          > Nunca introduza apply, destroy, create, update, delete ou import aqui.
          EOF

      - name: Publicar evidências coletadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-refresh
          path: artifacts/evidence-refresh
          if-no-files-found: warn
