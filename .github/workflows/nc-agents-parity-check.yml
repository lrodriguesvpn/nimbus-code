name: NC Agents Parity Check

on:
  pull_request:
    paths:
      - '.github/skills/nc-*/**'
      - '.claude/skills/nc-*/**'
      - '.agents/skills/nc-*/**'
      - '.github/agents/nc-*.agent.md'
      - '.claude/agents/nc-*.md'
      - '.nimbus/agent-manifest.yaml'
      - 'scripts/sync-nc-agents-to-integrations.sh'
      - 'scripts/lib/nc-agent-sync.py'
      - 'tests/multi-agent-integration/**'
  push:
    branches:
      - main
      - develop

jobs:
  parity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bats and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats python3 python3-yaml

      - name: Validate generated native artifacts
        run: |
          bash scripts/sync-nc-agents-to-integrations.sh --check --target all

      - name: Run NC Agents Parity Test Suite
        run: |
          bats tests/multi-agent-integration/*.bats
