# graph.yaml — Feature 005: Epic/Feature/US Hierarchy no GHE com Spec Kit

feature: "005-epic-feature-us-ghe-hierarchy"
complexity: "S3"
version: 1
updated_at: "2026-08-20"
spec_ref: "specs/005-epic-feature-us-ghe-hierarchy/spec.md"

nodes:
  - id: "feature-json"
    type: "module"
    path: ".specify/feature.json"
    description: "Metadados da feature ativa; estendido com campo epic_issue (número da issue Epic no GHE)"

  - id: "speckit-specify"
    type: "module"
    path: ".specify/scripts/bash/create-new-feature.sh"
    description: "Comando /speckit-specify — cria spec.md e inicializa feature.json; passa a aceitar EPIC_ISSUE opcional"

  - id: "speckit-taskstoissues"
    type: "module"
    path: ".github/skills/speckit-taskstoissues/SKILL.md"
    description: "Comando /speckit-taskstoissues — cria issues de Feature, US e Task no GHE como sub-issues hierarquizadas; implementa deduplicação por T00N ID e fallback via labels; invoca create-github-issue-hierarchy.sh para a parte estrutural (Epic/Feature/US + vínculos)"

  - id: "create-github-issue-hierarchy"
    type: "module"
    path: ".specify/scripts/bash/create-github-issue-hierarchy.sh"
    description: "Helper bash + gh CLI (mesmo idioma de scripts/setup-github-project.sh) chamado por /speckit-taskstoissues: cria/reaproveita issues de Feature e User Story (dedup por marcador oculto no corpo), vincula Task/US/Feature como sub-issues via GraphQL addSubIssue, aplica Issue Type nativo via updateIssueIssueType com fallback para labels type:*, e alerta/aborta no limite de 90/100 sub-issues por parent"

  - id: "setup-github-project"
    type: "module"
    path: "scripts/setup-github-project.sh"
    description: "Script de setup do GitHub Project V2; estendido com criação de Issue Types (Epic, Feature, User Story, Task, Bug) e views hierárquicas (Board de Epics, Board de Features, Board de User Stories, Sprint Ativo)"

  - id: "setup-github-labels"
    type: "module"
    path: "scripts/setup-github-labels.sh"
    description: "Script de setup de labels; estendido com labels de fallback type:epic, type:feature, type:user-story para orgs sem Issue Types nativos"

  - id: "developer-guide"
    type: "module"
    path: "docs/developer-guide.md"
    description: "Manual do Dev; recebe seção 'Hierarquia Agile (Epic → Feature → US)' com comandos, mapeamento spec↔issue e exemplo passo a passo"

  - id: "reuse-catalog"
    type: "module"
    path: "docs/reuse-catalog.yaml"
    description: "Catálogo de padrões reutilizáveis; recebe entradas ghe-sub-issues-hierarchy e speckit-deduplication-by-id ao fechar esta feature"

  - id: "ghe-api"
    type: "external"
    path: ""
    description: "GitHub Enterprise Cloud GraphQL API — sub-issues, Issue Types, Projects V2 views"

edges:
  - src: "speckit-specify"
    dst: "feature-json"
    type: "sync"
    protocol: "file write"
    description: "Persiste epic_issue no feature.json ao criar nova feature"

  - src: "speckit-taskstoissues"
    dst: "feature-json"
    type: "sync"
    protocol: "file read"
    description: "Lê epic_issue de feature.json para vincular Feature issue como sub-issue do Epic"

  - src: "speckit-taskstoissues"
    dst: "create-github-issue-hierarchy"
    type: "sync"
    protocol: "shell invocation (subprocess)"
    description: "Invoca o helper (ensure-feature, ensure-user-story, link-task) para criar/vincular a hierarquia estrutural (Epic/Feature/US/Task) durante a execução do comando"

  - src: "create-github-issue-hierarchy"
    dst: "ghe-api"
    type: "sync"
    protocol: "GraphQL/HTTPS"
    description: "addSubIssue, updateIssueIssueType, organization.issueTypes, Issue.subIssuesSummary/parent, search (dedup por marcador); gh issue create/edit para labels de fallback"

  - src: "setup-github-project"
    dst: "ghe-api"
    type: "sync"
    protocol: "GraphQL/HTTPS"
    description: "Cria/verifica Issue Types na org, cria views hierárquicas no Project V2"

  - src: "setup-github-labels"
    dst: "ghe-api"
    type: "sync"
    protocol: "REST/HTTPS (gh label create)"
    description: "Cria labels type:epic, type:feature, type:user-story como fallback"

  - src: "developer-guide"
    dst: "speckit-specify"
    type: "async"
    protocol: "documentation reference"
    description: "Documenta como usar o parâmetro EPIC_ISSUE no /speckit-specify"

  - src: "developer-guide"
    dst: "speckit-taskstoissues"
    type: "async"
    protocol: "documentation reference"
    description: "Documenta o fluxo de criação de hierarquia via /speckit-taskstoissues"

  - src: "developer-guide"
    dst: "setup-github-project"
    type: "async"
    protocol: "documentation reference"
    description: "Documenta como configurar Issue Types e views via setup-github-project.sh"

externals:
  - id: "ghe-graphql-api"
    provider: "GitHub Enterprise Cloud"
    called_by: ["create-github-issue-hierarchy", "setup-github-project"]
    criticality: "high"
    fallback: "labels type:epic/feature/user-story como substituto de Issue Types nativos; sem fallback para criação de sub-issues (requer GHE Cloud ou GHE Server ≥ 3.10)"

  - id: "ghe-rest-api"
    provider: "GitHub Enterprise Cloud"
    called_by: ["setup-github-labels"]
    criticality: "medium"
    fallback: "criação manual de labels via UI"
