# graph.yaml — Grafo de Módulos estruturado por feature
#
# OBRIGATÓRIO: criado junto com spec.md (/nimbus-code-specify) e mantido
# atualizado a cada tarefa que adiciona, remove ou renomeia um módulo/serviço.
# Arquivo lido pelo GitHub Action Graph Guard para validar consistência.

feature: "007-controle-seguranca-ghe-projetos-plataforma"
complexity: "S4"
version: 1
updated_at: "2026-09-22"
spec_ref: "specs/007-controle-seguranca-ghe-projetos-plataforma/spec.md"

nodes:
  - id: "security-baseline-doc"
    type: "module"
    path: "docs/security-baseline-ghe.md"
    description: "Documentação de baseline de segurança para repositórios de projeto e Projeto Plataforma"

  - id: "security-compliance-scan-workflow"
    type: "service"
    path: ".github/workflows/security-compliance-scan.yml"
    description: "Workflow agendado (semanal) que dispara a varredura de conformidade"

  - id: "security-compliance-scan-script"
    type: "module"
    path: "scripts/security-compliance-scan.sh"
    description: "Lógica de varredura: descoberta de repos, avaliação de controles de repositório e Project V2, criação/fechamento de issues e agregação mensal"

  - id: "github-issues"
    type: "external"
    path: "N/A"
    description: "Rastreamento de não conformidades e publicação do relatório mensal como Issues do GitHub (reaproveita fluxo Nimbus Code existente)"

  - id: "platform-project-v2"
    type: "external"
    path: "N/A"
    description: "Project V2 consolidado (Projeto Plataforma) — alvo de avaliação da matriz de permissões"

  - id: "openfeature-flag-provider"
    type: "module"
    path: "scripts/security-compliance-scan.sh (flag resolution)"
    description: "Resolução do flag security.baseline_scan.org_wide_enabled via abstração OpenFeature (provider env/file-based)"

  # --- issue #450: governança de PR e segurança de código -------------------
  - id: "security-governance-config"
    type: "module"
    path: ".github/security-governance.json"
    description: "Configuração versionada: branches protegidas, regras, required checks, quality gates, cobertura, CodeQL, SCA (lida pelos workflows de PR e pela varredura)"

  - id: "security-exceptions-registry"
    type: "module"
    path: ".github/security-exceptions.json"
    description: "Exception Records aprovados e expiráveis"

  - id: "pr-quality-gates-workflow"
    type: "service"
    path: ".github/workflows/pr-quality-gates.yml"
    description: "Checks obrigatórios governance-config, build, unit-tests, integration-tests e coverage"

  - id: "quality-gate-scripts"
    type: "module"
    path: "scripts/run-quality-gate.sh, scripts/coverage-gate.py, scripts/validate-security-governance.sh, scripts/validate-repo-static.sh"
    description: "Executor extensível de etapas, gate de cobertura, validador de governança e build estático"

  - id: "codeql-workflow"
    type: "service"
    path: ".github/workflows/codeql.yml"
    description: "SAST CodeQL em PR, push, merge queue e semanal"

  - id: "dependency-review-workflow"
    type: "service"
    path: ".github/workflows/dependency-review.yml"
    description: "SCA em PR (check dependency-review) com .github/dependency-review-config.yml"

  - id: "secret-scan-workflow"
    type: "service"
    path: ".github/workflows/secret-scan.yml"
    description: "Verificação complementar de secrets em PR (gitleaks pinado, relatório redigido)"

nodes_removed: []

edges:
  - src: "security-compliance-scan-workflow"
    dst: "security-compliance-scan-script"
    type: "sync"
    protocol: "shell invocation"
    description: "Workflow invoca o script de varredura a cada execução agendada"

  - src: "security-compliance-scan-script"
    dst: "openfeature-flag-provider"
    type: "sync"
    protocol: "in-process"
    description: "Script resolve o escopo de repositórios (piloto vs. org-wide) antes de varrer"

  - src: "security-compliance-scan-script"
    dst: "github-issues"
    type: "sync"
    protocol: "GitHub REST API (HTTPS)"
    description: "Cria/atualiza issues idempotentes de não conformidade"

  - src: "security-compliance-scan-script"
    dst: "platform-project-v2"
    type: "sync"
    protocol: "GitHub GraphQL API (HTTPS)"
    description: "Lê a matriz de permissões do Project V2 consolidado"

  - src: "security-baseline-doc"
    dst: "security-compliance-scan-script"
    type: "async"
    protocol: "referência documental"
    description: "A documentação define os controles que o script implementa/avalia (não é chamada em runtime, é referência de especificação)"

  - src: "security-compliance-scan-script"
    dst: "security-governance-config"
    type: "sync"
    protocol: "arquivo local + GitHub REST contents API"
    description: "Lê a configuração padrão e a de cada repositório avaliado (branches, checks esperados, cobertura)"

  - src: "pr-quality-gates-workflow"
    dst: "quality-gate-scripts"
    type: "sync"
    protocol: "shell invocation"
    description: "Executa etapas declaradas, gate de cobertura e validação de governança"

  - src: "quality-gate-scripts"
    dst: "security-governance-config"
    type: "sync"
    protocol: "in-process (jq/python)"
    description: "Comandos por etapa, mínimos de cobertura e required checks"

  - src: "quality-gate-scripts"
    dst: "security-exceptions-registry"
    type: "sync"
    protocol: "in-process"
    description: "Valida exceções (expiração) e aplica exceções ativas ao gate de cobertura"

  - src: "codeql-workflow"
    dst: "security-governance-config"
    type: "sync"
    protocol: "in-process (jq)"
    description: "Linguagens CodeQL declaradas"

externals:
  - id: "github-app-security-auditor"
    provider: "GitHub"
    called_by: ["security-compliance-scan-script"]
    criticality: "high"
    fallback: "Nenhum — se a autenticação falhar, o workflow falha explicitamente (::error::) sem executar varredura parcial sem credencial válida"

  - id: "github-rest-graphql-api"
    provider: "GitHub"
    called_by: ["security-compliance-scan-script"]
    criticality: "high"
    fallback: "Backoff exponencial em rate limit (403/429); repositórios com erro persistente são contabilizados em repos_com_erro e reportados, não bloqueiam os demais"

  - id: "github-code-scanning"
    provider: "GitHub (Code Security)"
    called_by: ["codeql-workflow", "security-compliance-scan-script"]
    criticality: "high"
    fallback: "Sem GHAS/Code Security o upload falha (check vermelho) e a varredura reporta pendente — nunca ok"

  - id: "gitleaks-release"
    provider: "gitleaks (release oficial, MIT)"
    called_by: ["secret-scan-workflow"]
    criticality: "medium"
    fallback: "Download com versão e SHA-256 fixados; falha de download/checksum falha o check secret-scan"
