schemaVersion: "1.0"
kind: "DSCProfile"
required:
  - profileId
  - version
  - scope
  - desiredControls
  - generatedAt
properties:
  profileId:
    type: string
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  scope:
    type: object
    required:
      - providers
      - tenantRef
    properties:
      providers:
        type: array
        items:
          type: string
          enum: [azure, aws, gcp]
      tenantRef:
        type: string
  desiredControls:
    type: array
    items:
      type: object
      required:
        - domain
        - controlId
        - expectedState
      properties:
        domain:
          type: string
        controlId:
          type: string
        expectedState:
          type: object
        severity:
          type: string
          enum: [low, medium, high, critical]
  generatedAt:
    type: string
    format: date-time
  previousVersion:
    type: string
  deltaSummary:
    type: string
