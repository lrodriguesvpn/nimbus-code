contract: mode-classification
version: 1.0.0
description: Contrato de classificação de modo operacional

input:
  required:
    - intake_entry_id
    - risk_level
    - criticality
  properties:
    intake_entry_id:
      type: string
    risk_level:
      type: string
      enum: [low, medium, high]
    criticality:
      type: string
      enum: [business_low, business_high]
    compliance_required:
      type: boolean

output:
  required:
    - selected_mode
    - justification
    - policy_version
  properties:
    selected_mode:
      type: string
      enum: [autonomous, semi_autonomous, manual_approval]
    justification:
      type: string
      minLength: 15
    policy_version:
      type: string
    decision_priority:
      type: string
      enum: [compliance, risk, criticality]
    conflict_resolution:
      type: string
      description: Regra aplicada quando houver sinais conflitantes
