contract: intake-entry
version: 1.0.0
description: Contrato de entrada normalizada para intake M365/GitHub

payload:
  required:
    - source
    - title
    - objective
    - owner
    - priority
    - correlation_key
  properties:
    source:
      type: string
      enum: [m365_meeting, sharepoint, github]
    title:
      type: string
      minLength: 5
    objective:
      type: string
      minLength: 10
    owner:
      type: string
      minLength: 3
    priority:
      type: string
      enum: [low, medium, high, critical]
    deadline:
      type: string
      format: date-time
    attachments:
      type: array
      items:
        type: string
    correlation_key:
      type: string
      description: Chave de correlação para deduplicação cross-source
    source_ref:
      type: string
      description: Identificador da origem para rastreabilidade

outcome:
  status: received|qualified|blocked|ready
  intake_entry_id: string
  duplicate_of: string|null
  blocked_reason: string|null

deduplication:
  mode: correlation_key
  behavior:
    - Se houver entrada com mesma correlation_key em até 24h, consolidar e preencher duplicate_of
    - Se campos obrigatórios estiverem ausentes, marcar status=blocked e blocked_reason
