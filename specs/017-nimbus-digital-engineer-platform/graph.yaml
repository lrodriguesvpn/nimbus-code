feature: "017-nimbus-digital-engineer-platform"
bounded_context: "spec-kit-workflow"
version: 1

modules:
  - id: intake-ingestion
    type: service
    owner: ade-platform
    responsibilities:
      - Normalizar intake de M365/GitHub em IntakeEntry
  - id: mode-classification-engine
    type: service
    owner: ade-platform
    responsibilities:
      - Classificar demanda em autonomous/semi/manual
      - Registrar justificativa de política
  - id: approval-gate-service
    type: service
    owner: governance
    responsibilities:
      - Aplicar checkpoints de aprovação humana
      - Bloquear continuidade sem papel autorizado
  - id: handoff-assembler
    type: service
    owner: delivery
    responsibilities:
      - Consolidar handoff com evidências de qualidade e custo
  - id: badge-catalog-service
    type: service
    owner: digital-engineering
    responsibilities:
      - Publicar e manter badges por domínio
  - id: audit-trail-store
    type: datastore
    owner: governance
    responsibilities:
      - Persistir trilha de decisão e aprovação
  - id: governance-evidence
    type: service
    owner: governance
    responsibilities:
      - Consolidar matriz de evidências AC/FR/SC
      - Expor status de completude para handoff executivo
  - id: nimbus-agent
    type: external-repo
    owner: nimbus
    responsibilities:
      - Orquestrador principal dos fluxos operacionais

dependencies:
  - from: intake-ingestion
    to: mode-classification-engine
    kind: sync
    protocol: http/event
  - from: mode-classification-engine
    to: approval-gate-service
    kind: sync
    protocol: http
  - from: approval-gate-service
    to: handoff-assembler
    kind: async
    protocol: event
  - from: handoff-assembler
    to: audit-trail-store
    kind: sync
    protocol: write
  - from: handoff-assembler
    to: governance-evidence
    kind: sync
    protocol: write
  - from: approval-gate-service
    to: governance-evidence
    kind: sync
    protocol: write
  - from: badge-catalog-service
    to: audit-trail-store
    kind: sync
    protocol: write
  - from: nimbus-agent
    to: intake-ingestion
    kind: sync
    protocol: orchestration

externals:
  - id: m365
    criticality: high
    used_by:
      - intake-ingestion
  - id: github
    criticality: high
    used_by:
      - intake-ingestion
  - id: openfeature-provider
    criticality: medium
    used_by:
      - mode-classification-engine
