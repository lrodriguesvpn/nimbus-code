feature: "028-suporte-cursor-kiro"
bounded_context: "spec-kit-workflow"
version: 1

modules:
  - id: dynamic-agent-discovery
    type: refactor
    owner: platform
    path: "scripts/lib/nc-agent-sync.py"
    responsibilities:
      - Substituir a tupla hardcoded AGENTS por descoberta via glob(".github/skills/nc-*")
      - Aplicar a mesma descoberta aos 5 alvos (vscode, claude, antigravity, cursor, kiro)
      - Mitigar HRN-0006 (lista hardcoded desatualizada)
    depends_on: []

  - id: extra-speckit-discovery
    type: refactor
    owner: platform
    path: "scripts/sync-nc-agents-to-integrations.sh"
    responsibilities:
      - Substituir EXTRA_SPECKIT_SKILLS hardcoded por descoberta dos comandos
        speckit-* proprietários (não cobertos pelo specify CLI)
    depends_on: []

  - id: cursor-target-renderer
    type: renderer
    owner: platform
    path: "scripts/lib/nc-agent-sync.py"
    responsibilities:
      - Adicionar GENERATED_ROOTS["cursor"] = .cursor/skills
      - render()/destination()/validate_contract() para "cursor" (frontmatter
        name/description/compatibility/metadata)
    depends_on:
      - dynamic-agent-discovery

  - id: cursor-extra-skills-sync
    type: renderer
    owner: platform
    path: "scripts/sync-nc-agents-to-integrations.sh"
    responsibilities:
      - process_for_cursor() para os comandos speckit-* proprietários em .cursor/skills/
    depends_on:
      - extra-speckit-discovery

  - id: kiro-target-renderer
    type: renderer
    owner: platform
    path: "scripts/lib/nc-agent-sync.py"
    responsibilities:
      - Adicionar GENERATED_ROOTS["kiro"] = .kiro/agents
      - render()/destination()/validate_contract() para "kiro" (mecanismo nativo
        Custom agents; campos name/description/tools/prompt)
    depends_on:
      - dynamic-agent-discovery

  - id: kiro-extra-skills-sync
    type: renderer
    owner: platform
    path: "scripts/sync-nc-agents-to-integrations.sh"
    responsibilities:
      - process_for_kiro_prompts() para os comandos speckit-* proprietários em .kiro/prompts/
        (dot-separado: speckit.<nome>.md)
    depends_on:
      - extra-speckit-discovery

  - id: parity-tests-5-targets
    type: tests
    owner: platform
    path: "tests/multi-agent-integration/nc-agents-parity.bats"
    responsibilities:
      - Cobrir os 5 alvos (vscode, claude, antigravity, cursor, kiro)
      - Falhar bloqueante em qualquer drift
    depends_on:
      - cursor-target-renderer
      - kiro-target-renderer

  - id: foundation-regression-test
    type: tests
    owner: platform
    path: "tests/multi-agent-integration/nc-agent-foundation.bats"
    responsibilities:
      - Garantir contagem de agentes descoberta via glob >= 18 (não número fixo)
      - Garantir .github/agents/ continua só com nimbus.agent.md (regressão spec 025)
    depends_on:
      - dynamic-agent-discovery

  - id: ci-workflow-triggers
    type: ci
    owner: platform
    path: ".github/workflows/nc-agents-parity-check.yml"
    responsibilities:
      - Adicionar paths de trigger para .cursor/skills/nc-*/** e .kiro/agents/nc-*.md
    depends_on:
      - parity-tests-5-targets

  - id: developer-guide-update
    type: documentation
    owner: platform
    path: "docs/developer-guide.md"
    responsibilities:
      - Documentar as 5 integrações suportadas e seus perfis de risco (multi_install_safe, CLI)
    depends_on: []

external_dependencies:
  - id: specify-cli-cursor-agent
    type: external-tool
    tool: "specify integration install cursor-agent"
    relationship: "provides-speckit-commands"
    note: "Instala os 12 comandos /speckit-* em .cursor/skills/ — mecanismo já existente, não reimplementado"

  - id: specify-cli-kiro-cli
    type: external-tool
    tool: "specify integration install kiro-cli"
    relationship: "provides-speckit-commands"
    note: "Instala os 12 comandos /speckit-* em .kiro/prompts/ — mecanismo já existente, não reimplementado"

tests:
  - id: parity-cursor
    path: "tests/multi-agent-integration/nc-agents-parity.bats"
    covers: ["AC-2", "AC-5"]
  - id: parity-kiro
    path: "tests/multi-agent-integration/nc-agents-parity.bats"
    covers: ["AC-4", "AC-5"]
  - id: contracts-cursor-kiro
    path: "tests/multi-agent-integration/nc-agent-contracts.bats"
    covers: ["AC-2", "AC-4"]
  - id: vscode-regression
    path: "tests/multi-agent-integration/nc-agent-foundation.bats"
    covers: ["AC-6"]
  - id: install-integration-shell
    path: "tests/multi-agent-integration/nc-agents-parity.bats"
    covers: ["AC-1", "AC-3"]
