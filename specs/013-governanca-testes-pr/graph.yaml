# graph.yaml — Feature 013: Governança de Testes em PR

feature: "013-governanca-testes-pr"
complexity: "S3"
version: 1
updated_at: "2026-08-20"
spec_ref: "specs/013-governanca-testes-pr/spec.md"

nodes:
  - id: "testing-policy-doc"
    type: "module"
    path: "docs/testing-policy.md"
    description: "Política oficial de testes: inventário, taxonomia, matriz de decisão de formato, gate obrigatório, governança de exceções (novo)"

  - id: "run-tests-script"
    type: "module"
    path: "scripts/run-tests.sh"
    description: "Ponto de entrada único de descoberta/execução da suíte mandatória — usado tanto localmente quanto pelo workflow de CI (novo)"

  - id: "test-suite-workflow"
    type: "module"
    path: ".github/workflows/test-suite.yml"
    description: "Workflow de CI que invoca scripts/run-tests.sh em toda PR contra main — gate obrigatório (rollout faseado: relatório → required) (novo)"

  - id: "tests-bootstrap-bats"
    type: "module"
    path: "tests/bootstrap/"
    description: "Suíte existente em formato Bats-core (feature 008) — adotada como padrão principal por esta feature"

  - id: "tests-legacy-shell"
    type: "module"
    path: "tests/docs/ tests/scripts/ tests/workflows/"
    description: "Suíte existente em formato .test.sh simples (feature 007) — classificada como formato aceito (não legado a migrar) por esta feature"

  - id: "reuse-catalog"
    type: "module"
    path: "docs/reuse-catalog.yaml"
    description: "Recebe entrada apontando para o padrão de gate único de testes, se aplicável após implementação (FR-004)"

edges:
  - src: "run-tests-script"
    dst: "tests-bootstrap-bats"
    type: "sync"
    protocol: "invocação direta de processo (bats <arquivo>)"
    description: "run-tests.sh descobre e executa todo tests/**/*.bats via bats"

  - src: "run-tests-script"
    dst: "tests-legacy-shell"
    type: "sync"
    protocol: "invocação direta de processo (bash <arquivo>)"
    description: "run-tests.sh descobre e executa todo tests/**/*.test.sh via bash"

  - src: "test-suite-workflow"
    dst: "run-tests-script"
    type: "sync"
    protocol: "invocação de shell step dentro do runner GitHub Actions"
    description: "O workflow de CI invoca exatamente o mesmo script usado localmente — garante paridade AC-4 por construção"

  - src: "testing-policy-doc"
    dst: "run-tests-script"
    type: "async"
    protocol: "documentation reference"
    description: "A política documenta o run-tests.sh como o caminho oficial de execução local (FR-008)"

  - src: "testing-policy-doc"
    dst: "test-suite-workflow"
    type: "async"
    protocol: "documentation reference"
    description: "A política documenta o gate obrigatório e seu rollout faseado"

externals:
  - name: "bats-core"
    type: "third-party-tool"
    description: "Framework de teste TAP-compliant para Bash — já usado em tests/bootstrap/, elevado a padrão principal recomendado por esta feature"
