bounded_context: "spec-kit-workflow"
version: 1
feature: "025-native-nc-agents"
nodes:
  - id: "canonical-nc-skills"
    type: "source"
    path: ".github/skills/nc-*/SKILL.md"
  - id: "agent-manifest"
    type: "manifest"
    path: ".nimbus/agent-manifest.yaml"
  - id: "integration-generator"
    type: "tooling"
    path: "scripts/sync-nc-agents-to-integrations.sh"
  - id: "vscode-native-agents"
    type: "integration-output"
    path: ".github/agents/nc-*.agent.md"
  - id: "claude-native-agents"
    type: "integration-output"
    path: ".claude/agents/nc-*.md"
  - id: "antigravity-adapter"
    type: "integration-output"
    path: ".agents/skills/nc-*/SKILL.md"
  - id: "legacy-command-bridges"
    type: "compatibility-output"
    path: ".github/skills/nc-*/SKILL.md"
  - id: "parity-gate"
    type: "quality-gate"
    path: "tests/multi-agent-integration/"
edges:
  - from: "canonical-nc-skills"
    to: "integration-generator"
    type: "reads"
  - from: "agent-manifest"
    to: "integration-generator"
    type: "constrains"
  - from: "integration-generator"
    to: "vscode-native-agents"
    type: "generates"
  - from: "integration-generator"
    to: "claude-native-agents"
    type: "generates"
  - from: "integration-generator"
    to: "antigravity-adapter"
    type: "generates"
  - from: "canonical-nc-skills"
    to: "legacy-command-bridges"
    type: "preserves"
  - from: "parity-gate"
    to: "vscode-native-agents"
    type: "validates"
  - from: "parity-gate"
    to: "claude-native-agents"
    type: "validates"
  - from: "parity-gate"
    to: "antigravity-adapter"
    type: "validates"
