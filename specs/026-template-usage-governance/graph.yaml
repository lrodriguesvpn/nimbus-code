version: "1.0"
feature: "026-template-usage-governance"
bounded_contexts:
  - governance-entitlement
  - spec-kit-workflow
  - repository-provisioning

modules:
  - id: nimbus-cli-core
    name: "Nimbus CLI Core"
    path: "scripts/nimbus-code-cli"
    type: "cli"
    dependencies:
      - local-lease-verifier
      - telemetry-buffer
    description: "Orquestrador local do framework para bootstrap, sync e invocação de agentes."

  - id: local-lease-verifier
    name: "Local Lease & Token Verifier"
    path: "scripts/lib/lease-verifier"
    type: "library"
    dependencies: []
    description: "Validador criptográfico offline baseado em chave pública Ed25519."

  - id: telemetry-buffer
    name: "Local Telemetry Buffer"
    path: "scripts/lib/telemetry"
    type: "library"
    dependencies: []
    description: "Buffer local de eventos de auditoria com garantia de Zero Source Leak."

  - id: vscode-extension
    name: "Nimbus Code VS Code Extension"
    path: "extensions/vscode"
    type: "ui-extension"
    dependencies:
      - nimbus-cli-core
    description: "Interface visual unificada do esquadrão @nimbus e controle de licença."

  - id: mcp-server
    name: "Nimbus Code MCP Server"
    path: "servers/mcp-nimbus"
    type: "service"
    dependencies:
      - nimbus-cli-core
    description: "Servidor de ferramentas MCP para Claude Code, Cursor e Antigravity."

  - id: cloud-entitlement-service
    name: "VPN Cloud Entitlement API"
    path: "cloud/entitlement-service"
    type: "backend-api"
    dependencies:
      - tenant-database
      - audit-ledger
    description: "API central da VPN para emissão de licenças e validação de tenants."

  - id: tenant-database
    name: "Tenant & License Database"
    path: "cloud/db"
    type: "database"
    dependencies: []
    description: "Banco relacional para gestão de tenants e quotas."

  - id: audit-ledger
    name: "Compliance Audit Ledger"
    path: "cloud/storage"
    type: "storage"
    dependencies: []
    description: "Storage WORM imutável para compliance de 5 anos (LGPD)."
