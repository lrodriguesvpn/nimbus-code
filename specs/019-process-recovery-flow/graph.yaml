feature: "019-process-recovery-flow"
bounded_context: "spec-kit-workflow"
version: 1

modules:
  - id: process-decision-guide
    type: documentation
    owner: platform
    responsibilities:
      - Definir a matriz de decisão entre clarify, update-spec, update-plan, converge e new-spec
      - Expor FAQ operacional para Dev, BA e agente
  - id: process-correction-contract
    type: contract
    owner: platform
    responsibilities:
      - Formalizar o contrato mínimo de decisão para correção de rota
  - id: language-policy
    type: governance
    owner: architecture-board
    responsibilities:
      - Definir idioma obrigatório para artefatos de código e documentação
      - Manter paridade entre constituição local e artefatos de distribuição
  - id: distributed-templates
    type: distribution
    owner: platform-standards
    responsibilities:
      - Replicar alterações normativas nos presets e cópias espelho aplicáveis
      - Produzir evidência de paridade antes do Go/No-Go
  - id: impact-assessment
    type: governance
    owner: platform-standards
    responsibilities:
      - Registrar riscos, owners, rollback e critérios de Go/No-Go
  - id: quickstart-validation
    type: documentation
    owner: platform
    responsibilities:
      - Validar cenários de correção de rota e edge cases da feature

dependencies:
  - from: process-decision-guide
    to: process-correction-contract
    kind: sync
    protocol: documentation-reference
  - from: process-decision-guide
    to: language-policy
    kind: sync
    protocol: governance-reference
  - from: language-policy
    to: distributed-templates
    kind: distribution
    protocol: same-pr-validated-parity
  - from: impact-assessment
    to: distributed-templates
    kind: gate
    protocol: architecture-board-approval
  - from: quickstart-validation
    to: process-decision-guide
    kind: sync
    protocol: documentation-reference
