feature: "027-cliente-plataforma-cmdb-iac"
bounded_context: "platform-governance"
version: 1

modules:
  - id: iac-link-model-migration
    type: migration
    owner: platform
    path: "platform-governance/db/migrations/005_iac_link_model.sql"
    responsibilities:
      - Criar tabelas iac_link_entry, inline_inventory_entry e link_decision_criteria
      - Preservar histórico de decisão ao migrar inline → dedicado (FR-011)
    depends_on: []

  - id: link-decision-service
    type: domain-service
    owner: platform
    path: "platform-governance/src/domain/link-decision-service.js"
    responsibilities:
      - Aplicar o critério objetivo binário (FR-005) — exigência contratual de isolamento
      - Sinalizar ambiguidade para revisão humana quando aplicável (US3 AC-2)
    depends_on:
      - iac-link-model-migration

  - id: cmdb-consolidation-service-ext
    type: domain-service
    owner: platform
    path: "platform-governance/src/domain/cmdb-consolidation-service.js"
    responsibilities:
      - Estender o consolidador de CMDB existente para incluir entradas de vínculo IaC
      - Garantir exatamente um tipo de vínculo por projeto (FR-002)
      - Impedir duplicação de conteúdo Terraform (FR-003)
    depends_on:
      - link-decision-service

  - id: cli-link-commands
    type: cli
    owner: platform
    path: "platform-governance/src/cli/main.js"
    responsibilities:
      - Expor comando de registro de vínculo (FR-001/FR-002)
      - Expor comando de consulta por cliente/projeto (FR-006)
    depends_on:
      - cmdb-consolidation-service-ext

  - id: repo-first-company-adr
    type: documentation
    owner: platform
    path: "docs/adr/0011-repo-first-company.md"
    responsibilities:
      - Documentar o padrão "IaC e estado sempre em repositório dedicado" (FR-010)
      - Referenciar vpn-nibo-connect / vpn-nibo-connect-iac como caso real
    depends_on: []

external_dependencies:
  - id: venha-pra-nuvem-client-platform
    type: external-repository
    repository: "venha-pra-nuvem/venha-pra-nuvem-client-platform"
    relationship: "consumer-of-reference-model"
    note: >
      Repositório real da instância GSN Premium (Managed Services). Fora do
      workspace desta sessão — a aplicação em produção das User Stories 1, 2 e 4
      (registrar vínculos reais, migrar o cliente existente, onboardar um
      segundo cliente piloto) depende de uma sessão/acesso dedicado a este
      repositório e NÃO é implementada a partir deste template.
    depends_on:
      - cmdb-consolidation-service-ext
      - iac-link-model-migration

tests:
  - id: iac-link-entry-contract
    path: "platform-governance/tests/contract/iac-link-entry.test.js"
    covers: ["AC-1"]
  - id: inline-inventory-entry-contract
    path: "platform-governance/tests/contract/inline-inventory-entry.test.js"
    covers: ["AC-2"]
  - id: link-dedicated-integration
    path: "platform-governance/tests/integration/link-dedicated.test.js"
    covers: ["AC-1"]
  - id: link-inline-integration
    path: "platform-governance/tests/integration/link-inline.test.js"
    covers: ["AC-2"]
  - id: link-decision-criteria-integration
    path: "platform-governance/tests/integration/link-decision-criteria.test.js"
    covers: ["AC-3"]
