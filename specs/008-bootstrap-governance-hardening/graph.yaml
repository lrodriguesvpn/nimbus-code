version: "1.0"
feature: "008-bootstrap-governance-hardening"

nodes:
  - name: "bootstrap.sh"
    type: "script"
    description: "Script de bootstrap de repositórios Nimbus-Code; estendido para perguntar tipo de repositório antes de instalar preset"

  - name: "nimbus-code-standards"
    type: "preset"
    description: "Preset de governança para repositórios Dev Standards"

  - name: "nimbus-code-platform-standards"
    type: "preset"
    description: "Preset de governança para repositórios Plataforma/Cliente"

  - name: "validate-issue-template-parity.sh"
    type: "script"
    description: "Novo script que valida paridade estrutural entre os templates de issue dos dois presets"

  - name: "ensure-github-project.yml"
    type: "workflow"
    description: "Workflow migrado de PAT para token de instalação de GitHub App"

  - name: "add-to-repo-project.yml"
    type: "workflow"
    description: "Workflow migrado de PAT para token de instalação de GitHub App"

  - name: "sync-priority-field.yml"
    type: "workflow"
    description: "Workflow migrado de PAT para token de instalação de GitHub App"

  - name: "agent-auto-assign.yml"
    type: "workflow"
    description: "Workflow migrado de PAT para token de instalação de GitHub App"

  - name: "graph-guard.yml"
    type: "workflow"
    description: "Workflow de escopo do próprio repositório — NÃO migrado, continua usando GITHUB_TOKEN nativo"

  - name: "skills-distribution-guide.md"
    type: "documentation"
    description: "Manual de skills locais (.github/skills/) vs. remotas (VPN-SKILLS)"

  - name: "validation-release-v1.19.0-rc.1"
    type: "release"
    description: "Ref imutável para o piloto; promove para v1.19.0 após os gates"

  - name: "platform-capability-profile"
    type: "governance-contract"
    description: "CMDB/evidência, zero-diff, drift, baselines, lifecycle e Landing Zone/CAF"

  - name: "dev-standards-agent-guardrails"
    type: "governance-contract"
    description: "Complexidade S0-S4, artefatos, custo, harness/playbook e gates humanos"

externals:
  - name: "github-app-nimbus-bootstrap"
    type: "identity-provider"
    description: "GitHub App organizacional (a ser criado/instalado) para automações cross-repo/org"
    criticality: "high"

  - name: "spec-kit-cli-official"
    type: "external-tool"
    description: "Fonte oficial pública do Spec Kit CLI (github.com/github/spec-kit) — única exceção ao domínio GHE-only"
    criticality: "medium"

  - name: "cmdb-and-cloud-inventory"
    type: "platform-evidence"
    description: "Fonte de evidências para inventário, validação advisory e reconciliação"
    criticality: "high"

dependencies:
  - from: "bootstrap.sh"
    to: "nimbus-code-standards"
    pattern: "conditional-install"
    priority: "critical"

  - from: "bootstrap.sh"
    to: "nimbus-code-platform-standards"
    pattern: "conditional-install"
    priority: "critical"

  - from: "bootstrap.sh"
    to: "spec-kit-cli-official"
    protocol: "https"
    pattern: "install-source"
    priority: "high"

  - from: "validate-issue-template-parity.sh"
    to: "nimbus-code-standards"
    pattern: "read-compare"
    priority: "high"

  - from: "validate-issue-template-parity.sh"
    to: "nimbus-code-platform-standards"
    pattern: "read-compare"
    priority: "high"

  - from: "ensure-github-project.yml"
    to: "github-app-nimbus-bootstrap"
    protocol: "https"
    pattern: "request-response"
    authentication: "github-app-installation-token"
    priority: "critical"

  - from: "add-to-repo-project.yml"
    to: "github-app-nimbus-bootstrap"
    protocol: "https"
    pattern: "request-response"
    authentication: "github-app-installation-token"
    priority: "critical"

  - from: "sync-priority-field.yml"
    to: "github-app-nimbus-bootstrap"
    protocol: "https"
    pattern: "request-response"
    authentication: "github-app-installation-token"
    priority: "high"

  - from: "agent-auto-assign.yml"
    to: "github-app-nimbus-bootstrap"
    protocol: "https"
    pattern: "request-response"
    authentication: "github-app-installation-token"
    priority: "high"

  - from: "graph-guard.yml"
    to: "graph-guard.yml"
    pattern: "self-contained"
    authentication: "github-token-native"
    priority: "medium"

  - from: "validation-release-v1.19.0-rc.1"
    to: "nimbus-code-project-bundle"
    pattern: "pins"
    protocol: "git-tag"
    priority: "critical"

  - from: "validation-release-v1.19.0-rc.1"
    to: "nimbus-code-platform-bundle"
    pattern: "pins"
    protocol: "git-tag"
    priority: "critical"

  - from: "nimbus-code-platform-standards"
    to: "cmdb-and-cloud-inventory"
    pattern: "advisory-evidence"
    protocol: "read-only"
    priority: "high"
