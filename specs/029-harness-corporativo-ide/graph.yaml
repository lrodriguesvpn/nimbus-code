# graph.yaml — Grafo de Módulos: Harness Corporativo — Consolidação de Harness Agêntico IDE Pessoal
#
# Lido pelo GitHub Action Graph Guard. Mapeia os módulos internos da extensão de harvest,
# o motor de sanitização local, a persistência no repositório central dedicado, a triagem do Comitê,
# o job de expurgo e a redistribuição idempotente.

feature: "029-harness-corporativo-ide"
complexity: "S4"
version: 1
updated_at: "2026-09-22"
spec_ref: "specs/029-harness-corporativo-ide/spec.md"
bounded_context: "harness-corporativo"

nodes:
  - id: "harvest-cli"
    type: "cli"
    path: "scripts/harvest-patterns.sh"
    description: "Ponto de entrada manual on-demand estendido com --source ide-harness; orquestra captura, sanitização e persistência"

  - id: "harness-anonymizer"
    type: "module"
    path: "scripts/lib/harness_anonymizer.py"
    description: "Motor de sanitização local preventiva e fail-closed; redacta credenciais, tokens, PII e analisa entropia de Shannon"

  - id: "harvest-gateway-client"
    type: "module"
    path: "scripts/harvest-patterns.sh"
    description: "Despachante HTTP que envia payload 100% sanitizado para HARVEST_API_URL via curl autenticado"

  - id: "central-repo-writer"
    type: "module"
    path: "scripts/lib/central_repo_writer.py"
    description: "Escritor isolado que persiste entradas brutas exclusivamente em nimbus-code-harness-corporativo/raw/"

  - id: "committee-triage-cli"
    type: "cli"
    path: "nimbus-code-harness-corporativo/scripts/triage-cli.py"
    description: "Ferramenta CLI do Comitê Nimbus Code para análise de candidatos, validação de quórum e promoção de regras para promoted/"

  - id: "purge-expired-job"
    type: "service"
    path: "nimbus-code-harness-corporativo/scripts/purge-expired.py"
    description: "Automação disparada via GitHub Actions cron para expurgo físico de entradas brutas com mais de 90 dias"

  - id: "satellite-sync-tool"
    type: "tool"
    path: "scripts/sync-corporate-harness.sh"
    description: "Script de redistribuição opcional idempotente para repositórios satélite de bounded contexts específicos"

edges:
  - src: "harvest-cli"
    dst: "harness-anonymizer"
    type: "sync"
    protocol: "chamada de processo local (Python CLI/lib)"
    description: "Passa o texto livre de ~/.claude/CLAUDE.md ou .cursor/rules para sanitização obrigatória antes de qualquer envio"

  - src: "harvest-cli"
    dst: "harvest-gateway-client"
    type: "sync"
    protocol: "chamada de função de script (in-process)"
    description: "Encaminha o texto aprovado pela anonimização para o montador do payload HTTP"

  - src: "harvest-cli"
    dst: "central-repo-writer"
    type: "sync"
    protocol: "chamada de processo local (Python lib)"
    description: "Persiste o RawHarnessEntry sanitizado e os metadados diretamente no diretório do repositório central"

  - src: "harvest-gateway-client"
    dst: "harvest-gateway"
    type: "sync"
    protocol: "HTTPS POST"
    description: "Envia o payload sanitizado ao Gateway (022-nimbuscode-harvest-gateway) para extração de padrões via LLM"

  - src: "central-repo-writer"
    dst: "ghe-central-repo"
    type: "sync"
    protocol: "File System / Git Write"
    description: "Grava arquivo YAML em raw/<author_hash>/ com status pending e metadados de retenção"

  - src: "committee-triage-cli"
    dst: "ghe-central-repo"
    type: "sync"
    protocol: "Git commit assinado / PR"
    description: "Atualiza status em raw/ e gera regra canônica em promoted/ com assinaturas dos membros aprovadores"

  - src: "purge-expired-job"
    dst: "ghe-central-repo"
    type: "sync"
    protocol: "File System Delete + Git Commit"
    description: "Deleta arquivos em raw/ expirados há >90 dias e registra hash imutável em archive/purge-audit.jsonl"

  - src: "satellite-sync-tool"
    dst: "satellite-repos"
    type: "sync"
    protocol: "File System Write (Idempotente)"
    description: "Atualiza bloco gerenciado em .claude/CLAUDE.md de repositório satélite sem sobrescrever customizações do dev"

externals:
  - id: "harvest-gateway"
    provider: "Azure AI Foundry / Vertex AI / AWS Bedrock (via specs/022-nimbuscode-harvest-gateway)"
    called_by: ["harvest-gateway-client"]
    criticality: "medium"
    fallback: "erro explícito com bloqueio fail-closed — nunca tentar envio cru sem sanitização"

  - id: "ghe-central-repo"
    provider: "GitHub Enterprise (venha-pra-nuvem/nimbus-code-harness-corporativo)"
    called_by: ["central-repo-writer", "committee-triage-cli", "purge-expired-job"]
    criticality: "high"
    fallback: "abortar execução se o repositório central não estiver acessível localmente ou via git"

  - id: "satellite-repos"
    provider: "GitHub Enterprise (repositórios de projeto por bounded context)"
    called_by: ["satellite-sync-tool"]
    criticality: "low"
    fallback: "gerar arquivo .divergent e aviso em log caso o destino tenha conflitos irresolúveis"
