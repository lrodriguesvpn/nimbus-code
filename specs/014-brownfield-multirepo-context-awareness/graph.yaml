# graph.yaml — Feature 014: Brownfield MultiRepo Context Awareness

feature: "014-brownfield-multirepo-context-awareness"
complexity: "S3"
version: 1
updated_at: "2026-08-21"
spec_ref: "specs/014-brownfield-multirepo-context-awareness/spec.md"

nodes:
  - id: "generate-context-graph"
    type: "module"
    path: "scripts/generate-context-graph.sh"
    description: "Lê bounded-contexts.yaml, analisa manifestos de dependências dos repos do contexto (local ou via gh api) e gera graph.yaml + graph.md por bounded context"

  - id: "harvest-patterns"
    type: "module"
    path: "scripts/harvest-patterns.sh"
    description: "Varre metadados estruturais de um repo (nomes, assinaturas, anotações) e envia ao LLM via API para identificar padrões arquiteturais reutilizáveis; atualiza reuse-catalog.yaml com aviso de duplicata"

  - id: "context-graph-refresh-workflow"
    type: "module"
    path: ".github/workflows/context-graph-refresh.yml"
    description: "Workflow CI que invoca generate-context-graph.sh automaticamente quando bounded-contexts.yaml é alterado"

  - id: "speckit-specify-skill"
    type: "module"
    path: ".github/skills/speckit-specify/SKILL.md"
    description: "Instrui o agente a invocar generate-context-graph.sh ao iniciar uma nova spec para bounded context com repos mapeados; emite aviso (não bloqueia) quando contexto não tem repos"

  - id: "bounded-contexts-yaml"
    type: "module"
    cross_repo: false
    path: "docs/bounded-contexts.yaml"
    description: "Fonte de verdade de bounded contexts e repos — implementado pela feature 006. Lido por generate-context-graph.sh e harvest-patterns.sh"

  - id: "reuse-catalog-yaml"
    type: "module"
    path: "docs/reuse-catalog.yaml"
    description: "Catálogo de padrões reutilizáveis — atualizado diretamente pelo harvest-patterns.sh com aviso de duplicata"

  - id: "generate-context-graph-tests"
    type: "module"
    path: "tests/scripts/generate-context-graph.bats"
    description: "Testes unitários bats-core para generate-context-graph.sh (AC-1, AC-5, AC-6)"

  - id: "harvest-patterns-tests"
    type: "module"
    path: "tests/scripts/harvest-patterns.bats"
    description: "Testes unitários bats-core para harvest-patterns.sh (AC-3, idempotência)"

  - id: "copilot-instructions-template"
    type: "module"
    path: "presets/nimbus-code-standards/templates/project-root/copilot-instructions.md"
    description: "Template de instruções ao agente — recebe passo obrigatório de consulta ao graph.yaml e reuse-catalog.yaml antes de /speckit-plan"

  - id: "plan-template"
    type: "module"
    path: "presets/nimbus-code-standards/templates/plan-template.md"
    description: "Template do plan.md — recebe seção 'Grafo do Contexto' (FR-009)"

  - id: "module-graphs-doc"
    type: "module"
    path: "docs/module-graphs.md"
    description: "Documentação do sistema de grafos — recebe seção sobre grafos multi-repo e campo cross_repo"

edges:
  - src: "generate-context-graph"
    dst: "bounded-contexts-yaml"
    type: "sync"
    protocol: "file read"
    description: "Lê lista de repos do bounded context declarado"

  - src: "generate-context-graph"
    dst: "ghe-api"
    type: "sync"
    protocol: "gh api / HTTPS"
    description: "Fallback quando repos não estão disponíveis para clone local — lê manifestos de dependências via GitHub API"

  - src: "generate-context-graph"
    dst: "yq-python3"
    type: "sync"
    protocol: "subprocess"
    description: "Usa yq ou python3 para parsear bounded-contexts.yaml"

  - src: "harvest-patterns"
    dst: "bounded-contexts-yaml"
    type: "sync"
    protocol: "file read"
    description: "Lê slug e bounded_context para preencher campo na entrada do catálogo"

  - src: "harvest-patterns"
    dst: "reuse-catalog-yaml"
    type: "sync"
    protocol: "file read + write"
    description: "Verifica duplicatas por tag antes de inserir nova entrada; insere com aviso se tag nova"

  - src: "harvest-patterns"
    dst: "llm-api"
    type: "sync"
    protocol: "HTTPS / OpenAI-compatible"
    description: "Envia metadados estruturais do repo e recebe padrões candidatos; custo de tokens registrado em log"

  - src: "context-graph-refresh-workflow"
    dst: "generate-context-graph"
    type: "sync"
    protocol: "subprocess (bash)"
    description: "Invoca generate-context-graph.sh para cada bounded context quando bounded-contexts.yaml é alterado"

  - src: "context-graph-refresh-workflow"
    dst: "ghe-api"
    type: "sync"
    protocol: "GITHUB_TOKEN / HTTPS"
    description: "Acesso ao repo para checkout e commit do graph.yaml gerado"

  - src: "speckit-specify-skill"
    dst: "bounded-contexts-yaml"
    type: "sync"
    protocol: "file read (agent instruction)"
    description: "Agente verifica se bounded context da spec tem repos mapeados antes de decidir invocar o script"

  - src: "speckit-specify-skill"
    dst: "generate-context-graph"
    type: "sync"
    protocol: "bash call (agent)"
    description: "Agente invoca o script on-demand ao abrir nova spec com bounded context mapeado"

  - src: "generate-context-graph-tests"
    dst: "generate-context-graph"
    type: "sync"
    protocol: "subprocess (bats run)"
    description: "Testa geração de grafo, fallback sem repos mapeados e fallback de CI via mock de gh api"

  - src: "harvest-patterns-tests"
    dst: "harvest-patterns"
    type: "sync"
    protocol: "subprocess (bats run)"
    description: "Testa detecção de padrões Java, idempotência e aviso de duplicata"

  - src: "copilot-instructions-template"
    dst: "bounded-contexts-yaml"
    type: "async"
    protocol: "documentation reference"
    description: "Instrui o agente a consultar bounded-contexts.yaml para identificar o graph.yaml do contexto ativo antes de /speckit-plan"

  - src: "plan-template"
    dst: "generate-context-graph"
    type: "async"
    protocol: "documentation reference"
    description: "Seção 'Grafo do Contexto' instrui o agente a linkar o graph.yaml gerado no plan.md"

externals:
  - id: "ghe-api"
    provider: "GitHub Enterprise Cloud"
    called_by: ["generate-context-graph", "context-graph-refresh-workflow"]
    criticality: "medium"
    fallback: "Se API indisponível: o script documenta quais repos não puderam ser analisados e continua com os disponíveis"
    note: "Usado como fallback quando repos não estão disponíveis para clone local"

  - id: "llm-api"
    provider: "Copilot API / OpenAI-compatible endpoint (configurável)"
    called_by: ["harvest-patterns"]
    criticality: "medium"
    fallback: "Se API indisponível: harvest aborts com mensagem de erro e instrução de verificar HARVEST_API_URL/HARVEST_API_TOKEN"
    note: "Exclusivamente on-demand — nunca em CI. Endpoint configurável via HARVEST_API_URL; token via HARVEST_API_TOKEN"

  - id: "yq-python3"
    provider: "mikefarah/yq + python3 stdlib"
    called_by: ["generate-context-graph", "harvest-patterns"]
    criticality: "low"
    fallback: "python3 -c 'import yaml, sys' — disponível em macOS/Ubuntu modernos. Se ambos ausentes: aviso + instrução de instalação"
