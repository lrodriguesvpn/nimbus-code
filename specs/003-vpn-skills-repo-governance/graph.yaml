apiVersion: "1.0"
kind: "ModuleGraph"
metadata:
  name: "vpn-skills-repo-governance"
  version: "003"
  created: "2026-08-12"
  updated: "2026-08-12"

# Module dependency graph for VPN-SKILLS feature
# This defines all services, modules, and their communication protocols

modules:
  # Core Repository Module
  - name: "vpn-skills-repo-core"
    type: "service"
    description: "Central Git repository storing all VPN skills and metadata"
    technology: "GitHub"
    layer: "data"
    healthCheck:
      protocol: "http"
      endpoint: "/api/health"
      interval: "30s"
    
  # REST API Server
  - name: "vpn-skills-api"
    type: "service"
    description: "REST API for skill discovery, validation, and compliance reporting"
    technology: "Node.js/Express"
    layer: "api"
    port: 8080
    replicas:
      min: 2
      max: 10
    resources:
      cpu: "500m"
      memory: "512Mi"
    healthCheck:
      protocol: "http"
      endpoint: "/health"
      interval: "10s"
      timeout: "5s"
    
  # CLI Tool Module
  - name: "vpn-skills-cli"
    type: "service"
    description: "Command-line interface for skill management and validation"
    technology: "Go/Cobra"
    layer: "client"
    distributed: true
    installMethod: "curl | bash"
    
  # Compliance Engine
  - name: "vpn-skills-compliance-engine"
    type: "service"
    description: "Automated compliance scanning and reporting"
    technology: "Python/FastAPI"
    layer: "backend"
    port: 8081
    replicas:
      min: 1
      max: 5
    resources:
      cpu: "1000m"
      memory: "1Gi"
    
  # Discovery Dashboard
  - name: "vpn-skills-discovery-dashboard"
    type: "web"
    description: "Web UI for skill discovery and project compliance"
    technology: "React/TypeScript"
    layer: "frontend"
    port: 3000
    replicas:
      min: 2
      max: 5
    
  # PostgreSQL Database
  - name: "vpn-skills-db"
    type: "database"
    description: "Primary data store for skills metadata and compliance history"
    technology: "PostgreSQL 14"
    layer: "data"
    port: 5432
    replicas:
      min: 1
      max: 3
    backup:
      enabled: true
      frequency: "daily"
      retention: "30d"
    
  # Cache Layer
  - name: "vpn-skills-cache"
    type: "cache"
    description: "In-memory cache for skill list and validation rules"
    technology: "Redis 7"
    layer: "data"
    port: 6379
    replicas:
      min: 1
      max: 3
    ttl: "3600s"
    
  # Message Queue
  - name: "vpn-skills-queue"
    type: "queue"
    description: "Event queue for async compliance scanning and notifications"
    technology: "Apache Kafka"
    layer: "messaging"
    port: 9092
    retention: "7d"
    partitions: 10
    
  # Notification Service
  - name: "vpn-skills-notifier"
    type: "service"
    description: "Sends compliance alerts and deprecation notifications"
    technology: "Python/Celery"
    layer: "backend"
    replicas:
      min: 1
      max: 3
    channels: ["email", "slack", "github-issues"]

# External dependencies (outside VPN-SKILLS)
externals:
  - name: "github-api"
    type: "service"
    description: "GitHub REST API for repo operations and webhooks"
    
  - name: "npm-registry"
    type: "registry"
    description: "npm package registry for publishing CLI tool"
    
  - name: "pypi-registry"
    type: "registry"
    description: "Python Package Index for publishing compliance engine"
    
  - name: "docker-registry"
    type: "registry"
    description: "Docker Hub or private registry for container images"
    
  - name: "slack-api"
    type: "service"
    description: "Slack API for notifications and integrations"
    
  - name: "sendgrid"
    type: "service"
    description: "Email service for compliance notifications"

# Dependencies and communication patterns
dependencies:
  # API → Database
  - from: "vpn-skills-api"
    to: "vpn-skills-db"
    protocol: "tcp"
    port: 5432
    pattern: "request-response"
    authentication: "postgresql-user"
    encryption: "tls"
    priority: "critical"
    
  # API → Cache
  - from: "vpn-skills-api"
    to: "vpn-skills-cache"
    protocol: "tcp"
    port: 6379
    pattern: "request-response"
    ttl: "3600s"
    priority: "high"
    
  # API → Repository
  - from: "vpn-skills-api"
    to: "vpn-skills-repo-core"
    protocol: "https"
    pattern: "request-response"
    authentication: "github-token"
    priority: "high"
    
  # CLI → API
  - from: "vpn-skills-cli"
    to: "vpn-skills-api"
    protocol: "https"
    port: 8080
    pattern: "request-response"
    authentication: "api-key"
    priority: "high"
    
  # CLI → Repository
  - from: "vpn-skills-cli"
    to: "vpn-skills-repo-core"
    protocol: "https"
    pattern: "request-response"
    authentication: "git-token"
    priority: "high"
    
  # Compliance Engine → API
  - from: "vpn-skills-compliance-engine"
    to: "vpn-skills-api"
    protocol: "https"
    port: 8080
    pattern: "request-response"
    priority: "critical"
    
  # Compliance Engine → Database
  - from: "vpn-skills-compliance-engine"
    to: "vpn-skills-db"
    protocol: "tcp"
    port: 5432
    pattern: "request-response"
    priority: "critical"
    
  # Compliance Engine → Queue
  - from: "vpn-skills-compliance-engine"
    to: "vpn-skills-queue"
    protocol: "tcp"
    port: 9092
    pattern: "publish"
    priority: "high"
    
  # Notifier → Queue
  - from: "vpn-skills-notifier"
    to: "vpn-skills-queue"
    protocol: "tcp"
    port: 9092
    pattern: "subscribe"
    priority: "high"
    
  # Notifier → Slack
  - from: "vpn-skills-notifier"
    to: "slack-api"
    protocol: "https"
    pattern: "request-response"
    authentication: "webhook-token"
    priority: "medium"
    
  # Notifier → Email
  - from: "vpn-skills-notifier"
    to: "sendgrid"
    protocol: "https"
    pattern: "request-response"
    authentication: "api-key"
    priority: "medium"
    
  # Dashboard → API
  - from: "vpn-skills-discovery-dashboard"
    to: "vpn-skills-api"
    protocol: "https"
    pattern: "rest"
    authentication: "oauth2"
    priority: "high"
    
  # Dashboard → Cache (for frontend optimization)
  - from: "vpn-skills-discovery-dashboard"
    to: "vpn-skills-cache"
    protocol: "tcp"
    port: 6379
    pattern: "request-response"
    priority: "medium"
    
  # Database → Backup
  - from: "vpn-skills-db"
    to: "backup-storage"
    protocol: "s3"
    pattern: "push"
    frequency: "daily"
    priority: "high"

# Network policies and security
networkPolicies:
  - name: "api-ingress"
    description: "Ingress to API server"
    allowedSources: ["public", "internal-ci"]
    port: 8080
    protocol: "https"
    
  - name: "db-ingress"
    description: "Ingress to database"
    allowedSources: ["vpn-skills-api", "vpn-skills-compliance-engine"]
    port: 5432
    protocol: "tcp"
    encryption: "tls"
    
  - name: "queue-ingress"
    description: "Ingress to message queue"
    allowedSources: ["vpn-skills-compliance-engine", "vpn-skills-notifier"]
    port: 9092
    protocol: "tcp"
    encryption: "tls"

# Deployment topology
deployment:
  environments:
    - name: "development"
      namespace: "vpn-skills-dev"
      kubernetesCluster: "dev-cluster"
      replicas: 1
      
    - name: "staging"
      namespace: "vpn-skills-staging"
      kubernetesCluster: "staging-cluster"
      replicas: 2
      
    - name: "production"
      namespace: "vpn-skills-prod"
      kubernetesCluster: "prod-cluster"
      replicas: 3
      regions: ["us-east-1", "us-west-2", "eu-west-1"]
      
  containerRegistry: "ghcr.io/org/vpn-skills"
  imageTag: "latest"
  
# Integration points with downstream projects
integrations:
  - name: "project-bootstrap-template"
    type: "git-submodule"
    description: "Reference to skills.yaml schema in project templates"
    repository: "https://github.com/org/nimbus-code-spec-kit-template"
    path: "templates/skills.yaml"
    
  - name: "github-actions-workflow"
    type: "github-actions"
    description: "Reusable workflow for skills validation in CI/CD"
    repository: "https://github.com/org/vpn-skills"
    workflow: ".github/workflows/validate.yml"
    
  - name: "terraform-modules"
    type: "git-submodule"
    description: "IaC modules for deploying VPN-SKILLS infrastructure"
    repository: "https://github.com/org/vpn-skills-infrastructure"
    path: "terraform/modules"

