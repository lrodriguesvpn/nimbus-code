schema_version: "1.0"

bundle:
  id: "nimbus-code-platform-bundle"
  name: "Nimbus-Code — Modelo de Plataforma/Cliente"
  version: "0.1.2"
  role: "all"
  description: "Bundle de bootstrap para repositórios de PLATAFORMA/CLIENTE/TENANT da Nimbus-Code: aplica o preset nimbus-code-platform-standards (inventário multi-nuvem Azure/AWS/GCP/GWS/M365/D365, grafo de superfícies de plataforma, registro de schemas de sistemas legados e regra de zero-diff como critério de verdade — nunca aplica mudança direta em ambiente). Distinto do nimbus-code-project-bundle, que é para repositórios de projeto/workload."
  author: "Nimbus-Code"
  license: "Proprietary"

requires:
  speckit_version: ">=0.16.0"

provides:
  presets:
    - id: "nimbus-code-platform-standards"
      version: "0.1.2"
      source: "https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/nimbus-code-spec-kit-template"
      priority: 5
      strategy: "wrap"

tags:
  - "nimbus-code"
  - "governance"
  - "platform"
  - "multi-cloud"
  - "legacy"
  - "infrastructure-as-code"
  - "terraform"
  - "m365"
  - "d365"
  - "drift-detection"
