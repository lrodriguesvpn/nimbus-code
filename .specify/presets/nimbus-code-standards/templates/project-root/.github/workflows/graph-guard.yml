name: Graph Guard — Grafo de Módulos Obrigatório

# Detecta PRs que alteram código-fonte (src/, services/, infrastructure/,
# modules/) sem atualizar o graph.yaml e graph.md correspondentes.
# Falha com mensagem explicativa indicando quais arquivos estão faltando.
#
# Instalar este workflow em cada repositório do projeto:
#   cp .github/workflows/graph-guard.yml <repo>/.github/workflows/
# Ou incluir via reutilização de workflow (workflow_call) se preferível.

on:
  pull_request:
    branches: ["**"]
    paths:
      - "src/**"
      - "services/**"
      - "infrastructure/**"
      - "modules/**"
      - "packages/**"
      - "apps/**"
      - "libs/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  graph-guard:
    name: Validar Grafo de Módulos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Listar arquivos alterados na PR
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE" "$HEAD" > /tmp/changed_files.txt
          echo "=== Arquivos alterados ==="
          cat /tmp/changed_files.txt

      - name: Verificar se graph.yaml e graph.md foram atualizados
        id: check
        run: |
          CHANGED=/tmp/changed_files.txt
          MISSING=()
          FEATURES=()

          # Extrair features únicas a partir dos paths alterados em specs/*/
          while IFS= read -r file; do
            if [[ "$file" == specs/*/graph.yaml || "$file" == specs/*/graph.md ]]; then
              FEATURE=$(echo "$file" | cut -d/ -f2)
              FEATURES+=("$FEATURE")
            fi
          done < "$CHANGED"

          # Verificar se algum arquivo de código foi alterado SEM tocar specs/*/graph.*
          CODE_CHANGED=false
          while IFS= read -r file; do
            if [[ "$file" =~ ^(src|services|infrastructure|modules|packages|apps|libs)/ ]]; then
              CODE_CHANGED=true
              break
            fi
          done < "$CHANGED"

          if [[ "$CODE_CHANGED" == "true" ]]; then
            # Verificar graph.yaml
            GRAPH_YAML_UPDATED=false
            GRAPH_MD_UPDATED=false
            while IFS= read -r file; do
              [[ "$file" == specs/*/graph.yaml ]] && GRAPH_YAML_UPDATED=true
              [[ "$file" == specs/*/graph.md ]]   && GRAPH_MD_UPDATED=true
            done < "$CHANGED"

            if [[ "$GRAPH_YAML_UPDATED" == "false" ]]; then
              MISSING+=("specs/<feature>/graph.yaml")
            fi
            if [[ "$GRAPH_MD_UPDATED" == "false" ]]; then
              MISSING+=("specs/<feature>/graph.md")
            fi
          fi

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "MISSING=${MISSING[*]}" >> "$GITHUB_OUTPUT"
            echo "FAILED=true"          >> "$GITHUB_OUTPUT"
          else
            echo "FAILED=false"         >> "$GITHUB_OUTPUT"
          fi

      - name: Comentar na PR com instruções (se falhar)
        if: steps.check.outputs.FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const missing = `${{ steps.check.outputs.MISSING }}`.split(' ').join('\n- ');
            const body = `## ❌ Graph Guard — Grafo de Módulos Obrigatório

            Esta PR altera código-fonte mas não inclui a atualização do grafo de módulos.

            **Arquivos obrigatórios ausentes ou não atualizados:**
            - ${missing}

            ### O que fazer

            1. Identifique (ou crie) a feature em \`specs/<feature-slug>/\`.
            2. Copie os templates de:
               - \`presets/nimbus-code-standards/templates/feature-artifacts/graph.yaml\`
               - \`presets/nimbus-code-standards/templates/feature-artifacts/graph.md\`
            3. Preencha com os módulos e dependências reais desta PR.
            4. Para complexidade **S3 ou S4**, crie também \`impact-map.md\` no mesmo diretório.
            5. Commit os arquivos nesta mesma PR e faça push.

            ### Por que isso é obrigatório?

            O grafo de módulos é a fonte da verdade estrutural do sistema. Mantê-lo atualizado
            a cada PR garante rastreabilidade de dependências, análise de impacto e reduz o custo
            de onboarding e debugging. Ver [docs/module-graphs.md](../docs/module-graphs.md).

            > _Gate definido pelo preset \`nimbus-code-standards\` — [saiba mais](https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/nimbus-code)._
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Falhar o check (se grafo ausente)
        if: steps.check.outputs.FAILED == 'true'
        run: |
          echo "::error::Graph Guard: graph.yaml e/ou graph.md não foram atualizados nesta PR."
          echo "::error::Toda PR que altera src/, services/, infrastructure/ ou modules/ deve"
          echo "::error::atualizar specs/<feature>/graph.yaml e specs/<feature>/graph.md."
          exit 1

      - name: Verificar atualização de graph.yaml vs. graph.md (consistência)
        if: steps.check.outputs.FAILED == 'false'
        run: |
          CHANGED=/tmp/changed_files.txt
          YAML_UPDATED=false
          MD_UPDATED=false

          while IFS= read -r file; do
            [[ "$file" == specs/*/graph.yaml ]] && YAML_UPDATED=true
            [[ "$file" == specs/*/graph.md ]]   && MD_UPDATED=true
          done < "$CHANGED"

          # Se um foi atualizado mas não o outro, avisar (não falhar, mas alertar)
          if [[ "$YAML_UPDATED" == "true" && "$MD_UPDATED" == "false" ]]; then
            echo "::warning::graph.yaml foi atualizado mas graph.md não — mantenha ambos sincronizados."
          fi
          if [[ "$YAML_UPDATED" == "false" && "$MD_UPDATED" == "true" ]]; then
            echo "::warning::graph.md foi atualizado mas graph.yaml não — mantenha ambos sincronizados."
          fi

          echo "✅ Graph Guard: grafo atualizado corretamente nesta PR."

      - name: Verificar complexity S3/S4 exige impact-map.md
        run: |
          CHANGED=/tmp/changed_files.txt
          IMPACT_MISSING=()

          # Para cada graph.yaml atualizado, verificar se complexity é S3/S4
          while IFS= read -r file; do
            if [[ "$file" == specs/*/graph.yaml ]]; then
              FEATURE=$(echo "$file" | cut -d/ -f2)
              YAML_PATH="specs/${FEATURE}/graph.yaml"

              if [[ -f "$YAML_PATH" ]]; then
                COMPLEXITY=$(grep -E '^complexity:' "$YAML_PATH" | sed -E 's/complexity:[[:space:]]+"?([^"]+)"?.*/\1/' | tr -d ' ')
                if [[ "$COMPLEXITY" == "S3" || "$COMPLEXITY" == "S4" ]]; then
                  IMPACT_PATH="specs/${FEATURE}/impact-map.md"
                  if ! grep -q "specs/${FEATURE}/impact-map.md" "$CHANGED" && [[ ! -f "$IMPACT_PATH" ]]; then
                    IMPACT_MISSING+=("${FEATURE} (${COMPLEXITY}): specs/${FEATURE}/impact-map.md")
                  fi
                fi
              fi
            fi
          done < "$CHANGED"

          if [[ ${#IMPACT_MISSING[@]} -gt 0 ]]; then
            echo "::error::Graph Guard: features S3/S4 exigem impact-map.md:"
            for item in "${IMPACT_MISSING[@]}"; do
              echo "::error::  - $item"
            done
            exit 1
          fi
