name: Tag release on main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag from bundle version (if needed)
        run: |
          set -euo pipefail

          VERSION=$(grep -m1 -E '^[[:space:]]*version:' bundles/nimbus-code-project-bundle/bundle.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          TAG="v${VERSION}"

          if [ -z "${VERSION:-}" ]; then
            echo "Could not determine bundle version."
            exit 1
          fi

          git fetch --tags origin

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Current SHA is not on main. Refusing to tag."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG"
