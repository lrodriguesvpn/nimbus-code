name: Close referenced issues fallback

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close-referenced-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close referenced open issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const text = `${pr.title || ""}\n${pr.body || ""}`;

            const collected = new Set();

            // Only standard auto-close keywords count as evidence of completion.
            // NOTE: heuristics that closed issues merely *mentioned* in the PR text
            // (e.g. any line containing the word "issue(s)", or a free-form
            // "Issues Resolvidas" section) were removed after causing false-positive
            // closures — a PR that only *referenced* an issue for context, without
            // actually completing it, was incorrectly marking it as done. Require an
            // explicit closing keyword (GitHub's own supported syntax) instead.
            const keywordRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/ig;
            for (const match of text.matchAll(keywordRegex)) {
              collected.add(Number(match[1]));
            }

            const candidates = [...collected].filter((n) => n > 0 && n !== pr.number);
            core.info(`Referenced issue candidates: ${candidates.join(", ") || "(none)"}`);

            for (const issue_number of candidates) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number });

                // Skip PRs and already-closed issues.
                if (issue.data.pull_request || issue.data.state !== "open") {
                  continue;
                }

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number,
                  state: "closed",
                  state_reason: "completed",
                });

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: `Fechada automaticamente via fallback após merge da PR #${pr.number} (${pr.html_url}).`,
                });

                core.info(`Closed issue #${issue_number}`);
              } catch (error) {
                core.warning(`Failed to process #${issue_number}: ${error.message}`);
              }
            }
