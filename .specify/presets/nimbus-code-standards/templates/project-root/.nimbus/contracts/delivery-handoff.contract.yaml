# Fonte canônica: specs/017-nimbus-digital-engineer-platform/contracts/delivery-handoff.contract.yaml
contract: delivery-handoff
version: 1.1.0
description: Contrato do pacote final de handoff para cliente

payload:
  required:
    - intake_entry_id
    - result_summary
    - quality_evidence
    - acceptance_evidence
    - cost_ai_tokens
    - execution_time_minutes
    - cost_human_hours
    - quality_status
    - rework_summary
    - rework_percentage
    - final_decision
    - pending_owners
  properties:
    intake_entry_id: { type: string }
    result_summary: { type: string }
    quality_evidence:
      type: array
      minItems: 1
      items: { type: string }
    acceptance_evidence:
      type: array
      minItems: 1
      items: { type: string }
    cost_ai_tokens:
      type: number
      minimum: 0
      description: Total de tokens consumidos pela execução do agente.
    execution_time_minutes:
      type: number
      minimum: 0
      description: Tempo total da execução agêntica, do start ao handoff.
    cost_human_hours:
      type: number
      minimum: 0
      description: Soma das horas humanas aplicadas no ciclo híbrido.
    quality_status:
      type: string
      enum: [passed, passed_with_conditions, failed]
      description: Estado consolidado da qualidade da entrega.
    pending_items:
      type: array
      items: { type: string }
    pending_owners:
      type: array
      items: { type: string }
      description: Responsáveis por cada pendência registrada
    next_steps:
      type: array
      items: { type: string }
    rework_summary:
      type: string
      description: Resumo do retrabalho ocorrido ou explicitamente 'sem retrabalho'.
    rework_percentage:
      type: number
      minimum: 0
      maximum: 100
      description: Percentual do esforço total consumido por retrabalho.
    final_decision:
      type: string
      enum: [approved, approved_with_conditions, rejected]
