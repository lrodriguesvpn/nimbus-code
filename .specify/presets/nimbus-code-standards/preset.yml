schema_version: "1.0"

preset:
  id: "nimbus-code-standards"
  name: "Nimbus-Code — Padrões de Governança"
  version: "1.16.0"
  description: "Constituição base, grafos de módulos obrigatórios (incluindo grafo de contexto multi-repo para brownfield), escala S0–S4 com estimativa de tokens e ajuste por projeto, catálogo de reuso de conteúdo para reduzir custo de tokens, SLO Gate, estratégia de release, ADRs, taxonomia de labels de priorização/desenvolvimento autônomo/DORA, modelo híbrido humano+agente, framework DevSecOps, regras de isolamento de sessões de agente (1 agente por arquivo, fases, limpeza de branches perdidas), rastreamento de custo financeiro real (tokens × preço) por fase SDD, modelo de entrevista de descoberta (negócio/infraestrutura/segurança/LGPD), detecção determinística de retrabalho via histórico git (retro-signal), e manual operacional de uso de agentes remotos da Nimbus-Code, aplicados sobre os templates nativos do Nimbus Code."
  author: "Nimbus-Code"
  repository: "https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/nimbus-code-spec-kit-template"
  license: "Proprietary"

requires:
  speckit_version: ">=0.16.0"
  extensions:
    - id: "cost"
      version: ">=1.0.0"
      repository: "https://github.com/Quratulain-bilal/spec-kit-cost"

provides:
  templates:
    # Envolve o template nativo de constituição com os princípios não-negociáveis
    # da empresa. {CORE_TEMPLATE} preserva a estrutura de fábrica do Nimbus Code por
    # baixo — o preset só adiciona, nunca remove, o que o Nimbus Code já oferece.
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      strategy: "wrap"
      replaces: "constitution-template"
      description: "Princípios não-negociáveis da Nimbus-Code, incluindo regras de grafos de módulos e escala de complexidade S0–S4."

    # Acrescenta o Security/DevSecOps Gate, a classificação de complexidade S0–S4,
    # o Module Dependency Graph, o SLO Gate e a Estratégia de Release obrigatórios
    # ao final do plan-template.md nativo.
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      strategy: "append"
      replaces: "plan-template"
      description: "Classificação S0–S4, Module Dependency Graph, SLO Gate, Estratégia de Release, Security/DevSecOps Gate e Architecture Decision Log padrão da Nimbus-Code."

    # Acrescenta cabeçalho obrigatório (S0–S4, bounded context, SLO alvo) e
    # critérios de aceitação no formato BDD ao spec-template nativo.
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      strategy: "prepend"
      replaces: "spec-template"
      description: "Cabeçalho obrigatório com complexidade, bounded context, SLO alvo e critérios de aceitação BDD."

    # Acrescenta o checklist DevSecOps + grafo + feature flag + SLO por tarefa.
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      strategy: "append"
      replaces: "tasks-template"
      description: "Checklist de qualidade/segurança, grafo, feature flag e SLO por tarefa."

    # Template de graph.yaml para features — gerado em specs/<feature>/graph.yaml.
    - type: "template"
      name: "graph-yaml"
      file: "templates/feature-artifacts/graph.yaml"
      description: "Grafo de módulos estruturado (fonte de verdade para o Graph Guard)."

    # Template de graph.md para features — gerado em specs/<feature>/graph.md.
    - type: "template"
      name: "graph-md"
      file: "templates/feature-artifacts/graph.md"
      description: "Grafo de módulos em Mermaid para leitura humana (código + business)."

    # Template de impact-map.md para features S3/S4 — gerado em specs/<feature>/impact-map.md.
    - type: "template"
      name: "impact-map"
      file: "templates/feature-artifacts/impact-map.md"
      description: "Mapa de impacto e análise de risco — obrigatório para S3 e S4."

    # Template de retrospectiva leve por feature — gerado em specs/<feature>/retro.md.
    # Preencher quando a implementação divergiu do plano: grafo mudou, SLO não atingido,
    # bug inesperado. Alimenta o reuse-catalog.yaml com aprendizados negativos também.
    - type: "template"
      name: "retro-template"
      file: "templates/feature-artifacts/retro-template.md"
      description: "Retrospectiva leve por feature: divergências do plano, causa raiz e ação para o próximo ciclo."

    # Modelo de entrevista de descoberta — gerado em specs/<feature>/interview.md
    # quando uma entrevista é conduzida antes do spec.md. Cobre negócio (o quê/
    # por quê), infraestrutura, segurança e LGPD sem prescrever o "como" técnico.
    # Checagem de cobertura mínima aplicada por .github/skills/speckit-specify/
    # SKILL.md. Desenhado para uso humano hoje e condução futura pelo NIMBUS
    # AGENT via Teams — ver specs/018-nimbus-agent-intake/spec.md.
    - type: "template"
      name: "interview-template"
      file: "templates/feature-artifacts/interview-template.md"
      description: "Modelo de entrevista de descoberta (negócio, infraestrutura, segurança, LGPD) com checklist de cobertura mínima validada pelo /speckit-specify."

    # Template ADR — copiado para docs/adr/NNNN-slug.md no projeto ou neste repo.
    - type: "template"
      name: "adr-template"
      file: "templates/adr/NNNN-template.md"
      description: "Template de Architecture Decision Record (formato MADR)."

    # Template de copilot-instructions.md para o repositório do projeto.
    - type: "template"
      name: "copilot-instructions"
      file: "templates/project-root/copilot-instructions.md"
      description: "Instruções do Copilot com regras de grafo, escala S0–S4 e feature flags pré-configuradas."

    # Lista oficial dos bounded contexts do projeto — copiado para
    # docs/bounded-contexts.yaml (ou raiz do projeto). O agente verifica este
    # arquivo antes de preencher o campo "Bounded Context" numa spec nova,
    # evitando nomes ad-hoc e divergências entre features.
    - type: "template"
      name: "bounded-contexts"
      file: "templates/project-root/bounded-contexts.yaml"
      description: "Fonte de verdade dos bounded contexts do projeto — validada pelo agente ao criar novas specs."

    # Perfis de custo humano (Júnior/Pleno/Sênior) e taxa/hora — copiado para
    # docs/cost-profiles-and-rates.md no projeto, usado para compor o custo
    # real do modelo híbrido (agente + humano).
    - type: "template"
      name: "cost-profiles-and-rates"
      file: "templates/cost-profiles-and-rates.md"
      description: "Perfis de senioridade (Júnior/Pleno/Sênior) e taxa média de custo/hora para controle de custo real do modelo híbrido agente+humano."

    # Manual operacional de uso de sessões remotas de agente, branches e
    # governança de branches perdidas — copiado para docs/agent-session-manual.md
    # no projeto. Explica o comportamento esperado de sessões, ciclo de vida de
    # branches e o que o Dev não deve fazer.
    - type: "template"
      name: "agent-session-manual"
      file: "templates/agent-session-manual.md"
      description: "Manual de uso de sessões remotas Copilot: isolamento de agentes, ciclo de vida de branches, controle de branches perdidas e regras para o Dev."

    # Índice de padrões/decisões reaproveitáveis — copiado para
    # docs/reuse-catalog.yaml no projeto. Consultado pelo agente antes de
    # re-derivar uma solução do zero, reduzindo custo de tokens.
    - type: "template"
      name: "reuse-catalog"
      file: "templates/reuse-catalog.yaml"
      description: "Catálogo machine-readable de padrões/ADRs reaproveitáveis por tag/bounded-context, referenciado por ponteiro em vez de duplicado — ver docs/ai-code-quality-and-observability.md, seção 9."

    # Configuração de rastreamento de custo financeiro real (tokens × preço)
    # por fase SDD — copiado para .specify/cost/cost-config.yml no projeto.
    # Permite tracking de custo real (input × output tokens × modelo × preço)
    # e comparação de custo entre integrations (Claude, Copilot, Gemini, etc.).
    - type: "template"
      name: "cost-config"
      file: "templates/project-root/.specify/cost/cost-config-template.yml"
      strategy: "copy"
      description: "Configuração de rastreamento de custo financeiro real por fase SDD — tabelas de preço por integração e limites de orçamento por feature/fase."

    # Harness Engineering — catálogo de aprendizado organizacional com erros,
    # guia de uso, template de post-mortem e script de busca. Consultado pelo
    # agente antes de qualquer /nimbus-code-plan (ver instrução em
    # copilot-instructions.md e Harness Gate do plan-template.md).
    - type: "template"
      name: "harness-catalog"
      file: "templates/project-root/docs/harness/harness-catalog.yaml"
      description: "Catálogo machine-readable de padrões de erro/incidente por tag e bounded_context — copiado para docs/harness/harness-catalog.yaml."

    - type: "template"
      name: "harness-readme"
      file: "templates/project-root/docs/harness/README.md"
      description: "Conceito, fluxo de uso e tabela de arquivos do Harness Engineering — copiado para docs/harness/README.md."

    - type: "template"
      name: "harness-guide"
      file: "templates/project-root/docs/harness/harness-guide.md"
      description: "Protocolo de consulta/escrita de entradas do harness e ciclo de vida pending → cataloged — copiado para docs/harness/harness-guide.md."

    - type: "template"
      name: "harness-incident-template"
      file: "templates/project-root/docs/harness/incident-template.md"
      description: "Template de post-mortem (5 Whys, timeline, ações preventivas) — copiado para docs/harness/incident-template.md."

    - type: "template"
      name: "harness-search-script"
      file: "templates/project-root/scripts/harness-search.sh"
      strategy: "copy"
      description: "Script de busca rápida no harness-catalog.yaml por tag/bounded_context — copiado para scripts/harness-search.sh."

    # Playbook de Sucesso — catálogo de padrões que funcionaram bem (contraparte
    # positiva do Harness Engineering), cadência de revisão de métricas DORA e
    # estado do contador de retrospectiva proativa (feature 012).
    - type: "template"
      name: "playbooks-success-catalog"
      file: "templates/project-root/docs/playbooks/success-catalog.yaml"
      description: "Catálogo machine-readable de padrões de sucesso por tag e bounded_context — copiado para docs/playbooks/success-catalog.yaml."

    - type: "template"
      name: "playbooks-readme"
      file: "templates/project-root/docs/playbooks/README.md"
      description: "Conceito, fluxo de uso e cadência de revisão de métricas DORA do Playbook de Sucesso — copiado para docs/playbooks/README.md."

    - type: "template"
      name: "playbooks-retro-cadence-state"
      file: "templates/project-root/docs/playbooks/retro-cadence-state.yaml"
      description: "Contador de features concluídas desde a última retrospectiva, usado para sinalização proativa — copiado para docs/playbooks/retro-cadence-state.yaml."

    # Scripts de automação referenciados diretamente pelo copilot-instructions.md
    # shipado (Grafo de Contexto Multi-Repo, Playbook de Sucesso/DORA) — sem
    # esta cópia, o agente do projeto consumidor seria instruído a rodar um
    # script que não existe no repositório.
    - type: "template"
      name: "generate-context-graph-script"
      file: "templates/project-root/scripts/generate-context-graph.sh"
      strategy: "copy"
      description: "Gera specs/<feature>/graph.yaml a partir dos manifestos de dependência do bounded context ativo — copiado para scripts/generate-context-graph.sh."

    - type: "template"
      name: "harvest-patterns-script"
      file: "templates/project-root/scripts/harvest-patterns.sh"
      strategy: "copy"
      description: "Varredura on-demand de padrões técnicos existentes (via LLM) para alimentar docs/reuse-catalog.yaml — copiado para scripts/harvest-patterns.sh."

    - type: "template"
      name: "process-metrics-report-script"
      file: "templates/project-root/scripts/process-metrics-report.sh"
      strategy: "copy"
      description: "Calcula os 4 indicadores DORA a partir das labels dora:* e verifica a cadência de retrospectiva proativa — copiado para scripts/process-metrics-report.sh."

    # Scripts determinísticos companheiros de skills (.github/skills/*/SKILL.md),
    # instalados em .specify/scripts/bash/ (mesmo local dos scripts nativos do
    # Spec Kit) — não sobrescrevem nada que `specify init` já cria, são adições
    # puras. Nota: distribuir o script sozinho tem efeito prático limitado
    # enquanto a skill que o invoca (também customizada pela Nimbus-Code) não
    # for distribuída — isso é escopo próprio de specs/003-vpn-skills-repo-
    # governance (catálogo remoto VPN-SKILLS), não deste preset.
    - type: "template"
      name: "check-epic-issue-consistency-script"
      file: "templates/project-root/.specify/scripts/bash/check-epic-issue-consistency.sh"
      strategy: "copy"
      description: "Confere/autocorrige o campo epic_issue de .specify/feature.json contra o token EPIC_ISSUE=<N> na descrição original — companheiro determinístico de .github/skills/speckit-specify/SKILL.md."

    - type: "template"
      name: "create-github-issue-hierarchy-script"
      file: "templates/project-root/.specify/scripts/bash/create-github-issue-hierarchy.sh"
      strategy: "copy"
      description: "Cria/vincula a hierarquia Epic → Feature → User Story → Task no GHE via sub-issues nativos — companheiro determinístico de .github/skills/speckit-taskstoissues/SKILL.md."

    - type: "template"
      name: "validate-interview-completeness-script"
      file: "templates/project-root/.specify/scripts/bash/validate-interview-completeness.sh"
      strategy: "copy"
      description: "Confere se specs/<feature>/interview.md não tem placeholders do template sem preencher — companheiro determinístico de .github/skills/speckit-interview/SKILL.md."

    - type: "template"
      name: "detect-retro-signal-script"
      file: "templates/project-root/.specify/scripts/bash/detect-retro-signal.sh"
      strategy: "copy"
      description: "Detecta via histórico git se spec.md/plan.md foram revisados depois de tasks.md já existir, ou se tasks novas foram adicionadas — sinal determinístico de retrabalho, usado por .github/skills/speckit-implement/SKILL.md para garantir o preenchimento de retro.md."

    - type: "template"
      name: "validate-retro-completeness-script"
      file: "templates/project-root/.specify/scripts/bash/validate-retro-completeness.sh"
      strategy: "copy"
      description: "Confere se specs/<feature>/retro.md não tem os textos de exemplo do retro-template.md sem substituir — companheiro determinístico de .github/skills/speckit-implement/SKILL.md."

tags:
  - "governance"
  - "security"
  - "devsecops"
  - "nimbus-code"
  - "module-graph"
  - "complexity-scale"
  - "feature-flags"
  - "slo"
  - "adr"
  - "labels"
  - "prioritization"
  - "autonomous-development"
  - "token-estimation"
  - "dora-metrics"
  - "finops"
  - "cost-tracking"
  - "budget-management"
  - "roi-metrics"
  - "pmo-portfolio"
  - "incident-management"
  - "d365"
  - "reuse-catalog"
  - "agent-session-governance"
  - "branch-hygiene"
  - "harness-engineering"
  - "success-playbooks"
  - "brownfield-context-graph"
