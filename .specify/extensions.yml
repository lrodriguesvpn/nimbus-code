installed:
- assess
- nimbus-code-backlog-sync
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: nimbus-code-backlog-sync
    command: speckit.nimbus-code-backlog-sync.sync
    enabled: true
    optional: true
    priority: 10
    prompt: Sincronizar esta spec com o backlog (JIRA/Azure DevOps) configurado?
    description: Cria ou atualiza a hierarquia EPIC/FEATURE/US correspondente no backlog
      externo
    condition: null
  after_tasks:
  - extension: nimbus-code-backlog-sync
    command: speckit.nimbus-code-backlog-sync.sync
    enabled: true
    optional: true
    priority: 10
    prompt: Sincronizar as tasks geradas com o backlog (JIRA/Azure DevOps) configurado?
    description: Cria ou atualiza as tarefas filhas correspondentes no backlog externo
    condition: null
