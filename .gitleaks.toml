# Configuração do gitleaks usada pelo workflow .github/workflows/secret-scan.yml
# (verificação complementar ao GitHub Secret Scanning — ver
# docs/security-baseline-ghe.md, seção 14).
#
# Estende as regras padrão do gitleaks. NÃO adicione allowlist genérica: cada
# falso positivo aceito precisa de Exception Record aprovado em
# .github/security-exceptions.json (controle "secret-scan") e de uma entrada
# específica (path + regex) abaixo, revisada por CODEOWNERS.
title = "nimbus-code gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Artefatos temporários locais da varredura (nunca versionados)"
paths = [
  '''^\.security-scan-scratch/''',
]
