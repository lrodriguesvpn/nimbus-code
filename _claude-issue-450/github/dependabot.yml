# Dependabot version updates (SCA — docs/security-baseline-ghe.md, seção 13).
#
# Dependabot alerts e Dependabot security updates NÃO são configurados por este
# arquivo: são habilitados em Settings → Code security (ou por política da
# organização). A varredura semanal verifica ambos (controles
# dependabot-alerts-enabled e dependabot-security-updates-enabled).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/platform-governance"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
