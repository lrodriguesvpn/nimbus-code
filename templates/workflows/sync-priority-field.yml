name: Sincronizar campo Priority com label priority:*

# Mantém o campo nativo "Priority" sincronizado com o label priority:* da
# issue/PR.
#
# Autenticação:
#   - Preferencial: GitHub App (`NIMBUS_APP_ID` + `NIMBUS_APP_PRIVATE_KEY`)
#   - Fallback temporário: `ADD_TO_PROJECT_PAT`

on:
  issues:
    types: [opened, labeled, unlabeled, reopened]
  pull_request:
    types: [opened, labeled, unlabeled, reopened]

jobs:
  sync-priority:
    name: Sincronizar Priority
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App installation token
        id: app-token
        if: ${{ env.NIMBUS_APP_CONFIGURED == 'true' }}
        env:
          # 'secrets' não é permitido em jobs.<job_id>.steps.if (ver
          # https://docs.github.com/actions/reference/workflows-and-actions/contexts#context-availability) —
          # avaliar aqui em env (permitido) e ler via env.* no if acima.
          NIMBUS_APP_CONFIGURED: ${{ secrets.NIMBUS_APP_ID != '' && secrets.NIMBUS_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NIMBUS_APP_ID }}
          private-key: ${{ secrets.NIMBUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          github-api-url: ${{ github.api_url }}
          permission-metadata: read
          permission-issues: write
          permission-pull-requests: write
          permission-repository-projects: write
          permission-organization-projects: write

      - name: Resolve auth token (App or explicit migration fallback)
        id: resolve-token
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
            echo "::notice::Autenticado via GitHub App (instalação de curta duração)."
          elif [ "${{ vars.NIMBUS_AUTH_MIGRATION_MODE }}" = "pat" ]; then
            echo "token=${{ secrets.ADD_TO_PROJECT_PAT }}" >> "$GITHUB_OUTPUT"
            echo "::warning::Modo de migração PAT explicitamente habilitado; owner, prazo, ambiente e auditoria são obrigatórios."
          else
            echo "::error::GitHub App não configurado; etapa cross-repo bloqueada. Defina NIMBUS_APP_ID/NIMBUS_APP_PRIVATE_KEY."
            exit 1
          fi

      - name: Sincronizar campo Priority nos projects do item
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.resolve-token.outputs.token }}
          script: |
            const content = context.payload.issue || context.payload.pull_request;
            const contentId = content.node_id;
            const priorityLabel = (content.labels || []).map(l => l.name).find(n => /^priority:/.test(n));

            const { node } = await github.graphql(`
              query($id: ID!) {
                node(id: $id) {
                  ... on Issue {
                    projectItems(first: 20, includeArchived: false) {
                      nodes {
                        id
                        project {
                          id
                          fields(first: 30) {
                            nodes {
                              ... on ProjectV2SingleSelectField { id name options { id name } }
                            }
                          }
                        }
                      }
                    }
                  }
                  ... on PullRequest {
                    projectItems(first: 20, includeArchived: false) {
                      nodes {
                        id
                        project {
                          id
                          fields(first: 30) {
                            nodes {
                              ... on ProjectV2SingleSelectField { id name options { id name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`, { id: contentId });

            const items = node?.projectItems?.nodes ?? [];
            if (items.length === 0) {
              core.info("Item não pertence a nenhum GitHub Project ainda — nada a sincronizar.");
              return;
            }

            for (const item of items) {
              const priorityField = (item.project.fields.nodes || []).find(f => f && f.name === "Priority");
              if (!priorityField) {
                core.info(`Project ${item.project.id} não tem campo "Priority" — pulando.`);
                continue;
              }

              if (priorityLabel) {
                const suffix = priorityLabel.replace(/^priority:/, "");
                const option = priorityField.options.find(o => o.name === suffix);
                if (!option) {
                  core.warning(`Label "${priorityLabel}" não corresponde a nenhuma opção do campo Priority (esperado: P0-blocker/P1-high/P2-medium/P3-low).`);
                  continue;
                }
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                      value: { singleSelectOptionId: $optionId }
                    }) { projectV2Item { id } }
                  }`, { projectId: item.project.id, itemId: item.id, fieldId: priorityField.id, optionId: option.id });
                core.info(`Priority = ${suffix} aplicado no project ${item.project.id}.`);
              } else {
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!) {
                    clearProjectV2ItemFieldValue(input: {
                      projectId: $projectId, itemId: $itemId, fieldId: $fieldId
                    }) { projectV2Item { id } }
                  }`, { projectId: item.project.id, itemId: item.id, fieldId: priorityField.id });
                core.info(`Priority limpo no project ${item.project.id} (sem label priority:* no item).`);
              }
            }
