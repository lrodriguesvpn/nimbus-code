name: Garantir GitHub Project do repositório

# Garante que este repositório sempre tenha o GitHub Project V2 padrão do
# bundle Nimbus-Code (views + campos "Horas Humanas" e "Oportunidade D365" — ver
# scripts/setup-github-project.sh). Roda semanalmente e sob demanda.
#
# Autenticação:
#   - Preferencial: GitHub App (`NIMBUS_APP_ID` + `NIMBUS_APP_PRIVATE_KEY`)
#   - Fallback temporário: `VPNDEV_PROJECT_TOKEN`
#
# O fallback existe para rollout gradual: o workflow continua funcionando hoje e
# passa automaticamente a usar o GitHub App assim que os secrets forem criados.

on:
  schedule:
    - cron: "0 13 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ensure-project:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App installation token
        id: app-token
        if: ${{ env.NIMBUS_APP_CONFIGURED == 'true' }}
        env:
          # 'secrets' não é permitido em jobs.<job_id>.steps.if (ver
          # https://docs.github.com/actions/reference/workflows-and-actions/contexts#context-availability) —
          # avaliar aqui em env (permitido) e ler via env.* no if acima.
          NIMBUS_APP_CONFIGURED: ${{ secrets.NIMBUS_APP_ID != '' && secrets.NIMBUS_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NIMBUS_APP_ID }}
          private-key: ${{ secrets.NIMBUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          github-api-url: ${{ github.api_url }}
          permission-metadata: read
          permission-repository-projects: write
          permission-organization-projects: write

      - name: Resolve auth token (App or explicit migration fallback)
        id: resolve-token
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
            echo "::notice::Autenticado via GitHub App (instalação de curta duração)."
          elif [ "${{ vars.NIMBUS_AUTH_MIGRATION_MODE }}" = "pat" ]; then
            echo "token=${{ secrets.VPNDEV_PROJECT_TOKEN }}" >> "$GITHUB_OUTPUT"
            echo "::warning::Modo de migração PAT explicitamente habilitado; owner, prazo, ambiente e auditoria são obrigatórios."
          else
            echo "::error::GitHub App não configurado; etapa cross-repo bloqueada. Defina NIMBUS_APP_ID/NIMBUS_APP_PRIVATE_KEY."
            exit 1
          fi

      - name: Verificar se o Project já existe
        id: check
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        run: |
          EXISTING=$(gh api graphql -f owner="${{ github.repository_owner }}" -f name="${{ github.event.repository.name }}" -f query='
            query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name) {
                projectsV2(first: 10) { nodes { title url } }
              }
            }' -q '.data.repository.projectsV2.nodes[] | select(.title | test(" — Nimbus Code Roadmap$")) | .url' 2>/dev/null | head -1 || true)
          if [ -n "$EXISTING" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clonar scripts do nimbus-code
        if: steps.check.outputs.found != 'true'
        env:
          AUTH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          CLONE_DIR: ${{ runner.temp }}/nimbus-code-standards
        run: |
          rm -rf "$CLONE_DIR"
          git clone --depth 1 "https://x-access-token:${AUTH_TOKEN}@venha-pra-nuvem.ghe.com/venha-pra-nuvem/nimbus-code.git" "$CLONE_DIR"

      - name: Criar GitHub Project (não existia)
        if: steps.check.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          CLONE_DIR: ${{ runner.temp }}/nimbus-code-standards
        run: |
          bash "$CLONE_DIR/scripts/setup-github-project.sh" \
            --repo-owner "${{ github.repository_owner }}" \
            --repo-name "${{ github.event.repository.name }}"

      - name: Confirmar (já existia)
        if: steps.check.outputs.found == 'true'
        run: |
          echo "✅ Project já existe: ${{ steps.check.outputs.url }} — nada a fazer."
