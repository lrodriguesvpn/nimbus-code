name: Verificar atualizações do Nimbus Code e do bundle Nimbus-Code

# Roda semanalmente e sob demanda. Compara a versão do Nimbus Code CLI e do bundle
# nimbus-code-project-bundle instaladas neste projeto com a versão mais recente
# publicada, e abre/atualiza uma issue com o diagnóstico e os comandos exatos
# para atualizar manualmente. NUNCA aplica a atualização sozinho — a versão só
# muda quando alguém rodar os comandos e abrir um PR revisado normalmente,
# conforme a política em
# https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/nimbus-code-spec-kit-template#versão-do-bundle-em-uso--política-de-atualização
#
# Em topologia multirepo, este workflow é o mecanismo oficial de alinhamento
# contínuo entre Repo Central e satélites. Satélite não deve aplicar mudanças
# estruturais por commit direto no main: sempre por PR revisado.
#
# O secret VPNDEV_STANDARDS_READ_TOKEN (PAT de qualquer membro da organização
# venha-pra-nuvem) é recomendado para verificar a versão mais recente do bundle.
# Se não estiver configurado, o workflow continua e compara apenas a versão do
# Nimbus Code CLI.

on:
  schedule:
    - cron: "0 13 * * 1" # toda segunda-feira, 10h BRT
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv e specify-cli
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git

      - name: Ler versões instaladas
        id: current
        run: |
          CURRENT_SPECKIT=$(python3 -c "import json;print(json.load(open('.specify/integration.json'))['version'])")
          CURRENT_BUNDLE=$(grep -A5 'Bundle .nimbus-code-project-bundle.' README.md | grep -oE '\`[0-9]+\.[0-9]+\.[0-9]+\`' | head -1 | tr -d '\`' || echo "desconhecida")
          echo "speckit=$CURRENT_SPECKIT" >> "$GITHUB_OUTPUT"
          echo "bundle=$CURRENT_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Verificar última versão disponível
        id: latest
        env:
          VPNDEV_TOKEN: ${{ secrets.VPNDEV_STANDARDS_READ_TOKEN }}
        run: |
          LATEST_SPECKIT=$(specify self check --json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('latest_version',''))" || true)
          LATEST_BUNDLE=""
          if [ -z "${VPNDEV_TOKEN}" ]; then
            echo "::warning::Secret VPNDEV_STANDARDS_READ_TOKEN não configurado; verificação de atualização do bundle será ignorada."
          else
            if ! LATEST_BUNDLE=$(curl -fsSL -H "Authorization: token ${VPNDEV_TOKEN}" \
              https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/nimbus-code-spec-kit-template/raw/main/bundles/catalog.json \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['bundles']['nimbus-code-project-bundle']['version'])" 2>/dev/null); then
              LATEST_BUNDLE=""
              echo "::warning::Não foi possível consultar o catalog.json do bundle; verificação de atualização do bundle será ignorada nesta execução."
            fi
          fi
          echo "speckit=$LATEST_SPECKIT" >> "$GITHUB_OUTPUT"
          echo "bundle=$LATEST_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Montar corpo da issue
        id: body
        run: |
          LATEST_BUNDLE_DISPLAY="${{ steps.latest.outputs.bundle }}"
          if [ -z "$LATEST_BUNDLE_DISPLAY" ]; then
            LATEST_BUNDLE_DISPLAY="_não verificado (secret ausente/indisponível)_"
          else
            LATEST_BUNDLE_DISPLAY="\`$LATEST_BUNDLE_DISPLAY\`"
          fi
          {
            echo "## Verificação semanal — Nimbus Code / Bundle Nimbus-Code"
            echo ""
            echo "| Item | Instalada | Disponível |"
            echo "| --- | --- | --- |"
            echo "| Nimbus Code CLI | \`${{ steps.current.outputs.speckit }}\` | \`${{ steps.latest.outputs.speckit }}\` |"
            echo "| Bundle \`nimbus-code-project-bundle\` | \`${{ steps.current.outputs.bundle }}\` | ${LATEST_BUNDLE_DISPLAY} |"
            echo ""
            echo "**Esta verificação não aplica nenhuma mudança.** Se a atualização for aprovada, rodar localmente:"
            echo ""
            echo '```bash'
            echo "specify self upgrade --tag v${{ steps.latest.outputs.speckit }}"
            echo "specify bundle update nimbus-code-project-bundle"
            echo '```'
            echo ""
            echo "Depois de aplicar e testar, abrir um PR normal com o diff e atualizar a tabela"
            echo "de versões na seção 'Nimbus Code — Padrões Nimbus-Code' do README (ver"
            echo "https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/nimbus-code-spec-kit-template/blob/main/templates/README-bundle-section.md)."
          } > /tmp/issue-body.md

      - name: Abrir ou atualizar issue de verificação
        if: steps.current.outputs.speckit != steps.latest.outputs.speckit || (steps.latest.outputs.bundle != '' && steps.current.outputs.bundle != steps.latest.outputs.bundle)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GH_HOST precisa ser derivado explicitamente em runners que operam
          # contra um GitHub Enterprise Server — sem isso, `gh` não reconhece
          # o host e falha com "none of the git remotes configured for this
          # repository point to a known GitHub host" (mesmo padrão já usado
          # em .github/workflows/normalize-issue-bodies.yml).
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          export GH_HOST="${GH_HOST#http://}"
          EXISTING=$(gh issue list --search "Verificação semanal — Nimbus Code / Bundle Nimbus-Code in:title" --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            # 3 níveis de fallback, do mais completo ao mais garantido — a
            # ordem anterior assumia que o label "dependencies" (só existe se
            # o Dependabot já rodou neste repo) sempre estava disponível como
            # último recurso, o que falhava em repos sem Dependabot habilitado
            # mesmo tendo a taxonomia Nimbus-Code completa instalada.
            # 1) taxonomia completa (Nimbus-Code + dependencies, se ambos existirem)
            # 2) só a taxonomia Nimbus-Code (scripts/setup-github-labels.sh já aplicado)
            # 3) sem label nenhum — sempre funciona, garante que a Issue nunca deixa de existir
            gh issue create --title "Verificação semanal — Nimbus Code / Bundle Nimbus-Code" --body-file /tmp/issue-body.md --label "dependencies,type:chore,status:needs-triage" \
              || gh issue create --title "Verificação semanal — Nimbus Code / Bundle Nimbus-Code" --body-file /tmp/issue-body.md --label "type:chore,status:needs-triage" \
              || gh issue create --title "Verificação semanal — Nimbus Code / Bundle Nimbus-Code" --body-file /tmp/issue-body.md
          fi
