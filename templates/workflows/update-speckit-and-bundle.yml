name: Verificar atualizações do Spec Kit e do bundle VPN Dev

# Roda semanalmente e sob demanda. Compara a versão do Spec Kit CLI e do bundle
# vpndev-project-bundle instaladas neste projeto com a versão mais recente
# publicada, e abre/atualiza uma issue com o diagnóstico e os comandos exatos
# para atualizar manualmente. NUNCA aplica a atualização sozinho — a versão só
# muda quando alguém rodar os comandos e abrir um PR revisado normalmente,
# conforme a política em
# https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/speckit-vpndev-standards#versão-do-bundle-em-uso--política-de-atualização
#
# Requer o secret VPNDEV_STANDARDS_READ_TOKEN: um PAT de qualquer membro da
# organização venha-pra-nuvem (basta ser membro — speckit-vpndev-standards é
# um repositório interno, não exige ser colaborador explícito dele). O
# GITHUB_TOKEN padrão do workflow só enxerga o próprio repositório onde roda,
# por isso a leitura do catalog.json em outro repo precisa desse token
# adicional configurado nos Secrets deste repositório consumidor.

on:
  schedule:
    - cron: "0 13 * * 1" # toda segunda-feira, 10h BRT
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv e specify-cli
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git

      - name: Ler versões instaladas
        id: current
        run: |
          CURRENT_SPECKIT=$(python3 -c "import json;print(json.load(open('.specify/integration.json'))['version'])")
          CURRENT_BUNDLE=$(grep -A5 'Bundle .vpndev-project-bundle.' README.md | grep -oE '\`[0-9]+\.[0-9]+\.[0-9]+\`' | head -1 | tr -d '\`' || echo "desconhecida")
          echo "speckit=$CURRENT_SPECKIT" >> "$GITHUB_OUTPUT"
          echo "bundle=$CURRENT_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Verificar última versão disponível
        id: latest
        env:
          VPNDEV_TOKEN: ${{ secrets.VPNDEV_STANDARDS_READ_TOKEN }}
        run: |
          LATEST_SPECKIT=$(specify self check --json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('latest_version',''))" || true)
          LATEST_BUNDLE=$(curl -fsSL -H "Authorization: token ${VPNDEV_TOKEN}" \
            https://raw.venha-pra-nuvem.ghe.com/venha-pra-nuvem/speckit-vpndev-standards/main/bundles/catalog.json \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['bundles']['vpndev-project-bundle']['version'])")
          echo "speckit=$LATEST_SPECKIT" >> "$GITHUB_OUTPUT"
          echo "bundle=$LATEST_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Montar corpo da issue
        id: body
        run: |
          {
            echo "## Verificação semanal — Spec Kit / Bundle VPN Dev"
            echo ""
            echo "| Item | Instalada | Disponível |"
            echo "| --- | --- | --- |"
            echo "| Spec Kit CLI | \`${{ steps.current.outputs.speckit }}\` | \`${{ steps.latest.outputs.speckit }}\` |"
            echo "| Bundle \`vpndev-project-bundle\` | \`${{ steps.current.outputs.bundle }}\` | \`${{ steps.latest.outputs.bundle }}\` |"
            echo ""
            echo "**Esta verificação não aplica nenhuma mudança.** Se a atualização for aprovada, rodar localmente:"
            echo ""
            echo '```bash'
            echo "specify self upgrade --tag v${{ steps.latest.outputs.speckit }}"
            echo "specify bundle update vpndev-project-bundle"
            echo '```'
            echo ""
            echo "Depois de aplicar e testar, abrir um PR normal com o diff e atualizar a tabela"
            echo "de versões na seção 'Spec Kit — Padrões VPN Dev' do README (ver"
            echo "https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/speckit-vpndev-standards/blob/main/templates/README-bundle-section.md)."
          } > /tmp/issue-body.md

      - name: Abrir ou atualizar issue de verificação
        if: steps.current.outputs.speckit != steps.latest.outputs.speckit || steps.current.outputs.bundle != steps.latest.outputs.bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --search "Verificação semanal — Spec Kit / Bundle VPN Dev in:title" --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            gh issue create --title "Verificação semanal — Spec Kit / Bundle VPN Dev" --body-file /tmp/issue-body.md --label "dependencies"
          fi
