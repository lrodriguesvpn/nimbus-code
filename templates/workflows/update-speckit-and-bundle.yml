name: Verificar atualizações do Spec Kit e do bundle VPN Dev

# Roda semanalmente e sob demanda. Verifica a versão mais recente do Spec Kit
# CLI e do bundle vpndev-project-bundle e, se houver diferença, abre um Pull
# Request com a atualização já aplicada localmente — mas NUNCA faz merge
# sozinho. A atualização só entra em `main` quando alguém aprovar e mergear
# esse PR manualmente, como qualquer outra mudança de dependência.

on:
  schedule:
    - cron: "0 13 * * 1" # toda segunda-feira, 10h BRT
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-propose-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv e specify-cli
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git

      - name: Ler versões instaladas
        id: current
        run: |
          CURRENT_SPECKIT=$(python3 -c "import json;print(json.load(open('.specify/integration.json'))['version'])")
          echo "speckit=$CURRENT_SPECKIT" >> "$GITHUB_OUTPUT"

      - name: Verificar última versão do Spec Kit e do bundle
        id: latest
        run: |
          LATEST_SPECKIT=$(specify self check --json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('latest_version','')) " || true)
          LATEST_BUNDLE=$(curl -fsSL https://raw.githubusercontent.com/venha-pra-nuvem/speckit-vpndev-standards/main/bundles/catalog.json \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['bundles']['vpndev-project-bundle']['version'])")
          echo "speckit=$LATEST_SPECKIT" >> "$GITHUB_OUTPUT"
          echo "bundle=$LATEST_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Aplicar upgrade do Spec Kit CLI (arquivos do projeto)
        if: steps.latest.outputs.speckit != '' && steps.latest.outputs.speckit != steps.current.outputs.speckit
        run: specify self upgrade --tag "v${{ steps.latest.outputs.speckit }}"

      - name: Atualizar bundle vpndev-project-bundle
        run: specify bundle update vpndev-project-bundle || true

      - name: Verificar se há mudanças
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir Pull Request de atualização
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: atualizar Spec Kit/bundle VPN Dev (speckit ${{ steps.latest.outputs.speckit }}, bundle ${{ steps.latest.outputs.bundle }})"
          title: "chore: atualizar Spec Kit para ${{ steps.latest.outputs.speckit }} e bundle VPN Dev para ${{ steps.latest.outputs.bundle }}"
          body: |
            Atualização automática detectada pela verificação semanal.

            | Item | Antes | Depois |
            | --- | --- | --- |
            | Spec Kit CLI | `${{ steps.current.outputs.speckit }}` | `${{ steps.latest.outputs.speckit }}` |
            | Bundle `vpndev-project-bundle` | ver README atual | `${{ steps.latest.outputs.bundle }}` |

            **Este PR não é aplicado automaticamente.** Revise o diff, atualize a
            tabela de versões na seção "Spec Kit — Padrões VPN Dev" do README
            (ver [modelo](https://github.com/venha-pra-nuvem/speckit-vpndev-standards/blob/main/templates/README-bundle-section.md))
            e só faça merge após aprovação formal, conforme a
            [política de versionamento](https://github.com/venha-pra-nuvem/speckit-vpndev-standards#versão-do-bundle-em-uso--política-de-atualização).
          branch: chore/update-speckit-vpndev-bundle
          labels: dependencies
