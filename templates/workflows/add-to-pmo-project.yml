name: Adicionar issues/PRs ao Portfólio PMO

# Adiciona automaticamente toda issue/PR aberta neste repositório ao GitHub
# Project de PORTFÓLIO do PMO (nível de organização), criado uma única vez
# via scripts/setup-pmo-org-project.sh. Isso é o que dá ao PMO uma visão
# consolidada de backlog/prioridade de TODOS os repositórios num board só —
# sem precisar abrir cada repositório individualmente.
#
# ⚠️ OPT-IN: diferente de outros workflows deste bundle, este NÃO é instalado
# automaticamente pelo bootstrap.sh, porque depende de uma URL de project que
# só existe depois que o PMO/organização rodar setup-pmo-org-project.sh uma
# vez. Instale manualmente quando o project de portfólio já existir:
#
#   cp templates/workflows/add-to-pmo-project.yml <repo>/.github/workflows/
#
# Depois de copiar, edite o valor de "project-url" abaixo para a URL real do
# project de portfólio (ex.: https://venha-pra-nuvem.ghe.com/orgs/venha-pra-nuvem/projects/N).
#
# Requer o secret ADD_TO_PROJECT_PAT: um Personal Access Token (classic,
# escopo `project`, ou fine-grained com permissão de escrita em "Projects")
# de um usuário com acesso ao project de portfólio. O GITHUB_TOKEN padrão do
# workflow NÃO tem escopo `project`, por isso este secret é obrigatório.
#
# Nota sobre campos customizados: "Horas Humanas" e "Oportunidade D365"
# preenchidos no project deste repositório NÃO aparecem automaticamente
# somados no project de portfólio (GitHub Projects V2 trata valores de campo
# por-projeto, mesmo para o mesmo item). Para custo/oportunidade consolidados,
# use scripts/pmo-cost-rollup.sh — este workflow só resolve a visão de
# backlog/prioridade, não de custo.
#
# Ação usada: https://github.com/actions/add-to-project (mantida pelo GitHub)

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

jobs:
  add-to-pmo-project:
    name: Adicionar ao Portfólio PMO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          # Substitua pela URL real do project de portfólio do PMO (ver
          # scripts/setup-pmo-org-project.sh)
          project-url: https://venha-pra-nuvem.ghe.com/orgs/venha-pra-nuvem/projects/SUBSTITUA_PELO_NUMERO
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
