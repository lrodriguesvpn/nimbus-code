# Catálogo de Reuso — Nimbus-Code / Nimbus Code
#
# Índice curto e machine-readable de padrões, decisões técnicas e módulos já
# implementados em features anteriores deste projeto, para que um agente (ou
# humano) consulte ANTES de re-derivar uma solução do zero — reduzindo o custo
# de tokens e a chance de duas features resolverem o mesmo problema de formas
# incompatíveis.
#
# Ver metodologia completa em:
# docs/ai-code-quality-and-observability.md, seção 9 ("Catálogo de Reuso").
#
# Convenção de uso:
# - Ao INICIAR uma feature nova, o agente busca aqui por `tags` relacionadas
#   ao problema antes de desenhar a solução — se encontrar uma entrada com
#   match, referenciar por PONTEIRO (link ao spec/plan/ADR original) no novo
#   `plan.md`, nunca copiar/reexplicar o conteúdo integralmente.
# - Ao FECHAR uma feature que introduziu um padrão reaproveitável (não
#   específico só daquela feature), adicionar uma entrada aqui como parte do
#   checklist de fechamento do `tasks.md`.
# - Preenchimento inicial é manual/curatorial — não há automação de
#   preenchimento nesta versão (ver "Fora de Escopo" em
#   specs/001-catalogo-conteudo-reutilizavel/spec.md).
#
# Schema de cada entrada:
#   tag:              slug curto e estável (kebab-case) — usado para busca
#   bounded_context:   módulo/serviço onde o padrão vive
#   description:       1-2 frases — o que é e quando reaproveitar
#   source:            caminho para o spec.md/plan.md original (specs/<feature>/)
#   adr:               caminho para o ADR relacionado (opcional)
#   reuse_count:       nº de vezes que outra feature já referenciou esta entrada
#                       (incremente manualmente ao reaproveitar — sinal de ROI)
#   example:           (opcional) trecho estrutural curto — assinatura de
#                       método/interface, nome de arquivo:linha — nunca corpo
#                       de método/string literal. Preenchido por
#                       scripts/harvest-patterns.sh (specs/014-brownfield-
#                       multirepo-context-awareness/); harvest também grava o
#                       repositório de origem no campo `source` (formato
#                       "owner/repo:arquivo:linha") em vez do spec.md quando a
#                       entrada vem de um harvest em vez de uma feature.

version: 1
entries:
  - tag: "hybrid-dev-templates"
    bounded_context: "dev-platform/spec-kit"
    description: >
      Padrão para geração de spec/plan/tasks com colaboração híbrida agente+humano,
      incluindo contrato de task executável no GHE, referência de custo (SPEC KIT COST),
      padrão de design WEB via Impeccable e padrão de toggle via OpenFeature.
    source: "specs/005-hybrid-agent-human-dev/plan.md"
    adr: "docs/adr/0007-hybrid-dev-templates-governance.md"
    reuse_count: 0

  - tag: "ghe-sub-issues-hierarchy"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão de criação de hierarquia Epic → Feature → User Story → Task no GHE
      via sub-issues nativos (GraphQL API: addSubIssue, updateIssueIssueType,
      Issue.subIssuesSummary/parent). Implementado em
      .specify/scripts/bash/create-github-issue-hierarchy.sh (bash + gh CLI,
      subcomandos ensure-feature/ensure-user-story/link-task/set-type),
      invocado por .github/skills/speckit-taskstoissues/SKILL.md. Inclui:
      detecção de Issue Types da org (mesma query usada em
      scripts/setup-github-project.sh), fallback gracioso via labels
      (type:epic/feature/user-story/task) para orgs sem suporte nativo, criação
      idempotente de views hierárquicas no Project V2, e alerta/abort de limite
      de sub-issues por parent (aviso >=90, abort >=100). Reaproveitar sempre
      que uma feature precisar criar rastreabilidade hierárquica de issues no GHE.
    source: "specs/005-epic-feature-us-ghe-hierarchy/plan.md"
    adr: ""
    reuse_count: 0

  - tag: "speckit-deduplication-by-id"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão de deduplicação de issues geradas por comandos Spec Kit usando um
      identificador estruturado como chave — não o título, que pode mudar. Para
      Tasks, o ID é o T00N no título (dedup via GitHub MCP list_issues em
      /speckit-taskstoissues). Para Feature/User Story (sem um ID numérico
      natural), o identificador é um marcador oculto no corpo da issue, ex.:
      `<!-- speckit-feature-id: <feature-slug> -->` /
      `<!-- speckit-us-id: <feature-slug>#US<N> -->`, pré-filtrado via
      `gh issue list --search` e confirmado por match exato via jq — o mesmo
      esquema de marcador já usado por outra automação deste repositório
      (`security-baseline-finding-id`, ver
      specs/007-controle-seguranca-ghe-projetos-plataforma/quickstart.md).
      Implementado em .specify/scripts/bash/create-github-issue-hierarchy.sh.
      Antes de criar cada issue, verifica se já existe uma correspondente;
      antes de vincular sub-issue, verifica se o vínculo já existe (consulta o
      `parent` atual via GraphQL). Reaproveitar sempre que um comando Spec Kit
      precisar ser re-executável sem criar duplicatas no GHE.
    source: "specs/005-epic-feature-us-ghe-hierarchy/plan.md"
    adr: ""
    reuse_count: 0

  - tag: "skill-mid-flow-instruction-reliability-gate"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão para reduzir a fragilidade de instruções em prosa no meio de um
      SKILL.md longo (ex.: "se você achar X, extraia e persista Y") que um
      agente LLM pode pular sem que ninguém perceba, já que SKILL.md não é
      código determinístico. Solução em 3 camadas: (1) hardening do script
      bash correspondente para também extrair o dado do texto livre, não só
      via flag explícita — ajuda quem chama via CLI/hook; (2) um script bash
      pequeno e determinístico (regex + jq, com fallback sem jq) que recebe o
      texto original e o arquivo de estado, compara e se autocorrige — não
      depende de interpretação; (3) uma seção "Mandatory Post-Execution
      Validation" no SKILL.md, marcada como incondicional (independente de
      hooks/extensions.yml), que instrui o agente a sempre rodar o script (2)
      como último passo, substituindo "lembre-se no meio do fluxo" por "sempre
      execute isto no final". Implementado para o campo `epic_issue` em
      .specify/scripts/bash/create-new-feature.sh +
      .specify/scripts/bash/check-epic-issue-consistency.sh +
      .github/skills/speckit-specify/SKILL.md. Reaproveitar para qualquer
      outro campo de feature.json extraído de texto livre por um SKILL.md
      (ex.: bounded_contexts na feature 006, ainda não migrado para este
      padrão).
    source: "specs/005-epic-feature-us-ghe-hierarchy/plan.md"
    adr: ""
    reuse_count: 0
  - tag: "subtree-repo-extraction"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrao para migrar uma implementacao ja existente dentro de uma subpasta
      deste template (ex.: codigo desenvolvido numa branch orfa nunca proposta
      como PR) para um repositorio proprio, preservando historico via
      `git subtree split -P <subpasta> -b <branch>` + push para `main` do repo
      novo (fallback: `git filter-repo --path <subpasta> --path-rename
      <subpasta>/:` se disponivel no ambiente). Inclui: criacao do repo via
      `gh repo create`, protecao de branch `main` (PR obrigatorio + 1 revisao),
      aplicacao de `scripts/setup-github-labels.sh` e
      `scripts/setup-github-project.sh` contra o repo novo, registro do bounded
      context em `docs/bounded-contexts.yaml`, e atualizacao por PONTEIRO
      (sem duplicar conteudo) do `plan.md`/`tasks.md` da feature de origem.
      Reaproveitar sempre que uma feature implementada dentro deste template
      precisar "sair" para um repositorio dedicado (ADL tipo "Central
      Repository vs. Distributed Skills").
    source: "specs/003-vpn-skills-repo-governance/plan.md"
    adr: ""
    reuse_count: 0

  - tag: "multirepo-bounded-context-routing"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão de suporte MultiRepo no Spec Kit: 1 Repo Central de Specs +
      N Repos por stack/microsserviço. Inclui: (1) registro de repos em
      docs/bounded-contexts.yaml (slug, repository, stack, team, autonomous_ok);
      (2) flag --bounded-contexts em /speckit-specify para persistir repos em
      feature.json; (3) anotação inline [USN — slug] em tasks.md para roteamento
      de Tasks para o repo do serviço correto; (4) linkProjectV2ToRepository no
      setup-github-project.sh para board cross-repo no Project V2; (5) fallback
      gracioso para yq ausente (python3 → grep/awk) e para API indisponível
      (GHE Server < 3.8). Reaproveitar sempre que uma feature precisar de Tasks
      em repos de serviço distintos mantendo Epics/Features/USs no repo central.
    source: "specs/006-multirepo-support/plan.md"
    adr: ""

  - tag: "bootstrap-github-app-auth"
    bounded_context: "repository-provisioning"
    description: >
      Padrao para migrar automacoes cross-repo/org do bootstrap para
      `actions/create-github-app-token@v1`, com fallback explicito para o
      secret legado por workflow durante o rollout. Inclui snippet reutilizavel
      em `docs/github-app-auth-snippet.md`, permissoes explicitas por workflow,
      atualizacao coordenada de `bootstrap.sh`, workflows instalados no repo e
      templates em `templates/workflows/`. Reaproveitar sempre que outra
      automacao do bundle precisar trocar PAT classico por GitHub App sem
      interromper repositorios ja provisionados.
    source: "specs/008-bootstrap-governance-hardening/plan.md"
    adr: "docs/adr/0009-github-app-para-automacoes-bootstrap-cross-repo.md"
    reuse_count: 0

  - tag: "standard-devcontainer"
    bounded_context: "dev-platform/codespaces"
    description: >
      Devcontainer de referência Nimbus-Code para GitHub Codespaces
      (imagem `mcr.microsoft.com/devcontainers/base:ubuntu` + features
      Python/Node/GitHub CLI + `postCreateCommand` idempotente), acompanhado
      de mapeamento de aceleração de CI/CD via Codespaces prebuilds
      (`docs/ci-cd-acceleration-map.md`), política de governança de
      custo/ociosidade baseada na configuração nativa do GitHub Codespaces
      (`docs/codespaces-adoption-guide.md`) e modelo de segurança para
      sessões remotas de agentes de IA com paridade ao escopo de segredos já
      exigido para o CI/CD do repositório. Reaproveitar sempre que um
      repositório Nimbus-Code precisar padronizar seu ambiente de
      desenvolvimento via Codespaces — copiar `.devcontainer/devcontainer.json`
      e `scripts/setup-dev-environment.sh` e ajustar para a stack local antes
      de divulgar ao time.
    source: "specs/009-codespaces-dev-planning/plan.md"
    adr: ""
    reuse_count: 0

  - tag: "harness-engineering-pattern"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão de catálogo de erros curatorial (YAML estático versionado no Git)
      para memória organizacional de falhas. Inclui: (1) harness-catalog.yaml com
      schema id/date/complexity/bounded_context/error_pattern/root_cause/impact/
      fix_applied/prevention/tags/source_pr/similar_contexts; (2) consulta obrigatória
      pré-plan declarada no copilot-instructions.md e no plan-template.md (seção
      "Harness Gate"); (3) labels harness:pending, harness:cataloged, harness:blocking
      para rastreabilidade no GitHub; (4) script harness-search.sh (grep/yq) para
      busca rápida por tag/bounded_context; (5) incident-template.md para post-mortem
      estruturado com 5-Whys. Reaproveitar sempre que um projeto precisar de memória
      organizacional de falhas compartilhada entre times e agentes.
    source: "specs/011-harness-engineering/plan.md"
    adr: ""
  - tag: "org-wide-security-compliance-scan"
    bounded_context: "platform-security/ghe-governance"
    description: >
      Padrão de varredura org-wide de conformidade no GHE usando GitHub App
      somente-leitura, descoberta automática de repositórios via API,
      deduplicação de findings por marcador HTML em issues, avaliação de
      governança do Project V2 consolidado e relatório mensal consolidado
      publicado como issue com snapshots por execução. Reaproveitar sempre que
      outra feature precisar auditar postura de segurança/governança em múltiplos
      repositórios sem criar infraestrutura adicional.
    source: "specs/007-controle-seguranca-ghe-projetos-plataforma/plan.md"
    adr: "docs/adr/0008-github-app-para-varredura-de-seguranca-org-wide.md"
    reuse_count: 0

  - tag: "single-mandatory-test-gate"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão de gate único de testes obrigatório em PR: um script central
      (scripts/run-tests.sh) descobre e executa todos os formatos de teste já
      aceitos pelo bundle (Bats-core e scripts .test.sh simples), agregando um
      resultado consolidado e identificando o primeiro segmento que falhar. O
      workflow de CI (.github/workflows/test-suite.yml) apenas invoca esse
      mesmo script dentro do runner — garantindo paridade local/CI por
      construção, não por manutenção paralela de duas listas de comandos.
      Inclui matriz de decisão de formato (docs/testing-policy.md) e
      governança de exceções (Exception Record no ADL do plan.md) para evitar
      nova fragmentação de suíte. Rollout faseado recomendado: modo relatório
      (não bloqueante) por um período de observação, promovido a "required
      status check" só após decisão humana explícita. Reaproveitar sempre que
      um repositório precisar consolidar testes fragmentados em um gate único
      sem introduzir framework/infraestrutura nova.
    source: "specs/013-governanca-testes-pr/plan.md"
    adr: ""
    reuse_count: 0

  - tag: "brownfield-multirepo-context-graph"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão de automação para governança de contexto em projetos brownfield
      multirepo: (1) scripts/generate-context-graph.sh lê
      docs/bounded-contexts.yaml, analisa manifestos de dependência dos repos
      de um bounded context (local ou via `gh api` como fallback) e gera
      graph.yaml/graph.md com nós (`cross_repo: true|false`) e arestas —
      invocado automaticamente por /speckit-specify antes do plan, com aviso
      não-bloqueante quando o contexto não tem repos mapeados; (2)
      scripts/harvest-patterns.sh varre metadados estruturais (nunca corpo de
      método/string literal) de um repo via allowlist e chama um endpoint LLM
      configurável (HARVEST_API_URL/HARVEST_API_TOKEN) para propor entradas
      de docs/reuse-catalog.yaml, com deduplicação por tag — exclusivamente
      on-demand, nunca em CI. Ambos idempotentes e cobertos por
      tests/scripts/*.bats. Reaproveitar sempre que um projeto precisar
      manter o agente ciente de padrões/dependências já existentes em repos
      brownfield sem depender de o Dev colar exemplos manualmente no prompt.
    source: "specs/014-brownfield-multirepo-context-awareness/plan.md"
    adr: ""
    reuse_count: 0
