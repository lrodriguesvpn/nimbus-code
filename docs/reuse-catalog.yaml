# Catálogo de Reuso — Nimbus-Code / Nimbus Code
#
# Índice curto e machine-readable de padrões, decisões técnicas e módulos já
# implementados em features anteriores deste projeto, para que um agente (ou
# humano) consulte ANTES de re-derivar uma solução do zero — reduzindo o custo
# de tokens e a chance de duas features resolverem o mesmo problema de formas
# incompatíveis.
#
# Ver metodologia completa em:
# docs/ai-code-quality-and-observability.md, seção 9 ("Catálogo de Reuso").
#
# Convenção de uso:
# - Ao INICIAR uma feature nova, o agente busca aqui por `tags` relacionadas
#   ao problema antes de desenhar a solução — se encontrar uma entrada com
#   match, referenciar por PONTEIRO (link ao spec/plan/ADR original) no novo
#   `plan.md`, nunca copiar/reexplicar o conteúdo integralmente.
# - Ao FECHAR uma feature que introduziu um padrão reaproveitável (não
#   específico só daquela feature), adicionar uma entrada aqui como parte do
#   checklist de fechamento do `tasks.md`.
# - Preenchimento inicial é manual/curatorial — não há automação de
#   preenchimento nesta versão (ver "Fora de Escopo" em
#   specs/001-catalogo-conteudo-reutilizavel/spec.md).
#
# Schema de cada entrada:
#   tag:              slug curto e estável (kebab-case) — usado para busca
#   bounded_context:   módulo/serviço onde o padrão vive
#   description:       1-2 frases — o que é e quando reaproveitar
#   source:            caminho para o spec.md/plan.md original (specs/<feature>/)
#   adr:               caminho para o ADR relacionado (opcional)
#   reuse_count:       nº de vezes que outra feature já referenciou esta entrada
#                       (incremente manualmente ao reaproveitar — sinal de ROI)

version: 1
entries:
  - tag: "ghe-sub-issues-hierarchy"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão de criação de hierarquia Epic → Feature → User Story → Task no GHE
      via sub-issues nativos (GraphQL API). Inclui: detecção de Issue Types da org,
      fallback gracioso via labels (type:epic/feature/user-story/task) para orgs
      sem suporte nativo, criação idempotente de views hierárquicas no Project V2,
      e alerta de limite de 100 sub-issues por parent. Reaproveitar sempre que
      uma feature precisar criar rastreabilidade hierárquica de issues no GHE.
    source: "specs/005-epic-feature-us-ghe-hierarchy/plan.md"
    adr: ""
    reuse_count: 0

  - tag: "speckit-deduplication-by-id"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão de deduplicação de issues geradas pelo /speckit-taskstoissues usando
      o ID estruturado da tarefa (T00N) como chave — não o título, que pode mudar.
      Antes de criar cada issue, verifica se já existe no repo uma issue com
      identificador T00N; antes de vincular sub-issue, verifica se o vínculo já
      existe. Reaproveitar sempre que um comando Spec Kit precisar ser re-executável
      sem criar duplicatas no GHE.
    source: "specs/005-epic-feature-us-ghe-hierarchy/plan.md"
    adr: ""
    reuse_count: 0


  - tag: "multirepo-bounded-context-routing"
    bounded_context: "spec-kit-workflow"
    description: >
      Padrão de suporte MultiRepo no Spec Kit: 1 Repo Central de Specs +
      N Repos por stack/microsserviço. Inclui: (1) registro de repos em
      docs/bounded-contexts.yaml (slug, repository, stack, team, autonomous_ok);
      (2) flag --bounded-contexts em /speckit-specify para persistir repos em
      feature.json; (3) anotação inline [USN — slug] em tasks.md para roteamento
      de Tasks para o repo do serviço correto; (4) linkProjectV2ToRepository no
      setup-github-project.sh para board cross-repo no Project V2; (5) fallback
      gracioso para yq ausente (python3 → grep/awk) e para API indisponível
      (GHE Server < 3.8). Reaproveitar sempre que uma feature precisar de Tasks
      em repos de serviço distintos mantendo Epics/Features/USs no repo central.
    source: "specs/006-multirepo-support/plan.md"
    adr: ""
    reuse_count: 0
