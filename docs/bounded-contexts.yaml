# Bounded Contexts — nimbus-code-spec-kit-template
#
# Lista oficial dos bounded contexts deste projeto (o próprio template Nimbus Code).
# Para projetos que usam este template como base, este arquivo serve de exemplo —
# substitua as entradas pelos seus microsserviços reais.
#
# Estratégia MultiRepo:
#   Este Repo Central hospeda specs/, docs/ e o board (GitHub Project V2).
#   Cada contexto tem seu próprio repo de código onde o Copilot Agent abre PRs.
#
# Como registrar um novo microsserviço:
#   1. Adicione uma entrada abaixo com slug, description, repository, stack,
#      team e autonomous_ok.
#   2. Abra PR com a nova entrada — revisão obrigatória antes de merge.
#   3. Rode setup-github-project.sh para vincular o novo repo ao Project V2.
#   4. Rode setup-github-labels.sh no novo repo para criar a taxonomia de labels.
#
# Convenção de slugs: kebab-case, substantivo no singular.
# Convenção de nomes de repos:
#   svc-<slug>      → microsserviços de backend
#   frontend-<slug> → aplicações frontend web
#   mobile-<slug>   → aplicações mobile
#   lib-<slug>      → bibliotecas compartilhadas
#   infra           → infraestrutura (Terraform/IaC)

version: 1
contexts:
  - slug: "spec-kit-workflow"
    description: "Templates, scripts e docs do Nimbus Code Spec Kit — fluxo specify/plan/tasks/implement."
    repository: "venha-pra-nuvem/nimbus-code-spec-kit-template"
    stack: "Bash/YAML/Markdown"
    team: "platform"
    autonomous_ok: true

