# Bounded Contexts — nimbus-code-spec-kit-template
#
# Lista oficial dos bounded contexts deste projeto (o próprio template Nimbus Code).
# Para projetos que usam este template como base, este arquivo serve de exemplo —
# substitua as entradas pelos seus microsserviços reais.
#
# Estratégia MultiRepo:
#   Este Repo Central hospeda specs/, docs/ e o board (GitHub Project V2).
#   Cada contexto tem seu próprio repo de código onde o Copilot Agent abre PRs.
#   Repos satélite não devem manter specs/ locais: toda spec continua no Repo
#   Central do produto, e o satélite recebe apenas código/tasks/PRs roteados.
#   Para greenfield multirepo, use FRONT/BACK/DESIGN/DATA/JOBS como baseline
#   recomendada de domínios satélite e adapte apenas com justificativa + owner.
#
# Como registrar um novo microsserviço:
#   1. Adicione uma entrada abaixo com slug, description, repository, stack,
#      team e autonomous_ok.
#   2. Abra PR com a nova entrada — revisão obrigatória antes de merge.
#   3. Rode setup-github-project.sh para vincular o novo repo ao Project V2.
#   4. Rode setup-github-labels.sh no novo repo para criar a taxonomia de labels.
#
# Convenção de slugs: kebab-case, substantivo no singular.
# Convenção de nomes de repos:
#   svc-<slug>      → microsserviços de backend
#   frontend-<slug> → aplicações frontend web
#   mobile-<slug>   → aplicações mobile
#   lib-<slug>      → bibliotecas compartilhadas
#   infra           → infraestrutura (Terraform/IaC)

version: 1
contexts:
  - slug: "spec-kit-workflow"
    description: "Templates, scripts e docs do Nimbus Code Spec Kit — fluxo specify/plan/tasks/implement."
    repository: "venha-pra-nuvem/nimbus-code-spec-kit-template"
    stack: "Bash/YAML/Markdown"
    team: "platform"
    autonomous_ok: true

  - slug: "vpn-skills"
    description: >
      Repositório central de governança e ciclo de vida de skills VPN reutilizáveis
      (CLI, API REST, dashboard de descoberta, versionamento semântico, compliance).
      Extraído de specs/003-vpn-skills-repo-governance/ (ADL-001) para repositório
      próprio em 2026-08-20 — ver tasks.md/plan.md dessa feature para o histórico.
    repository: "venha-pra-nuvem/vpn-skills"
    stack: "Go + TypeScript + React"
    team: "a definir"
    autonomous_ok: false  # ainda sem primeira revisão humana pós-migração

  - slug: "nimbuscode-harvest-gateway"
    description: >
      Gateway multicloud compartilhado que traduz o contrato genérico de
      scripts/harvest-patterns.sh (repo/stack/prompt/metadata → padrões
      arquiteturais) em chamadas de inferência reais a Azure AI Foundry,
      Google (Vertex AI/Gemini) ou AWS Bedrock, com modelo selecionável dentro
      de cada provedor. Endpoint único usado por todos os repositórios
      satélite via HARVEST_API_URL/HARVEST_API_TOKEN de nível de organização —
      ver specs/022-nimbuscode-harvest-gateway/.
    repository: "venha-pra-nuvem/nimbus-harvest-gateway"
    stack: "Azure Functions (Python)"
    team: "platform"
    autonomous_ok: false  # infraestrutura nova, sem primeira revisão humana ainda

