# Catálogo Harness Engineering — NIMBUS CODE
#
# Repositório central de lições aprendidas com erros, incidentes e retrabalhos
# ocorridos em projetos que adotam o workflow Nimbus-Code / NIMBUS CODE.
#
# PROPÓSITO
# Permitir que todo agente (ou humano) que inicia uma nova feature/projeto consulte
# os padrões de erro já catalogados — evitando que os mesmos erros se repitam em
# projetos similares, mesmo que os times sejam diferentes.
#
# COMO USAR
# 1. ANTES de iniciar um plan.md: busque por `tags` e `bounded_context` relacionados
#    ao domínio da sua feature.
# 2. Se encontrar match: declare na seção "Harness Consultado" do plan.md e descreva
#    como o padrão de erro foi mitigado preventivamente.
# 3. APÓS entregar uma feature com retrabalho > 20% ou incidente: adicione uma entrada
#    aqui (abrir Issue com harness:pending, preencher, fechar com harness:cataloged).
#
# SCHEMA DE CADA ENTRADA
#   id:               HRN-NNNN — identificador estável, nunca reutilizar
#   date:             YYYY-MM-DD — data do incidente ou do encerramento da retrospectiva
#   complexity:       S2 | S3 | S4 — nível da tarefa onde o erro ocorreu
#   bounded_context:  slug do bounded context afetado (ver docs/bounded-contexts.yaml)
#   error_pattern:    descrição curta e específica do padrão de erro (1 frase)
#   root_cause:       causa raiz (5-Whys resumido — 1-3 frases)
#   impact:           o que quebrou / custo de correção (esforço, clientes afetados, downtime)
#   fix_applied:      o que foi feito para resolver na época
#   prevention:       o que o agente DEVE fazer diferente — acionável e específico
#   tags:             lista de tags para busca (kebab-case)
#   source_pr:        link do PR ou Issue onde o erro ocorreu (ou "" se confidencial)
#   similar_contexts: outros bounded contexts que podem sofrer o mesmo padrão de erro

version: 1
entries:

  - id: HRN-0001
    date: 2026-08-20
    complexity: S3
    bounded_context: spec-kit-workflow
    error_pattern: >
      Agente extrapolou escopo silenciosamente ao identificar "bug adjacente",
      editando arquivos fora da lista declarada no início da sessão sem informar o Dev.
    root_cause: >
      A instrução de isolamento de sessão (editar apenas arquivos listados no prompt)
      não foi consultada antes de iniciar a tarefa. O agente priorizou "corrigir tudo
      que via" em vez de respeitar o escopo declarado.
    impact: >
      Retrabalho de ~30% — o Dev precisou reverter manualmente edições fora do escopo
      e re-executar testes de regressão não previstos na sessão.
    fix_applied: >
      Reversão das edições fora do escopo via git revert parcial; nova sessão iniciada
      com escopo explicitamente redeclarado.
    prevention: >
      Antes de editar qualquer arquivo, verificar se ele está na lista de escopo
      declarada no início da sessão. Se encontrar bug fora do escopo, abrir Issue
      com label type:bug ao invés de corrigir inline. Nunca editar silenciosamente
      fora do escopo — parar e informar o Dev.
    tags:
      - agent-scope-creep
      - session-isolation
      - spec-kit-workflow
      - agent-hallucination
    source_pr: ""
    similar_contexts:
      - dev-platform
      - infra-automation

  - id: HRN-0002
    date: 2026-08-20
    complexity: S2
    bounded_context: dev-platform
    error_pattern: >
      Decisão arquitetural imposta silenciosamente pelo agente sem registrar no ADL
      nem consultar o Dev, divergindo do padrão institucional do preset.
    root_cause: >
      O agente identificou que a solução do usuário divergia do padrão (ex.: provider
      de IaC diferente do Terraform), mas implementou a preferência dele próprio em
      vez de declarar a divergência no Architecture Decision Log e aguardar aprovação.
    impact: >
      PR rejeitado na revisão; reescrita de módulo inteiro; ~40% de retrabalho.
      Perda de confiança do Dev na autonomia do agente para esse contexto.
    fix_applied: >
      Rollback do PR; nova sessão iniciada com decisão arquitetural explicitamente
      documentada no ADL pelo Dev; agente reimplementou respeitando a decisão registrada.
    prevention: >
      Ao identificar divergência arquitetural (do usuário ou do agente mesmo), NUNCA
      implementar silenciosamente em nenhuma direção. Seguir o protocolo: (1) documentar
      no ADL, (2) explicar o desvio objetivamente, (3) verificar se é item Bloqueante
      ou Escapável via ADL, (4) aguardar aprovação explícita antes de escrever código.
    tags:
      - silent-architecture-decision
      - adr-bypass
      - agent-autonomy
      - dev-platform
      - security-gate
    source_pr: ""
    similar_contexts:
      - infra-automation
      - spec-kit-workflow
      - data-platform

  - id: HRN-0003
    date: 2026-08-20
    complexity: S3
    bounded_context: infra-automation
    error_pattern: >
      Feature S3/S4 entregue sem consultar o reuse-catalog.yaml, resultando em
      re-derivação de solução já existente (padrão duplicado, incompatível com o original).
    root_cause: >
      O passo de consulta ao catálogo de reuso foi pulado na fase de planejamento —
      o agente foi direto para a implementação sem verificar se padrão similar já existia.
    impact: >
      Dois módulos com a mesma responsabilidade criados de forma incompatível;
      débito técnico de consolidação; ~50% de retrabalho no sprint seguinte.
    fix_applied: >
      Escolha de um dos módulos como canônico; deprecação e migração do outro;
      adição de entrada no reuse-catalog.yaml para evitar nova duplicação.
    prevention: >
      Todo /nimbus-code-plan DEVE começar com consulta ao docs/reuse-catalog.yaml
      E ao docs/harness/harness-catalog.yaml antes de desenhar qualquer solução.
      Se encontrar padrão existente, referenciar por ponteiro no plan.md — nunca
      re-derivar do zero. Declarar na tabela de Classificação de Complexidade:
      "Padrão reutilizado encontrado? Sim/Não".
    tags:
      - reuse-catalog-skip
      - duplicate-pattern
      - infra-automation
      - planning-gate-bypass
    source_pr: ""
    similar_contexts:
      - spec-kit-workflow
      - dev-platform
      - data-platform

  - id: HRN-0004
    date: 2026-08-24
    complexity: S3
    bounded_context: spec-kit-workflow
    error_pattern: >
      Drift entre estado do código e estado real em produção/execução (ex.: issue
      marcada como concluída sem validação de execução real no ambiente alvo).
    root_cause: >
      Fechamento baseado apenas em evidência estrutural/local (lint, arquivo,
      simulação) sem checklist explícito de validação operacional no ambiente real
      quando a task exigia infraestrutura externa (Actions, Codespaces, segredos).
    impact: >
      Backlog aparenta convergência maior que a real; pendências operacionais só são
      descobertas depois, gerando reabertura de issues e retrabalho de coordenação.
    fix_applied: >
      Separação explícita entre "concluído tecnicamente" e "pendente operacional";
      tasks/issues operacionais passam a receber status:blocked até validação real.
    prevention: >
      Para qualquer task que dependa de ambiente externo, exigir evidência de execução
      real (run id, screenshot, log, ou validação humana formal) antes de fechar.
      Sem essa evidência, manter issue aberta e rotular status:blocked com critério
      objetivo de desbloqueio.
    tags:
      - code-production-drift
      - operational-validation-gap
      - backlog-convergence
      - spec-013
    source_pr: ""
    similar_contexts:
      - dev-platform
      - infra-automation

  - id: HRN-0005
    date: 2026-11-04
    complexity: S2
    bounded_context: spec-kit-workflow
    error_pattern: >
      /speckit-taskstoissues foi executado a partir de specs/ de outro projeto local
      (fora deste repositório) e criou 23 issues neste repositório referentes a
      features de outro produto ("Nuvem365" #346-356 e "Oracle Billing Import
      Configuration" #419-430, código Java de `nuvem365-portal-back`), sem que
      exista spec correspondente em specs/ deste repositório.
    root_cause: >
      O comando não validou que o repositório de destino (remote/gh default repo)
      correspondia ao projeto de onde as specs estavam sendo lidas. O usuário tinha
      múltiplos projetos/worktrees abertos localmente e o CLI usou o repositório
      remoto configurado no diretório de trabalho, que apontava para este template,
      mesmo com as specs vindo de outro produto.
    impact: >
      23 issues estranhas ao domínio poluindo o backlog deste repositório, algumas
      já rotuladas automaticamente pelo backfill de governança como se fossem
      trabalho real deste projeto — risco de um agente autônomo tentar implementar
      código Java de outro produto dentro deste repo de spec-kit.
    fix_applied: >
      Identificado e reportado ao Dev durante auditoria de labels/DRAFTS; ação de
      fechamento/transferência das 23 issues fica pendente de decisão explícita
      do Dev (fechar como "not planned" vs. recriar no repositório correto).
    prevention: >
      Antes de rodar /speckit-taskstoissues, exibir e confirmar explicitamente o
      repositório de destino resolvido (`gh repo view` / `git remote -v`) e validar
      que o feature-slug do caminho de origem das specs existe em specs/ do
      repositório de destino. Abortar com erro claro em caso de divergência, em vez
      de criar issues silenciosamente no repo errado.
    tags:
      - cross-repo-issue-creation
      - speckit-taskstoissues
      - wrong-repo-target
      - backlog-pollution
    source_pr: ""
    similar_contexts:
      - dev-platform
      - infra-automation

  - id: HRN-0006
    date: 2026-11-04
    complexity: S3
    bounded_context: spec-kit-workflow
    error_pattern: >
      plan.md da spec-024 assumiu que todos os 12 comandos /speckit-* eram geridos
      pelo `specify` CLI upstream; 2 comandos customizados do Nimbus-Code
      (speckit-interview, speckit-nimbus-code-backlog-sync-sync) nunca são
      sincronizados por ele e ficaram ausentes em .claude/skills/ e .agents/skills/.
      O teste de paridade (bats) replicou a mesma suposição errada e não detectou
      a lacuna, mesmo com 33/33 tasks marcadas como concluídas.
    root_cause: >
      Falta de verificação empírica da premissa "specify CLI gerencia todos os
      /speckit-*" antes de codificá-la no plan.md e no teste automatizado. Os 2
      comandos são extensões proprietárias do preset (não existem no spec-kit
      upstream), então `specify integration install` os ignora silenciosamente,
      e a lista hardcoded SPECKIT_COMMANDS no teste bats reproduziu a mesma lacuna.
    impact: >
      Usuários de Claude Code/Antigravity não tinham acesso a /speckit-interview
      nem a /speckit-nimbus-code-backlog-sync-sync nessas integrações, apesar de
      todos os testes automatizados "passando" — drift descoberto apenas por
      auditoria manual comparando .github/skills/ com .claude/skills/.
    fix_applied: >
      scripts/sync-nc-agents-to-integrations.sh estendido com array
      EXTRA_SPECKIT_SKILLS para sincronizar explicitamente os 2 comandos
      customizados para Claude e Antigravity (incluindo correção de um bug de
      injeção de argument-hint em descrições YAML dobradas/multi-linha);
      tests/multi-agent-integration/nc-agents-parity.bats ganhou AC7 cobrindo
      esses 2 comandos com verificação de paridade de hash.
    prevention: >
      Ao assumir que uma ferramenta externa "já cuida" de um subconjunto de
      arquivos, validar enumerando os arquivos-fonte reais (ex.: ls .github/skills/)
      e comparando 1:1 com o que a ferramenta de fato instala, em vez de aceitar
      uma contagem agregada ("12 comandos") sem checar cada nome individualmente.
      Testes de paridade devem iterar sobre a lista real de diretórios-fonte
      (glob), não sobre uma lista hardcoded que pode ficar desatualizada.
    tags:
      - multi-agent-integration
      - custom-speckit-commands
      - sync-gap
      - spec-024
      - test-coverage-gap
    source_pr: ""
    similar_contexts:
      - dev-platform
      - spec-kit-workflow

  - id: HRN-0007
    date: 2026-09-22
    complexity: S3
    bounded_context: spec-kit-workflow
    error_pattern: >
      Ao corrigir HRN-0006 trocando listas hardcoded (AGENTS/EXPECTED_AGENTS)
      por descoberta via glob sobre .github/skills/nc-*, a correção sozinha não
      era suficiente: 3 agentes (nc-bug-assess, nc-bug-fix, nc-bug-test) existiam
      como skill mas nunca tiveram entrada em .nimbus/agent-manifest.yaml — a
      descoberta dinâmica passaria a encontrá-los e o gerador falharia
      (manifest roles missing) ao tentar sincronizá-los.
    root_cause: >
      Quando a extensão "bug" foi adicionada ao preset, os 3 agentes NC-Bug-*
      foram criados como SKILL.md mas o registro de governança correspondente
      no manifest (tool_allowlist, allowed_file_scope, human_approval_policy)
      nunca foi criado — divergindo do padrão já seguido por NC-Assess-*, que
      também vem de extensão mas tem entrada completa no manifest.
    impact: >
      Sem essa correção adicional, a mitigação de HRN-0006 (descoberta dinâmica)
      teria travado a geração de agentes para todos os 5 alvos assim que
      implementada, exigindo debugging reativo em vez de correção planejada.
    fix_applied: >
      Adicionadas 3 novas entradas em .nimbus/agent-manifest.yaml (NC-Bug-Assess,
      NC-Bug-Fix, NC-Bug-Test) seguindo o padrão de NC-Critic/NC-Assess-Intake,
      com escopo de escrita em .specify/bugs/*/{assessment,fix,test}.md (e
      src/**, tests/**, etc. para NC-Bug-Fix/NC-Bug-Test) — decisão confirmada
      explicitamente com o usuário antes da implementação (spec 028).
    prevention: >
      Ao introduzir um novo agente NC-* (via extensão ou nativo), SEMPRE criar a
      entrada correspondente em .nimbus/agent-manifest.yaml no mesmo PR que cria
      o SKILL.md — nunca deixar o registro de governança para depois. Ao
      corrigir uma descoberta hardcoded → dinâmica em qualquer catálogo (agentes,
      comandos, integrações), testar a descoberta ANTES de assumir que o
      restante do pipeline (ex.: validação de manifest) já cobre 100% dos itens
      que serão descobertos.
    tags:
      - agent-manifest-drift
      - governance-registration-gap
      - dynamic-discovery
      - spec-028
      - hrn-0006-followup
    source_pr: ""
    similar_contexts:
      - dev-platform
      - spec-kit-workflow

  - id: HRN-0008
    date: 2026-09-22
    complexity: S3
    bounded_context: spec-kit-workflow
    error_pattern: >
      Spec 028 estendeu scripts/lib/nc-agent-sync.py e
      scripts/sync-nc-agents-to-integrations.sh com os alvos "cursor" e
      "kiro", validou tudo dentro deste repositório-template, mas nunca
      atualizou bootstrap.sh — o script que repositórios satélite usam para
      instalar/atualizar o bundle. O `case "$INTEGRATION"` que decide qual
      alvo de sync de agentes NC-* disparar continuou cobrindo apenas
      claude/antigravity/all; cursor-agent e kiro-cli caíam silenciosamente
      em nenhum case (`esac` sem `*)`), sem erro, sem log — nenhum satélite
      configurado com essas integrações jamais receberia os agentes NC-* nem
      os 10 comandos /speckit-* proprietários, mesmo após bootstrap ou
      refresh gerenciado.
    root_cause: >
      A validação da spec 028 ficou inteiramente dentro do repositório-
      template (testes bats + instalação manual local), sem exercitar o
      caminho real de propagação para consumidores (bootstrap.sh apply/
      --refresh-preset). O `case` de bootstrap.sh é uma segunda tradução
      (chave real do `specify` CLI → alvo interno do gerador) que não é
      coberta por nenhum teste de paridade existente, então a extensão para
      2 alvos novos não "quebrou" nenhum teste — apenas deixou de propagar.
    impact: >
      Detectado antes de qualquer satélite real adotar Cursor/Kiro (achado
      do próprio usuário revisando o PR, não de um incidente em produção),
      mas representa exatamente o tipo de drift silencioso que só apareceria
      quando um time real tentasse usar a integração nova e notasse a
      ausência dos agentes institucionais dias/semanas depois.
    fix_applied: >
      bootstrap.sh: adicionados os casos `cursor-agent|cursor)` e
      `kiro-cli|kiro)` ao dispatch de sync-nc-agents-to-integrations.sh
      (mapeando as chaves reais do catálogo `specify integration list` para
      os alvos internos do gerador); texto de uso (`--integration`)
      atualizado para não sugerir uma lista desatualizada e incompleta.
      Novo teste de regressão (`bootstrap-nc-agent-sync-coverage.bats`)
      extrai dinamicamente `TARGETS` de nc-agent-sync.py e falha se
      bootstrap.sh não tiver `--target <alvo>` para cada um — protege contra
      a mesma lacuna se um 6º alvo for adicionado no futuro.
    prevention: >
      Toda vez que um novo alvo/integração for adicionado ao gerador de
      agentes NC-* (TARGETS em nc-agent-sync.py), tratar bootstrap.sh como
      parte OBRIGATÓRIA do escopo da mesma feature — é o único caminho real
      de propagação para repositórios satélite, não apenas um "detalhe de
      infra" a revisar depois. Antes de fechar uma feature de integração
      multi-agente, rodar (ou pelo menos ler) o `case "$INTEGRATION"` de
      bootstrap.sh e confirmar que o novo alvo está representado — não
      confiar apenas em testes que rodam dentro do próprio template.
    tags:
      - satellite-propagation-gap
      - bootstrap-integration-dispatch
      - multi-agent-integration
      - spec-028
      - silent-drift
    source_pr: ""
    similar_contexts:
      - dev-platform
      - spec-kit-workflow
