schema_version: "1.0"

workflow:
  id: "vpndev-full-cycle"
  name: "VPN Dev — Ciclo Completo com Gate DevSecOps"
  version: "1.0.0"
  author: "VPN Dev"
  description: "Ciclo SDD completo (specify → plan → tasks → implement → converge) com gates de DevSecOps, grafo de módulos, release strategy e convergência pós-implementação."

requires:
  speckit_version: ">=0.16.0"
  integrations:
    any:
      - "copilot"

inputs:
  spec:
    type: string
    required: true
    prompt: "Descreva o que você quer construir"
  integration:
    type: string
    default: "auto"
    prompt: "Integração a usar ('auto' usa a integração já inicializada no projeto)"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Revisar a spec gerada antes de planejar."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: devsecops-gate
    type: gate
    message: "Roteiro de implantação e avaliação DevSecOps (seção 'VPN Dev — Security & DevSecOps Gate' do plan.md, preenchida via /devops-planning ou manualmente) foram revisados e aprovados?"
    options: [approve, reject]
    on_reject: abort

  - id: graph-gate
    type: gate
    message: |
      Grafo de módulos obrigatório:
      - specs/<feature>/graph.yaml existe e está atualizado?
      - specs/<feature>/graph.md existe e está atualizado?
      - Para S3/S4: specs/<feature>/impact-map.md existe?
      - Complexidade da feature foi classificada (S0–S4) no plan.md?
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"

  - id: review-tasks
    type: gate
    message: "Revisar as tasks geradas (incluindo o checklist de qualidade de infraestrutura/deploy anexado pelo preset vpndev-standards) antes de implementar."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    description: |
      Compara o código implementado com spec.md, plan.md e tasks.md.
      Detecta divergências, critérios de aceitação não cobertos e novas
      decisões técnicas tomadas durante a implementação que precisam ser
      registradas.

  - id: converge-gate
    type: gate
    message: |
      Pós-implementação — verificar antes de abrir o PR:
      - Todas as divergências identificadas pelo converge foram resolvidas
        ou documentadas no Architecture Decision Log do plan.md?
      - graph.yaml e graph.md refletem o estado REAL do código implementado
        (não apenas o planejado)?
      - Para S3/S4: impact-map.md foi atualizado com os riscos descobertos
        durante a implementação?
      - SLOs medidos em staging estão dentro dos limites definidos no plan.md?
      - Feature flags criadas têm critério de remoção documentado?
    options: [approve, reject]
    on_reject: abort

tags:
  - "sdd"
  - "devsecops"
  - "vpndev"
