# execution-policy.yaml — contrato de execução permitido para o repositório.
#
# Este arquivo separa explicitamente os três planos:
# - Evidence Plane: discovery, inventário e coleta de evidência (somente-leitura)
# - Desired State Plane: baselines, zero-diff, drift e landing zone (planejamento)
# - Delivery Plane: apply protegido, sempre humano e fora do caminho autônomo

schema_version: "1.0"
policy_id: "platform-advisory-default"

planes:
  evidence:
    allowed_actions:
      - "discovery"
      - "inventory"
      - "refresh-only-plan"
      - "drift-read"
    forbidden_actions:
      - "terraform-apply"
      - "terraform-destroy"
      - "cloud-write-cli"
    required_identity: "readonly-discovery"
  desired_state:
    allowed_actions:
      - "baseline-versioning"
      - "zero-diff-validation"
      - "landing-zone-design"
      - "drift-analysis"
    forbidden_actions:
      - "apply-from-pr"
      - "manual-console-fix-without-evidence"
    required_identity: "planner-readonly"
  delivery:
    allowed_actions:
      - "protected-apply-after-human-approval"
      - "audited-remediation"
    forbidden_actions:
      - "autonomous-agent-trigger"
      - "default-github-token-cloud-access"
    required_identity: "dedicated-delivery-identity"

runtime:
  default_mode: "advisory-only"
  allow_direct_cloud_write: false
  require_zero_diff_before_managed: true
  require_human_approval_for_delivery: true
  approved_environment: "production-apply"
  audit_trail_required: true

read_only_commands_examples:
  # Exemplos permitidos. Adapte sem remover a natureza read-only.
  terraform:
    - "terraform plan -refresh-only -lock=false -input=false"
    - "terraform show -json tfplan"
  azure:
    - "az resource list"
  aws:
    - "aws resourcegroupstaggingapi get-resources"
  gcp:
    - "gcloud asset search-all-resources"
  kubernetes:
    - "kubectl get all --all-namespaces"

exceptions:
  allowed: false
  process: >-
    Exceções são registradas em platform/drift-policy.yaml e nunca liberam apply
    automático neste repositório. Quando necessárias, exigem owner, validade,
    justificativa e evidência associada.
