name: Close referenced issues fallback

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close-referenced-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close referenced open issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const text = `${pr.title || ""}\n${pr.body || ""}`;

            const collected = new Set();

            // 1) Standard auto-close keywords that might not have been interpreted upstream.
            const keywordRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/ig;
            for (const match of text.matchAll(keywordRegex)) {
              collected.add(Number(match[1]));
            }

            // 2) "Issues Resolvidas" section used by the team (table/list format).
            const resolvedSection = text.match(/##\s*Issues\s+Resolvidas([\s\S]*?)(?:\n##\s+|$)/i);
            if (resolvedSection) {
              for (const match of resolvedSection[1].matchAll(/#(\d+)/g)) {
                collected.add(Number(match[1]));
              }
            }

            // 3) Fallback line style: "issues #123, #124"
            const issuesLineRegex = /\bissues?\b[^\n]*/ig;
            for (const line of text.match(issuesLineRegex) || []) {
              for (const match of line.matchAll(/#(\d+)/g)) {
                collected.add(Number(match[1]));
              }
            }

            const candidates = [...collected].filter((n) => n > 0 && n !== pr.number);
            core.info(`Referenced issue candidates: ${candidates.join(", ") || "(none)"}`);

            for (const issue_number of candidates) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number });

                // Skip PRs and already-closed issues.
                if (issue.data.pull_request || issue.data.state !== "open") {
                  continue;
                }

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number,
                  state: "closed",
                  state_reason: "completed",
                });

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: `Fechada automaticamente via fallback após merge da PR #${pr.number} (${pr.html_url}).`,
                });

                core.info(`Closed issue #${issue_number}`);
              } catch (error) {
                core.warning(`Failed to process #${issue_number}: ${error.message}`);
              }
            }
