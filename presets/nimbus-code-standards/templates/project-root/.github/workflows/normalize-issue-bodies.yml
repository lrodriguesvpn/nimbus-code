name: Normalizar corpo das issues no formato híbrido

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to normalize"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  normalize-issue-body:
    name: Normalizar issue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar corpo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          ISSUE_NUMBER="${ISSUE_NUMBER:-${INPUT_ISSUE_NUMBER:-}}"
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            scripts/normalize-github-issues.sh --repo "$REPO" --issue "$ISSUE_NUMBER"
          else
            scripts/normalize-github-issues.sh --repo "$REPO"
          fi
