name: NC Agents Parity Check

on:
  pull_request:
    paths:
      - '.github/skills/nc-*/**'
      - '.claude/skills/nc-*/**'
      - '.agents/skills/nc-*/**'
      - 'scripts/sync-nc-agents-to-integrations.sh'
      - 'tests/multi-agent-integration/**'
  push:
    branches:
      - main
      - develop

jobs:
  parity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bats and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats python3

      - name: Run NC Agents Parity Test Suite
        run: |
          bats tests/multi-agent-integration/nc-agents-parity.bats
