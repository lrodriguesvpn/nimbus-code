# Bounded Contexts — <project-name>
#
# Lista oficial dos bounded contexts deste projeto.
# Usada como fonte de verdade para:
#   - O campo "Bounded Context" do spec-template.md (validado pelo agente)
#   - O flag --bounded-contexts do /speckit-specify (create-new-feature.sh)
#   - O setup-github-project.sh (vincula repos ao Project V2 cross-repo)
#   - O /speckit-taskstoissues (roteia Tasks para o repo correto por contexto)
#
# Estratégia MultiRepo:
#   Este arquivo implementa a estratégia "1 Repo Central de Specs + N Repos
#   por stack/microsserviço". O Repo Central hospeda specs/, docs/ e o board
#   (GitHub Project V2). Cada contexto tem seu próprio repo de código onde
#   o Copilot Agent abre PRs e onde as Tasks são criadas.
#
# Como usar:
#   1. Ao preencher o cabeçalho obrigatório do spec-template.md, escolha um
#      slug desta lista — não invente novos nomes sem adicionar aqui primeiro.
#   2. Para adicionar um novo bounded context (= novo microsserviço/repo):
#      abra uma PR com a nova entrada e justificativa. A revisão segue o
#      mesmo fluxo de ADR (ver docs/adr/).
#   3. O agente verifica esta lista antes de preencher "Bounded Context" na
#      spec — se não encontrar match, propõe adição em vez de usar nome ad-hoc.
#   4. Após adicionar entradas, rode setup-github-project.sh para vincular
#      os novos repos ao Project V2 automaticamente.
#
# Convenção de slug: kebab-case, substantivo no singular.
#   Exemplos: order-management, identity, billing, notification, platform
#
# Convenção de nomes de repos:
#   svc-<slug>    → microsserviços de backend
#   frontend-<slug> → aplicações frontend
#   mobile-<slug> → aplicações mobile
#   lib-<slug>    → bibliotecas compartilhadas
#   infra         → infraestrutura (Terraform/IaC)

version: 1
contexts:
  []

# Exemplo completo (remova os comentários e ajuste):
#
# contexts:
#   - slug: "order-management"
#     description: "Ciclo de vida de pedidos: criação, atualização, cancelamento e histórico."
#     repository: "<org>/svc-orders"       # repo onde o código vive e PRs são abertos
#     stack: "Node.js"                      # tecnologia principal (informativo)
#     team: "<time-ou-dev-responsavel>"     # squad owner deste contexto
#     autonomous_ok: true                   # true = Copilot Agent pode trabalhar sem supervisão
#                                           # false = label agent:needs-human aplicado nas Tasks
#
#   - slug: "identity"
#     description: "Autenticação, autorização, SSO e gestão de identidades de usuário."
#     repository: "<org>/svc-auth"
#     stack: "Go"
#     team: "<time-ou-dev-responsavel>"
#     autonomous_ok: true
#
#   - slug: "billing"
#     description: "Faturamento, cobranças, integração com gateways de pagamento."
#     repository: "<org>/svc-payments"
#     stack: "Python"
#     team: "<time-ou-dev-responsavel>"
#     autonomous_ok: false   # dados financeiros — requer revisão humana
#
#   - slug: "frontend-web"
#     description: "Aplicação web principal (SPA)."
#     repository: "<org>/frontend-web"
#     stack: "React/Next.js"
#     team: "<time-ou-dev-responsavel>"
#     autonomous_ok: true
#
#   - slug: "infra"
#     description: "Infraestrutura compartilhada (Terraform, CI/CD, networking)."
#     repository: "<org>/infra"
#     stack: "Terraform"
#     team: "<time-ou-dev-responsavel>"
#     autonomous_ok: false   # mudanças de infra exigem revisão humana (S4)
