# graph.yaml — Grafo de Módulos estruturado por feature
#
# OBRIGATÓRIO: criado junto com spec.md (/nimbus-code-specify) e mantido
# atualizado a cada tarefa que adiciona, remove ou renomeia um módulo/serviço.
# Arquivo lido pelo GitHub Action Graph Guard para validar consistência.
#
# Campos:
#   feature    — slug da feature (mesmo nome da pasta em specs/)
#   complexity — S0 | S1 | S2 | S3 | S4  (ver docs/model-selection.md)
#   version    — incrementar a cada atualização estrutural
#   nodes      — módulos/serviços envolvidos
#   edges      — dependências entre nós (src → dst com tipo e protocolo)
#   externals  — sistemas fora do repositório atual (third-party, cloud services)

feature: "<feature-slug>"           # ex.: checkout-redesign
complexity: "S2"                    # S0 | S1 | S2 | S3 | S4
version: 1
updated_at: "YYYY-MM-DD"
spec_ref: "specs/<feature-slug>/spec.md"

nodes:
  - id: "api-gateway"
    type: "service"           # service | module | library | database | queue | external
    path: "services/api-gateway"
    description: "Ponto de entrada HTTP, autenticação JWT"

  - id: "order-service"
    type: "service"
    path: "services/order-service"
    description: "Orquestra criação e atualização de pedidos"

  - id: "order-db"
    type: "database"
    path: "infrastructure/rds/order"
    description: "PostgreSQL — dados de pedidos"

  # Remover os nós de exemplo acima e adicionar os reais da feature

edges:
  - src: "api-gateway"
    dst: "order-service"
    type: "sync"              # sync | async | event
    protocol: "HTTP/REST"
    description: "Repassa requisições de pedido autenticadas"

  - src: "order-service"
    dst: "order-db"
    type: "sync"
    protocol: "PostgreSQL/TLS"
    description: "Leitura e escrita de pedidos"

  # Remover as arestas de exemplo acima e adicionar as reais da feature

externals:
  - id: "payment-api"
    provider: "Stripe"
    called_by: ["order-service"]
    criticality: "high"       # high | medium | low
    fallback: "fila de retry com dead-letter"

  # Remover os externos de exemplo e adicionar os reais (ou deixar vazio: [])
