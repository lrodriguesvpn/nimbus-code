schema_version: "1.0"

preset:
  id: "nimbus-code-platform-standards"
  name: "Nimbus-Code — Padrões de Plataforma/Cliente (Ambientes e Legado)"
  version: "0.5.0"
  description: "Constituição para repositórios de PLATAFORMA/CLIENTE/TENANT (ambientes, contas cloud, tenants M365/GWS/D365 e sistemas legados) — inventário multi-nuvem, contracts do Evidence Plane / Desired State Plane / Delivery Plane, pipeline de ciclo de vida (discovery → imported → plan_diff_zero → landing_zone_generated → managed), regra de zero-diff e proibição de apply direto fora do workflow protegido."
  author: "Nimbus-Code"
  repository: "https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/nimbus-code"
  license: "Proprietary"

requires:
  speckit_version: ">=0.16.0"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      strategy: "wrap"
      replaces: "constitution-template"
      description: "Regra de não tocar produção diretamente, critério de verdade por zero-diff, cobertura multi-nuvem e separação Evidence/Desired State/Delivery Plane."

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      strategy: "append"
      replaces: "plan-template"
      description: "Classificação de ambiente/cliente/nuvem, gate de fase com evidência obrigatória, ferramenta de reconciliação por domínio e checklist de zero-diff."

    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      strategy: "prepend"
      replaces: "spec-template"
      description: "Cabeçalho obrigatório com cliente/tenant, ambiente, nuvens envolvidas e classificação de legado."

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      strategy: "append"
      replaces: "tasks-template"
      description: "Checklist de reconciliação zero-diff, extração read-only de schema e confirmação de que a tarefa não aplicou mudança direta em ambiente."

    - type: "template"
      name: "nimbus-discovery-report"
      file: "templates/feature-artifacts/nimbus-discovery-report.md"
      description: "Relatório formal da fase de Discovery. Pré-requisito para avançar de discovery para imported."

    - type: "template"
      name: "landing-zone-design"
      file: "templates/feature-artifacts/landing-zone/design.md"
      description: "Topologia da Landing Zone derivada do estado real e do zero-diff confirmado."

    - type: "template"
      name: "landing-zone-checklist-caf"
      file: "templates/feature-artifacts/landing-zone/checklist-caf.md"
      description: "Checklist de aderência ao CAF por nuvem."

    - type: "template"
      name: "platform-graph-yaml"
      file: "templates/feature-artifacts/platform-graph.yaml"
      description: "Grafo estruturado com hierarquia platform -> surface -> workload, lifecycle stage, owner, evidência e dependências."

    - type: "template"
      name: "platform-graph-md"
      file: "templates/feature-artifacts/platform-graph.md"
      description: "Grafo humano em Mermaid com o resumo do lifecycle e das dependências workload -> surface."

    - type: "template"
      name: "legacy-inventory"
      file: "templates/feature-artifacts/legacy-inventory.md"
      description: "Checklist de auditoria as-is por nuvem/domínio."

    - type: "template"
      name: "db-schema-registry"
      file: "templates/feature-artifacts/db-schema-registry.md"
      description: "Catálogo de schemas (DDL, somente leitura) de bancos de sistemas legados."

    - type: "template"
      name: "copilot-instructions"
      file: "templates/project-root/copilot-instructions.md"
      description: "Instruções do Copilot para repositório de plataforma: regra de nunca aplicar mudança e fluxo de reconciliação."

    - type: "template"
      name: "platform-profile"
      file: "templates/project-root/.nimbus/platform-profile.yaml"
      description: "Perfil do cliente/tenant com owners, criticidade, provedores, ambientes, residência de dados e política de execução."

    - type: "template"
      name: "execution-policy"
      file: "templates/project-root/.nimbus/execution-policy.yaml"
      description: "Contrato dos três planos operacionais (Evidence, Desired State e Delivery), incluindo identidades e guardrails."

    - type: "template"
      name: "evidence-registry"
      file: "templates/project-root/platform/evidence-registry.yaml"
      description: "Registro versionado de evidências, freshness e origem do discovery/read-only plan."

    - type: "template"
      name: "baseline-registry"
      file: "templates/project-root/platform/baseline-registry.yaml"
      description: "Catálogo de baselines versionadas com owner, evidência e exceções auditáveis."

    - type: "template"
      name: "drift-policy"
      file: "templates/project-root/platform/drift-policy.yaml"
      description: "Política de drift, freshness, severidade e bloqueio de avanço de lifecycle."

    - type: "template"
      name: "customer-profile"
      file: "templates/project-root/customer-profile.yaml"
      description: "Cadastro organizacional do cliente com owners, janelas de mudança e contexto de governança."

    - type: "template"
      name: "workload-links"
      file: "templates/project-root/workload-links.yaml"
      description: "Vínculo entre workloads e superfícies de plataforma compartilhadas."

    - type: "template"
      name: "evidence-record"
      file: "templates/project-root/evidence-record.yaml"
      description: "Schema unitário de evidência para anexos e artifacts do Evidence Plane."

    - type: "template"
      name: "drift-finding"
      file: "templates/project-root/drift-finding.yaml"
      description: "Schema unitário de finding de drift com severidade, owner e trilha de remediação."

    - type: "template"
      name: "evidence-refresh-workflow"
      file: "templates/project-root/.github/workflows/evidence-refresh.yml"
      description: "Workflow somente-leitura para discovery, refresh de evidência e upload de artifacts."

    - type: "template"
      name: "terraform-plan-workflow"
      file: "templates/project-root/.github/workflows/terraform-plan.yml"
      description: "Workflow de terraform plan com zero-diff, bloqueio de destroy inesperado e evidência anexada ao PR."

    - type: "template"
      name: "protected-apply-workflow"
      file: "templates/project-root/.github/workflows/protected-apply.yml"
      description: "Contrato do Delivery Plane protegido, com Environment, aprovação humana, identidade dedicada e auditoria."

    - type: "template"
      name: "validate-no-direct-write-commands"
      file: "templates/project-root/scripts/validate-no-direct-write-commands.sh"
      description: "Validador que bloqueia apply/destroy e verbos de escrita direta nos scripts/workflows read-only do preset."

tags:
  - "governance"
  - "platform"
  - "multi-cloud"
  - "legacy"
  - "infrastructure-as-code"
  - "nimbus-code"
  - "terraform"
  - "m365"
  - "d365"
  - "drift-detection"
  - "landing-zone"
  - "caf"
  - "discovery"
  - "lifecycle"
  - "evidence-plane"
  - "desired-state-plane"
  - "delivery-plane"
