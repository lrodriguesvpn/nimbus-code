schema_version: "1.0"
orchestration:
  profile: "platform"
  description: >
    Plano de execução controlada do esquadrão NC-* em modo observation-first,
    com gates humanos, handoff formal e encerramento fail-closed.
  states: ["queued", "awaiting_scope_lock", "running", "retry_scheduled", "waiting_human_approval", "waiting_handoff", "blocked", "succeeded", "failed", "partial", "cancelled", "aborted"]
  phase_dependencies:
    - { phase: "NC-Intake", depends_on: [] }
    - { phase: "NC-Spec", depends_on: ["NC-Intake"] }
    - { phase: "NC-Critic", depends_on: ["NC-Spec"] }
    - { phase: "NC-Governor", depends_on: ["NC-Critic"] }
    - { phase: "NC-Arch", depends_on: ["NC-Governor"] }
    - { phase: "NC-Shield", depends_on: ["NC-Arch"] }
    - { phase: "NC-QA", depends_on: ["NC-Shield"] }
    - { phase: "NC-Builder", depends_on: ["NC-QA"] }
    - { phase: "NC-Telemetry", depends_on: ["NC-Builder"] }
  retry_policy:
    total_retry_budget: 8
    default_max_retries_per_phase: 2
    non_retryable_conditions: ["scope_violation", "secret_detected", "unexpected_destroy_command", "missing_human_approval", "conflicting_scope_lock"]
    backoff: { strategy: "exponential", base_seconds: 30, multiplier: 2, max_seconds: 300, jitter: "full" }
  timeouts:
    overall_execution_minutes: 240
    per_phase_minutes: { NC-Intake: 45, NC-Spec: 60, NC-Critic: 45, NC-Governor: 30, NC-Arch: 60, NC-Shield: 60, NC-QA: 60, NC-Builder: 90, NC-Telemetry: 45 }
  stop_conditions:
    - { code: "scope_violation", action: "abort_immediately", rationale: "Qualquer escrita fora do escopo declarado encerra a execução." }
    - { code: "secret_detected", action: "abort_immediately", rationale: "Segredo detectado exige contenção e revisão humana." }
    - { code: "unexpected_destroy_command", action: "abort_immediately", rationale: "Comando destrutivo inesperado é proibido no plano de controle." }
    - { code: "conflicting_scope_lock", action: "abort_immediately", rationale: "Dois agentes não podem manter lock sobre o mesmo arquivo." }
    - { code: "missing_formal_handoff", action: "block_until_resolved", rationale: "Toda transição entre fases precisa de handoff formal." }
    - { code: "retry_budget_exhausted", action: "fail_phase", rationale: "A fase falha quando o orçamento de retry é consumido." }
  human_gates:
    - gate_id: "governance-complexity-gate"
      before_phase: "NC-Arch"
      required_when: { complexity_any_of: ["S3", "S4"] }
      evidence_required: ["classificacao_s0_s4_registrada", "raci_definido"]
    - gate_id: "security-and-build-gate"
      before_phase: "NC-Builder"
      required_when: { complexity_any_of: ["S3", "S4"] }
      evidence_required: ["graph_atualizado", "security_gate_preenchido", "strategia_de_testes_aprovada"]
    - gate_id: "final-handoff-gate"
      before_phase: "NC-Telemetry"
      required_when: { complexity_any_of: ["S0", "S1", "S2", "S3", "S4"] }
      evidence_required: ["contrato_de_handoff_completo", "resultado_final_registrado"]
  handoff_policy:
    contract_path: ".nimbus/contracts/delivery-handoff.contract.yaml"
    baton_pass_required_between_all_phases: true
    required_fields: ["result_summary", "quality_evidence", "acceptance_evidence", "cost_ai_tokens", "execution_time_minutes", "cost_human_hours", "quality_status", "rework_summary", "final_decision"]
    baton_pass_chain:
      - { from: "NC-Intake", to: "NC-Spec" }
      - { from: "NC-Spec", to: "NC-Critic" }
      - { from: "NC-Critic", to: "NC-Governor" }
      - { from: "NC-Governor", to: "NC-Arch" }
      - { from: "NC-Arch", to: "NC-Shield" }
      - { from: "NC-Shield", to: "NC-QA" }
      - { from: "NC-QA", to: "NC-Builder" }
      - { from: "NC-Builder", to: "NC-Telemetry" }
  cancellation_and_recovery:
    cancel_actions: ["release_scope_lock", "persist_execution_log", "notify_last_human_gate_owner"]
    recovery_requirements: ["restaurar_ultimo_handoff_valido", "revalidar_locks_de_escopo", "reavaliar_gate_humano_se_complexidade_S3_ou_S4"]
