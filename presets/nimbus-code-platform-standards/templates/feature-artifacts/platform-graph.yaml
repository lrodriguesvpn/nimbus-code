# platform-graph.yaml — grafo estruturado de plataforma/superfície/workload.
#
# Fonte de verdade do relacionamento entre:
#   plataforma -> superfície compartilhada -> workload consumidor
#
# Campos mínimos obrigatórios por plataforma:
#   - platform_id
#   - lifecycle_stage
#   - owner
#   - evidence
#   - surfaces[]
#   - workloads[]
#
# Lifecycle oficial:
#   discovery -> imported -> plan_diff_zero -> landing_zone_generated -> managed

schema_version: "1.0"
client:
  id: "cliente-frontier"
  display_name: "Cliente Frontier"
  primary_owner: "plataforma@cliente.exemplo"
  execution_policy_ref: ".nimbus/execution-policy.yaml"
updated_at: "YYYY-MM-DD"

platforms:
  - platform_id: "azure-prod"
    display_name: "Azure Produção"
    provider: "azure" # azure | aws | gcp | gws | m365 | d365
    environment: "prod"
    lifecycle_stage: "discovery"
    owner:
      team: "plataforma"
      contact: "plataforma@cliente.exemplo"
    evidence:
      latest_ref: "platform/evidence-registry.yaml#ev-azure-prod-plan-2026-09-20"
      freshness_hours: 24
      discovery_report_ref: "specs/<feature-slug>/nimbus-discovery-report.md"
    depends_on: []
    surfaces:
      - surface_id: "azure-hub-network"
        display_name: "Hub Network"
        type: "network"
        owner:
          team: "network"
          contact: "network@cliente.exemplo"
        evidence:
          latest_ref: "platform/evidence-registry.yaml#ev-azure-prod-plan-2026-09-20"
          baseline_ref: "platform/baseline-registry.yaml#bl-azure-hub-network"
        depends_on: []
    workloads:
      - workload_id: "repo-aplicacao-a"
        repository: "https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/repo-aplicacao-a"
        owner: "time-aplicacao-a@cliente.exemplo"
        depends_on:
          - surface_id: "azure-hub-network"
            reason: "egresso e DNS privado"

  - platform_id: "m365-tenant-prod"
    display_name: "M365 Produção"
    provider: "m365"
    environment: "prod"
    lifecycle_stage: "imported"
    owner:
      team: "workplace"
      contact: "workplace@cliente.exemplo"
    evidence:
      latest_ref: "platform/evidence-registry.yaml#ev-m365-baseline-2026-09-20"
      freshness_hours: 24
      discovery_report_ref: "specs/<feature-slug>/nimbus-discovery-report.md"
    depends_on: []
    surfaces:
      - surface_id: "m365-conditional-access-baseline"
        display_name: "Conditional Access Baseline"
        type: "policy"
        owner:
          team: "identity"
          contact: "identity@cliente.exemplo"
        evidence:
          latest_ref: "platform/evidence-registry.yaml#ev-m365-baseline-2026-09-20"
          baseline_ref: "platform/baseline-registry.yaml#bl-m365-ca"
        depends_on: []
    workloads:
      - workload_id: "repo-colaboracao"
        repository: "https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/repo-colaboracao"
        owner: "time-colaboracao@cliente.exemplo"
        depends_on:
          - surface_id: "m365-conditional-access-baseline"
            reason: "políticas de acesso e identidade"
