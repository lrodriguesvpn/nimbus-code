schema_version: "1.0"

preset:
  id: "vpndev-platform-standards"
  name: "VPN Dev — Padrões de Plataforma/Cliente (Ambientes e Legado)"
  version: "0.1.2"
  description: "Constituição para repositórios de PLATAFORMA/CLIENTE/TENANT (ambientes, contas cloud, tenants M365/GWS/D365 e sistemas legados) — inventário multi-nuvem, regra de zero-diff como critério de verdade, proibição de aplicar mudança direta em produção, registro de schemas de bancos legados e o grafo de 2 níveis (plataforma ↔ workload). Complementar ao `vpndev-standards`: um repositório de plataforma usa ESTE preset; repositórios de projeto/workload continuam usando `vpndev-standards`."
  author: "VPN Dev"
  repository: "https://venha-pra-nuvem.ghe.com/venha-pra-nuvem/nimbus-code-spec-kit-template"
  license: "Proprietary"

requires:
  speckit_version: ">=0.16.0"

provides:
  templates:
    # Envolve o template nativo de constituição com os princípios não-negociáveis
    # de um repositório de PLATAFORMA/CLIENTE — não usar junto com o `wrap` de
    # vpndev-standards no mesmo repositório (são presets mutuamente exclusivos
    # por tipo de repositório).
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      strategy: "wrap"
      replaces: "constitution-template"
      description: "Regra de não tocar produção diretamente, critério de verdade por zero-diff, cobertura multi-nuvem (Azure/AWS/GCP/GWS/M365/D365), registro de schemas de legado e grafo de 2 níveis."

    # Acrescenta a classificação de ambiente/cliente, cobertura de IaC por
    # domínio e o checklist de reconciliação zero-diff ao plan-template nativo.
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      strategy: "append"
      replaces: "plan-template"
      description: "Classificação de ambiente/cliente/nuvem, ferramenta de reconciliação por domínio, checklist de zero-diff e impacto em superfícies de plataforma compartilhadas."

    # Acrescenta cabeçalho obrigatório (cliente/tenant, ambiente, nuvens
    # envolvidas, sistema legado sim/não) ao spec-template nativo.
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      strategy: "prepend"
      replaces: "spec-template"
      description: "Cabeçalho obrigatório com cliente/tenant, ambiente, nuvens envolvidas e classificação de legado."

    # Acrescenta o checklist de reconciliação, extração de schema e
    # verificação de que nenhuma mudança foi aplicada diretamente.
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      strategy: "append"
      replaces: "tasks-template"
      description: "Checklist de reconciliação zero-diff, extração read-only de schema e confirmação de que a tarefa não aplicou mudança direta em ambiente."

    # Grafo de 2 níveis: recursos de plataforma (contas/tenants/assinaturas)
    # e quais repositórios de workload dependem de cada superfície.
    - type: "template"
      name: "platform-graph-yaml"
      file: "templates/feature-artifacts/platform-graph.yaml"
      description: "Grafo estruturado de recursos de plataforma, status de cobertura IaC e workloads dependentes."

    - type: "template"
      name: "platform-graph-md"
      file: "templates/feature-artifacts/platform-graph.md"
      description: "Grafo de plataforma em Mermaid para leitura humana (por nuvem/domínio e por workload dependente)."

    # Auditoria "as-is" por nuvem/domínio (Azure, AWS, GCP, GWS, M365, D365).
    - type: "template"
      name: "legacy-inventory"
      file: "templates/feature-artifacts/legacy-inventory.md"
      description: "Checklist de auditoria as-is por nuvem/domínio: recurso, ambiente, ferramenta usada hoje, status de IaC, criticidade, dono."

    # Registro de schemas de bancos de dados de sistemas legados.
    - type: "template"
      name: "db-schema-registry"
      file: "templates/feature-artifacts/db-schema-registry.md"
      description: "Catálogo de schemas (DDL, somente leitura) de bancos de sistemas legados versionados neste repositório."

    - type: "template"
      name: "copilot-instructions"
      file: "templates/project-root/copilot-instructions.md"
      description: "Instruções do Copilot para repositório de plataforma: regra de nunca aplicar mudança em produção, matriz de ferramentas por nuvem/domínio e fluxo de reconciliação."

tags:
  - "governance"
  - "platform"
  - "multi-cloud"
  - "legacy"
  - "infrastructure-as-code"
  - "vpndev"
  - "terraform"
  - "m365"
  - "d365"
  - "drift-detection"
